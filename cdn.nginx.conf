# ============================================================================
# Nginx 配置片段 - 本机 CDN 目录托管（cdn.nginx.conf）
# ============================================================================
# 角色：把 /data/cdn/<env>/<app>/<commit>/ 磁盘目录映射为 /cdn/... URL，
#       环境隔离 + 缓存分层 + 安全头，供微前端模块产物与公共资源直出。
#
# ── 对应关系（Phase 2 §3.1 去指针化，一跳）───────────────────────────────
#   https://kedouai.com/cdn/prod/portal/<commit>/index.js
#       ⇔ {{GATEWAY_HOST}}:/data/cdn/prod/portal/<commit>/index.js
#   https://kedouai.com/cdn/common/libs/vue.js
#       ⇔ {{GATEWAY_HOST}}:/data/cdn/common/libs/vue.js
#
# ── 部署位置 ──────────────────────────────────────────────────────────────
#   服务器：入口机 {{GATEWAY_HOST}}（SSL 终止层）
#   ⚠️ 本文件含【两段】，上下文不同，必须分别 include（不能整文件 include 到一处）：
#
#     【A · HTTP 上下文】map 指令（map 不能放 server 里）
#         → 放进 nginx 主配置的 http {} 块内（或 conf.d/ 顶层，若 conf.d 在 http 内）
#     【B · SERVER 上下文】两个 location 指令
#         → include 到每个 server 块（prod 的 default.conf / kedouai.com 与
#           dev.kedouai.com.conf 两个 server 都要）
#
#   推荐落地：把【A】map 段并入主 nginx.conf 的 http {} 块，
#             把【B】location 段存为 /etc/nginx/conf.d/cdn.inc，
#             在两个 server 块内各加一行 `include /etc/nginx/conf.d/cdn.inc;`。
#
# ── 前置门禁（Phase 2 §2，不满足不得启用 /cdn/）──────────────────────────
#   G2 入口机磁盘 /data 充足；G3 nginx -t 通过且 reload 成功；
#   且 ASSET_URL_MODE 未切 cdn（本配置只是「目录可访问」，切 cdn 是 T2 另一步）。
#
# ── 三条 code review 理由（缺一不可）──────────────────────────────────────
#   1. `^~` 不可省：现网 default.conf 有 `location ~ ^/mcp(/.*)?$` 等正则 location，
#      普通前缀 `location /cdn/` 会被正则抢走；`^~` 明确「前缀命中后不再检查正则」。
#      且 `location /` 是 SPA 回退入口，缺文件落回它会返回 text/html 当 JS —— 正是
#      2026-09-11「白屏无日志」老坑。
#   2. `root` 而非 `alias`：`alias /data/cdn/;` + `try_files $uri =404` 时 $uri 仍带
#      /cdn/ 前缀，会被再拼一次。`root /data/;` 让 /cdn/xxx 自然落到 /data/cdn/xxx。
#   3. `try_files $uri =404` 不可省：否则 /cdn/ 无扩展名路径会被 gateway SPA 回退
#      吃掉（返回 200 + shell HTML），改造后必须为 0。
#
# ── 验收 ──────────────────────────────────────────────────────────────────
#   curl -sSI https://kedouai.com/cdn/common/libs/vue.js  → 200
#   curl -sS https://kedouai.com/cdn/  → 真 404（grep -c __MODULES_MANIFEST__ == 0）
#   curl -sS https://dev.kedouai.com/cdn/prod/xxx.js → 404（跨环境隔离）
# ============================================================================

# ============================================================================
# 【A · HTTP 上下文】环境隔离 map —— 必须放进 http {} 块，不能放 server 里
# ============================================================================
# 用「$host:$uri」组合键做环境隔离，避免在 location 里嵌套 if 判断（if + alias 是已知陷阱）
map "$host:$uri" $cdn_env_allowed {
    default                                  0;
    "~^kedouai\.com:/cdn/prod/"              1;
    "~^www\.kedouai\.com:/cdn/prod/"         1;
    "~^dev\.kedouai\.com:/cdn/dev/"          1;
    "~^[^:]+:/cdn/common/"                   1;   # common 全环境放行
}

# ============================================================================
# 【B · SERVER 上下文】两个 location —— include 到每个 server 块
# ============================================================================

# 公共依赖：更长的 ^~ 前缀优先，no-cache（common/ 全环境共享、路径不随内容变）
location ^~ /cdn/common/ {
    root /data/;                       # 用 root 而非 alias：try_files 与 alias 组合会重复拼前缀
    try_files $uri =404;               # 必须真 404，绝不能落到 SPA 回退
    add_header Cache-Control "no-cache" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cross-Origin-Resource-Policy cross-origin always;
    add_header X-Content-Type-Options nosniff always;
    types { application/javascript js; text/css css; image/svg+xml svg; }
}

# 版本化产物：immutable（/cdn/<env>/<app>/<commit>/ 路径即内容）
location ^~ /cdn/ {
    if ($cdn_env_allowed = 0) { return 404; }   # if 只做 return，是 nginx 官方允许的安全用法
    root /data/;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Access-Control-Allow-Origin "*" always;   # 为阶段三跨域 + UMD crossOrigin 预留
    add_header Cross-Origin-Resource-Policy cross-origin always;
    add_header X-Content-Type-Options nosniff always;
}
