version: '3.8'

services:
  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: web_system_redis
    # 生产环境不暴露 Redis 端口到宿主机，仅内部网络访问
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - web_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API 网关
  gateway:
    build:
      context: .
      dockerfile: servers/gateway/Dockerfile
    container_name: web_system_gateway
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - AUTH_SERVICE_URL=http://auth-service:3001
      - USER_SERVICE_URL=http://user-service:3002
      - AI_SERVICE_URL=http://ai-service:3003
      - PUBLIC_URL=http://106.52.176.246:3000
      # 生产环境务必改为具体域名列表，禁止使用通配符 *
      - CORS_ORIGINS=https://portal.kedouai.com,https://admin.kedouai.com,https://dev.kedouai.com
    depends_on:
      - redis
    networks:
      - web_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # 认证服务
  auth-service:
    build:
      context: .
      dockerfile: servers/auth-service/Dockerfile
    container_name: web_system_auth_service
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_TYPE=mysql
      - DB_HOST=172.16.16.10
      - DB_PORT=3306
      # 生产环境建议使用专用低权限数据库用户，而非 root
      - DB_USERNAME=root
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE=web_system
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=7d
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    networks:
      - web_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # 用户服务
  user-service:
    build:
      context: .
      dockerfile: servers/user-service/Dockerfile
    container_name: web_system_user_service
    environment:
      - NODE_ENV=production
      - PORT=3002
      - DB_TYPE=mysql
      - DB_HOST=172.16.16.10
      - DB_PORT=3306
      # 生产环境建议使用专用低权限数据库用户，而非 root
      - DB_USERNAME=root
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE=web_system
    networks:
      - web_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # AI 对话服务
  ai-service:
    build:
      context: ./servers/ai-service
      dockerfile: Dockerfile
    container_name: web_system_ai_service
    environment:
      - NODE_ENV=production
      - PORT=3003
      - DB_TYPE=mysql
      - DB_HOST=172.16.16.10
      - DB_PORT=3306
      # 生产环境建议使用专用低权限数据库用户，而非 root
      - DB_USERNAME=root
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE=web_system
      - IMAGE_GEN_API_URL=${IMAGE_GEN_API_URL:-https://tokenhub.tencentmaas.com}
      - IMAGE_GEN_API_KEY=${IMAGE_GEN_API_KEY}
      - IMAGE_GEN_MODEL=${IMAGE_GEN_MODEL:-stable-diffusion-xl}
    networks:
      - web_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3003/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  web_network:
    driver: bridge

volumes:
  redis_data:
