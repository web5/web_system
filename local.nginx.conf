# ============================================================
# web_system 本地开发运行配置 (local.nginx.conf)
#
# 用途:
#   在开发机上用本地 nginx 将 web_system 整套服务跑起来。
#   前端静态产物由 nginx 直接托管(与生产 nginx-server.conf 架构一致),
#   /api 反代到本地 Gateway, /mcp 反代到本地 mcp-gateway。
#
# 本地端口规划(80/443 为主入口, 无需端口; 8080-8443 为备用/调试):
#   80    主入口 HTTP  (portal/admin/mcp-admin 静态 + /api + /mcp)
#   443   主入口 HTTPS (同上, HTTP/2, 自签证书)
#   8080  HTTP 网关  -> 301 跳转到 HTTPS
#   8443  HTTPS 网关 -> 反代本地 Gateway (127.0.0.1:6000)
#   8081  portal.kedouai.com   前端静态 + /api
#   8082  admin.kedouai.com    前端静态 + /api + /mcp-admin + /mcp
#
# 使用前提:
#   1. 后端服务已启动: gateway(6000) auth(6001) user(6002) ai(6003)
#      system(6004) todo(6005) mcp-gateway(6006) finnews(6007) upload(6008)
#   2. 前端已构建:  cd apps/portal && npx vite build
#                   cd apps/admin-web && npx vite build
#   3. 本地 nginx 引入本文件, 例如:
#      # nginx.conf 的 http {} 内:
#      include /path/to/web_system/local.nginx.conf;
#      # 或软链到 conf.d/ 下
#
# 说明:
#   - 前端 base 分别为 /portal/ 与 /admin/, 本配置通过 rewrite 去掉前缀
#     映射到 dist 根目录, 保持与生产部署一致的访问形态。
#   - SSL 证书为本地自签(~/local/nginx/conf/ssl/), 仅用于本地验证。
#   - `http2 on;` 是 nginx 1.25+ 的新写法, 替代 deprecated 的 `listen ... http2`。
# ============================================================

# ---------------- 全局 Gzip ----------------
gzip on;
gzip_comp_level 6;
gzip_min_length 256;
gzip_proxied any;
gzip_vary on;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    image/svg+xml
    font/woff
    font/woff2
    application/vnd.ms-fontobject;

# 优先使用 Vite 预压缩的 .gz 文件(避免实时压缩)
gzip_static on;

# ---------------- 浏览器缓存: 静态资源强缓存 ----------------
map $sent_http_content_type $expires {
    default                    off;
    application/javascript     365d;
    text/css                   365d;
    image/png                  365d;
    image/jpeg                 365d;
    image/gif                  365d;
    image/svg+xml              365d;
    font/woff                  365d;
    font/woff2                 365d;
}

# ============================================================
# 主入口: 80(HTTP) + 443(HTTPS) — 无需端口即可访问
#   http://local.kedouai.com/portal/       少儿教育门户
#   http://local.kedouai.com/admin/        管理后台
#   http://local.kedouai.com/mcp-admin/    MCP 管理界面
#   http://local.kedouai.com/api/*         API(反代 gateway)
#   http://local.kedouai.com/mcp           MCP(反代 mcp-gateway)
# 绑定 80/443 需要 root 启动 nginx:
#   sudo /Users/geekwen/local/nginx/sbin/nginx
# ============================================================
server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name local.kedouai.com dev.kedouai.com portal.kedouai.com admin.kedouai.com;

    # 本地自签证书(SAN 覆盖全部 4 个域名)
    ssl_certificate     /Users/geekwen/local/nginx/conf/ssl/dev.kedouai.com.crt;
    ssl_certificate_key /Users/geekwen/local/nginx/conf/ssl/dev.kedouai.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # 根路径 → portal
    location = / {
        return 301 /portal/;
    }

    # 不带斜杠的路径规范化
    location = /portal     { return 301 /portal/; }
    location = /admin      { return 301 /admin/; }
    location = /mcp-admin  { return 301 /mcp-admin/; }

    # portal 静态(base 为 /portal/, alias 到 dist 根 + SPA 回退)
    location /portal/ {
        alias /Users/geekwen/workspace/web_system/apps/portal/dist/;
        expires $expires;
        try_files $uri $uri/ /portal/index.html;
    }

    # admin 静态(base 为 /admin/)
    location /admin/ {
        alias /Users/geekwen/workspace/web_system/apps/admin-web/dist/;
        expires $expires;
        try_files $uri $uri/ /admin/index.html;
    }

    # mcp-admin 静态
    location /mcp-admin/ {
        alias /Users/geekwen/workspace/web_system/apps/mcp-admin/dist/;
        expires $expires;
        try_files $uri $uri/ /mcp-admin/index.html;
    }

    # API 代理 → 本地 Gateway
    location /api {
        proxy_pass http://127.0.0.1:6000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE(流式对话)支持
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
    }

    # SSE 专用配置(/api/ai/chat/stream 路径)
    location ~ ^/api/ai/chat/stream$ {
        proxy_pass http://127.0.0.1:6000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
        chunked_transfer_encoding on;
    }

    # MCP 协议端点 → mcp-gateway
    location /mcp {
        proxy_pass http://127.0.0.1:6006;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
    }

    access_log /Users/geekwen/local/nginx/logs/local.kedouai.com.access.log;
    error_log  /Users/geekwen/local/nginx/logs/local.kedouai.com.error.log;
}

# ============================================================
# HTTP 网关: 全部跳转 HTTPS
# ============================================================
server {
    listen 8080;
    server_name local.kedouai.com dev.kedouai.com portal.kedouai.com admin.kedouai.com;
    return 301 https://$host:8443$request_uri;
}

# ============================================================
# HTTPS 网关: 反代本地 Gateway(对应生产 nginx-proxy.conf)
# ============================================================
server {
    listen 8443 ssl;
    http2 on;
    server_name local.kedouai.com dev.kedouai.com portal.kedouai.com admin.kedouai.com;

    # 本地自签证书(验证用)
    ssl_certificate     /Users/geekwen/local/nginx/conf/ssl/dev.kedouai.com.crt;
    ssl_certificate_key /Users/geekwen/local/nginx/conf/ssl/dev.kedouai.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    access_log /Users/geekwen/local/nginx/logs/dev.kedouai.com.access.log;
    error_log  /Users/geekwen/local/nginx/logs/dev.kedouai.com.error.log;

    location / {
        proxy_pass http://127.0.0.1:6000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 缓冲优化
        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_buffer_size 32k;
    }
}

# ============================================================
# 少儿教育门户 (portal.kedouai.com) — 静态托管 + API 反代
# ============================================================
server {
    listen 8081;
    server_name local.kedouai.com portal.kedouai.com;

    root /Users/geekwen/workspace/web_system/apps/portal/dist;
    index index.html;
    expires $expires;

    # 安全响应头(纵深防御, 上游 SSL 网关层也设置了)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # 根路径 → /portal/ (与 Gateway 行为一致)
    location = / {
        return 301 /portal/;
    }

    # base 为 /portal/, 去掉前缀映射到 dist 根目录, 并做 SPA 回退
    location /portal/ {
        rewrite ^/portal/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    # API 代理 → 本地 Gateway
    location /api {
        proxy_pass http://127.0.0.1:6000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE(流式对话)支持
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
    }

    # SSE 专用配置(/api/ai/chat/stream 路径)
    location ~ ^/api/ai/chat/stream$ {
        proxy_pass http://127.0.0.1:6000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
        chunked_transfer_encoding on;
    }

    access_log /Users/geekwen/local/nginx/logs/portal.access.log;
    error_log  /Users/geekwen/local/nginx/logs/portal.error.log;
}

# ============================================================
# 管理后台 (admin.kedouai.com / dev.kedouai.com) — 静态托管 + API 反代
# ============================================================
server {
    listen 8082;
    server_name local.kedouai.com admin.kedouai.com dev.kedouai.com;

    root /Users/geekwen/workspace/web_system/apps/admin-web/dist;
    index index.html;
    expires $expires;

    # 安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # 根路径 → /admin/
    location = / {
        return 301 /admin/;
    }

    # base 为 /admin/, 去掉前缀映射到 dist 根目录, 并做 SPA 回退
    location /admin/ {
        rewrite ^/admin/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    # API 代理 → 本地 Gateway
    location /api {
        proxy_pass http://127.0.0.1:6000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header Connection '';
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
    }

    # SSE 专用配置(/api/ai/chat/stream 路径)
    location ~ ^/api/ai/chat/stream$ {
        proxy_pass http://127.0.0.1:6000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
        chunked_transfer_encoding on;
    }

    # MCP 管理界面(静态 SPA, 本地由 nginx 托管 apps/mcp-admin/dist)
    # 注意: 不要用 rewrite 去掉前缀 + root 组合——/mcp-admin/ 会被 rewrite 成 /,
    # 落入 server 级 root(admin dist)与 location = /(301→/admin/) 的处理链,
    # 最终返回 admin 的 index.html, 导致浏览器跳成 /admin/mcp-admin/ 404。
    # 与主入口 80/443 一致, 用 alias 直接映射到 dist。
    location = /mcp-admin  { return 301 /mcp-admin/; }
    location /mcp-admin/ {
        alias /Users/geekwen/workspace/web_system/apps/mcp-admin/dist/;
        expires $expires;
        try_files $uri $uri/ /mcp-admin/index.html;
    }

    # MCP 协议端点(streamable-http, 需 SSE 支持) → mcp-gateway
    location /mcp {
        proxy_pass http://127.0.0.1:6006;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
    }

    access_log /Users/geekwen/local/nginx/logs/admin.access.log;
    error_log  /Users/geekwen/local/nginx/logs/admin.error.log;
}
