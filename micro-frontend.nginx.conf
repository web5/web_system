# ============================================================
# 微前端平台本地验证配置 (micro-frontend.nginx.conf)
#
# 监听 8090 端口（避开旧 SPA 模式的 80/8081/8082）
# 浏览器访问 http://local.kedouai.com:8090/  → 基座 shell
#
# 职责分工:
#   /static/externals/  → 公共依赖（vue/router/pinia 等），nginx 直出强缓存
#   /static/modules/     → 微前端模块 js/css，nginx 直出不经过 gateway
#   /                    → 基座 index.html + /api/*，反代 gateway:6000
#   /console/            → deploy-console:6200
#
# 启用方式: 在 ~/local/nginx/conf/conf.d/ 加一个文件 include 本配置
#   echo 'include /Users/geekwen/workspace/web_system/micro-frontend.nginx.conf;' > ~/local/nginx/conf/conf.d/micro-frontend-local.conf
#   nginx -s reload
# ============================================================

server {
    listen 8090 ssl;
    http2 on;
    server_name local.kedouai.com dev.kedouai.com localhost;

    # 本地自签证书（与 80/443 server 共用，SAN 覆盖 *.kedouai.com）
    ssl_certificate     /Users/geekwen/local/nginx/conf/ssl/dev.kedouai.com.crt;
    ssl_certificate_key /Users/geekwen/local/nginx/conf/ssl/dev.kedouai.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:MF_SSL:10m;
    ssl_session_timeout 10m;

    # 安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # ===== 公共依赖 externals（dev 验证用 no-cache + etag；生产可改回 max-age=31536000, immutable） =====
    location /static/externals/ {
        alias /Users/geekwen/workspace/web_system/servers/gateway/public/static/externals/;
        add_header Cache-Control "no-cache, must-revalidate";
        etag on;
        add_header Access-Control-Allow-Origin "*";
    }

    # ===== 微前端模块 js/css（nginx 直出，不经过 gateway） =====
    # 注意：模块 CSS 文件名固定是 index.css（无 hash，manifest 按固定名加载），
    # 不能用 immutable 强缓存，否则样式改动浏览器不重新拉取。
    location /static/modules/ {
        alias /Users/geekwen/workspace/web_system/servers/gateway/public/static/modules/;
        # js/css 都走 etag + no-cache（dev 验证；生产可改回强缓存，但需给 index.css 加 hash）
        location ~* \.(js|css)$ {
            add_header Cache-Control "no-cache, must-revalidate";
            etag on;
            add_header Access-Control-Allow-Origin "*";
        }
        # 图片/字体 强缓存
        location ~* \.(png|jpg|jpeg|gif|svg|woff2?|ttf|eot)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Access-Control-Allow-Origin "*";
        }
    }

    # ===== 基座 index.html + API → gateway:6000 =====
    location / {
        proxy_pass http://127.0.0.1:6000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # ===== deploy-console → 6200 =====
    location /console/ {
        proxy_pass http://127.0.0.1:6200;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    access_log /Users/geekwen/local/nginx/logs/micro-frontend.access.log;
    error_log  /Users/geekwen/local/nginx/logs/micro-frontend.error.log;
}
