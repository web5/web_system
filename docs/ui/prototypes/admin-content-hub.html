<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 内联 data-URI 图标：避免浏览器自动请求 /favicon.ico 产生 404（仍零外部依赖） -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23FF8C42'/%3E%3C/svg%3E">
<title>admin 内容中心 · 模块原型稿（采集总览 / 内容条目 / 条目详情 / 龙虎榜 / 席位库）</title>
<!--
  ============================================================
  admin 内容中心（content:view / content:manage）模块原型稿 · 2026-10-15
  · 定位：**模块稿，不是整合稿**。壳（sider + 顶栏 + 页脚）与菜单**不在这里定义** ——
    它们归 scripts/lib/proto-shell.mjs 单一真相源；本稿只管「内容中心 5 屏装什么」。
    整合进 admin 的菜单级总稿 = 在 scripts/lib/proto-registry.mjs 登记后重跑
    node scripts/build-agents-hub.mjs（本稿被同源抽取，不是被复制）。
  · 5 屏：采集总览 · 内容条目 · 条目详情 · 龙虎榜 · 席位库
  · 字段与接口对照 M1 落码（archive/migrations/p35-content-quality.mjs、
    servers/content-hub/src/content/content-quality.controller.ts、
    dto/content-quality.dto.ts、quality/quality.enum.ts），不是编的：
    · collect_runs：id / source_code / trigger_type / status / item_count /
      dedup_count / fail_count / duration_ms / error_message / started_at
    · content_items：quality_status（ok|partial|fail|skip）/ quality_stage
      （collect|dedup|llm|publish|fallback）/ issue
    · lhb_records：trade_date / stock_code / reason / buy / sell / net /
      turnover / limit_up / is_st
    · hotmoney_seats：seat_name / alias / tag / is_active
  · 状态矩阵：每屏顶部「[原型] 状态」控件切 正常 / 加载中 / 空数据 / 请求失败 / 无权限，
    5 屏 × 5 态都必须有回应（不适用处显式说明原因，不假装已覆盖）。
    该控件仅走查用，落地不保留。
  · 数据是模拟的，字段名是真的。带「待补」角标 = 原型领先落地待补的实现缺口。
  · 零依赖单文件；独立打开渲染「采集总览」，其余 4 屏在整合稿里经菜单进入。
  ============================================================
-->
<style>
  /* Token 对齐 packages/ui/src/tokens.ts 的 roles.light（design-system G1：色值只引 token） */
  :root{
    --ws-bg-page:#FAFAFA; --ws-bg-surface:#FFFFFF; --ws-bg-elevated:#FFFFFF;
    --ws-bg-subtle:#F2F2F2; --ws-bg-hover:#F2F2F2; --ws-bg-active:#EBEBEB;
    --ws-text-primary:#171717; --ws-text-secondary:#525252; --ws-text-tertiary:#A3A3A3; --ws-text-disabled:#D4D4D4;
    --ws-border:#E5E5E5; --ws-border-subtle:#EBEBEB;
    --ws-input-bg:#FFFFFF; --ws-input-border:#E5E5E5; --ws-input-placeholder:#A3A3A3;
    --ws-brand-500:#F97316; --ws-brand-600:#EA580C; --ws-brand-400:#FB923C; --ws-brand-soft:#FFF7ED;
    --ws-accent:#FF8C42;                /* admin 侧栏选中 / logo，见 BasicLayout.vue */
    --ws-accent-soft:rgba(255,140,66,.15);
    --ws-on-brand:#FFFFFF;
    --ws-ok:#398E4A; --ws-ok-soft:#EAF6EC;
    --ws-warn:#F5A623; --ws-warn-soft:#FEF3DC;
    /* 待补入 packages/ui/src/tokens.ts：tokens.ts 只定义 warning 100/500 两档，
       没有「warn 色在 warn-soft 底上的可读文本档」；既有两份原型直接写裸 hex #8A5A00，
       本次收为本 token（原型侧派生值，非包内真相） */
    --ws-warn-text:#8A5A00;
    --ws-danger:#E5484D; --ws-danger-soft:#FCEBEC;
    --ws-info:#2563EB; --ws-info-soft:#EFF4FF;
    --ws-radius-sm:4px; --ws-radius-md:6px; --ws-radius-lg:8px; --ws-radius-pill:9999px;
    --ws-text-body:#3F3F46; --ws-text-strong:#18181B;
    --ws-leading-tight:1.25; --ws-leading-snug:1.4; --ws-leading-normal:1.6; --ws-leading-relaxed:1.75;
    --ws-tracking-tight:-0.02em; --ws-tracking-normal:0; --ws-tracking-wide:0.02em;
    --ws-duration-fast:150ms; --ws-duration-base:200ms; --ws-duration-slow:300ms;
    --ws-ease-out:cubic-bezier(0.16, 1, 0.3, 1);
    --ws-focus-ring:0 0 0 2px #FFFFFF, 0 0 0 4px rgba(249, 115, 22, 0.55);
    --ws-control-sm:24px; --ws-control-md:32px; --ws-control-lg:40px;
    --ws-icon-inline:16px; --ws-icon-action:20px; --ws-icon-feature:24px;
    --ws-shadow-card:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);
    --ws-font-mono:'Geist Mono','JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
    /* ── 遮罩 / 阴影 / 语义描边（D2 评审 X4/G1：:root 外禁止裸 rgba）── */
    --ws-overlay:rgba(23,23,23,.35);
    --ws-shadow-window:0 24px 70px rgba(20,30,50,.14);
    --ws-shadow-modal:0 18px 50px rgba(20,30,50,.2);
    --ws-shadow-thumb:0 1px 2px rgba(0,0,0,.2);
    --ws-shadow-bubble:0 1px 2px rgba(0,0,0,.04);
    --ws-accent-04:rgba(255,140,66,.04);
    --ws-border-brand:rgba(249,115,22,.25);
    --ws-border-warn:rgba(245,166,35,.3);
    --ws-border-warn-strong:rgba(245,166,35,.45);
    --ws-border-danger:rgba(229,72,77,.25);
    --ws-border-danger-strong:rgba(229,72,77,.4);
    --ws-border-ok:rgba(57,142,74,.25);
    /* 金融涨跌专用文本档（不是 danger/ok 语义色）：既避免「买入=错误色」的同色异义，
       又把对比度提到 AA（#C4322F 5.46:1 / #2E7D48 5.07:1，既有 danger/ok 仅 3.40/3.67:1） */
    --ws-fin-up:#C4322F;
    --ws-fin-down:#2E7D48;
    --ws-fin-flat:var(--ws-text-secondary);
    --ws-code-bg:#1C1E26; --ws-code-hd:#16181F; --ws-code-text:#E2E8F0; --ws-code-hd-text:#A5ACBA;
  }
  [data-radius='crisp']{ --ws-radius-sm:2px; --ws-radius-md:2px; --ws-radius-lg:4px; }
  [data-radius='sharp']{ --ws-radius-sm:0px; --ws-radius-md:0px; --ws-radius-lg:2px; }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
    background:var(--ws-bg-page);min-height:100vh;padding:24px 20px 60px;
    display:flex;flex-direction:column;align-items:center;gap:16px;color:var(--ws-text-body);
  }
  :focus-visible{outline:none;box-shadow:var(--ws-focus-ring);}
  body .hidden{display:none;}

  .proto-head{width:1280px;}
  .proto-head h1{font-size:18px;font-weight:600;margin-bottom:6px;letter-spacing:var(--ws-tracking-tight);}
  .proto-head .sub{font-size:12px;color:var(--ws-text-secondary);line-height:var(--ws-leading-relaxed);}
  .proto-head .sub b{color:var(--ws-brand-600);font-weight:600;}
  .proto-head .sub code{font-family:var(--ws-font-mono);font-size:12px;background:var(--ws-bg-subtle);padding:1px 4px;border-radius:3px;}

  /* ===== 通用内容件 ===== */
  .pg-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
  .pg-head h2{font-size:18px;font-weight:600;letter-spacing:var(--ws-tracking-tight);color:var(--ws-text-strong);}
  .pg-head .sub{font-size:12px;color:var(--ws-text-secondary);margin-top:4px;line-height:var(--ws-leading-snug);}
  .pg-head .spacer{flex:1;}
  .card{background:var(--ws-bg-surface);border:1px solid var(--ws-border);border-radius:var(--ws-radius-lg);
    padding:16px;margin-bottom:14px;box-shadow:var(--ws-shadow-card);}
  .card .ct{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:14px;letter-spacing:var(--ws-tracking-tight);color:var(--ws-text-strong);}
  .card .ct .hint{font-size:12px;font-weight:400;color:var(--ws-text-tertiary);}
  .card .ct .ic{width:var(--ws-icon-inline);height:var(--ws-icon-inline);color:var(--ws-brand-600);flex-shrink:0;}
  .card .ct .ic svg{width:100%;height:100%;}
  .note{display:flex;gap:8px;align-items:flex-start;border-radius:var(--ws-radius-md);padding:9px 12px;
    font-size:12px;line-height:var(--ws-leading-relaxed);margin-bottom:12px;}
  .note.info{background:var(--ws-brand-soft);color:var(--ws-brand-600);border:1px solid var(--ws-border-brand);}
  .note.warn{background:var(--ws-warn-soft);color:var(--ws-warn-text);border:1px solid var(--ws-border-warn);}
  .note.danger{background:var(--ws-danger-soft);color:var(--ws-danger);border:1px solid var(--ws-border-danger);}
  .note.ok{background:var(--ws-ok-soft);color:var(--ws-ok);border:1px solid var(--ws-border-ok);}
  .note code,.mono{font-family:var(--ws-font-mono);font-size:12px;}
  .kv{font-family:var(--ws-font-mono);font-size:12px;background:var(--ws-bg-subtle);padding:1px 5px;border-radius:3px;color:var(--ws-text-body);}

  .btn{background:var(--ws-bg-surface);color:var(--ws-text-strong);border:1px solid var(--ws-input-border);
    border-radius:var(--ws-radius-md);padding:6px 14px;font-size:13px;cursor:pointer;font-family:inherit;
    transition:background var(--ws-duration-fast) var(--ws-ease-out),color var(--ws-duration-fast) var(--ws-ease-out),border-color var(--ws-duration-fast) var(--ws-ease-out);}
  .btn:hover{background:var(--ws-bg-hover);}
  .btn.primary{background:var(--ws-brand-500);border-color:var(--ws-brand-500);color:var(--ws-on-brand);font-weight:600;}
  .btn.primary:hover{background:var(--ws-brand-600);}
  .btn.danger{color:var(--ws-danger);border-color:var(--ws-border-danger-strong);}
  .btn.danger:hover{background:var(--ws-danger-soft);}
  .btn.sm{height:var(--ws-control-sm);padding:0 10px;font-size:12px;border-radius:var(--ws-radius-sm);}
  .btn[disabled]{opacity:.55;cursor:not-allowed;}
  .btn-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}

  .badge{font-size:12px;padding:2px 8px;border-radius:var(--ws-radius-pill);font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;}
  .badge.ok{background:var(--ws-ok-soft);color:var(--ws-ok);}
  .badge.warn{background:var(--ws-warn-soft);color:var(--ws-warn-text);}
  .badge.err{background:var(--ws-danger-soft);color:var(--ws-danger);}
  .badge.info{background:var(--ws-info-soft);color:var(--ws-info);}
  .badge.neutral{background:var(--ws-bg-subtle);color:var(--ws-text-secondary);}
  /* 买卖方向专用：与「成功/失败」状态色解耦（G2：不给枚举按值配语义色），
     用金融涨跌档 --ws-fin-*，避免同屏 .badge.err 既表「买入」又表「涨停」 */
  .trade{display:inline-flex;align-items:center;font-size:12px;padding:2px 8px;border-radius:var(--ws-radius-pill);font-weight:600;white-space:nowrap;}
  .trade.buy{background:var(--ws-danger-soft);color:var(--ws-fin-up);}
  .trade.sell{background:var(--ws-ok-soft);color:var(--ws-fin-down);}
  .trade.both{background:var(--ws-bg-subtle);color:var(--ws-fin-flat);}

  .filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
  .input,.select{border:1px solid var(--ws-input-border);border-radius:var(--ws-radius-md);background:var(--ws-input-bg);
    color:var(--ws-text-body);font-size:13px;padding:6px 10px;outline:none;font-family:inherit;height:var(--ws-control-md);}
  .input:focus,.select:focus{border-color:var(--ws-brand-500);}
  .input::placeholder{color:var(--ws-input-placeholder);}
  .lb{font-size:12px;color:var(--ws-text-secondary);}

  table.tbl{width:100%;border-collapse:collapse;font-size:13px;}
  table.tbl th{text-align:left;color:var(--ws-text-tertiary);font-weight:600;font-size:12px;
    padding:8px 10px;border-bottom:1px solid var(--ws-border);white-space:nowrap;}
  table.tbl td{padding:9px 10px;border-bottom:1px solid var(--ws-border-subtle);color:var(--ws-text-primary);vertical-align:middle;}
  table.tbl tbody tr:hover{background:var(--ws-bg-hover);}
  table.tbl td.num{font-family:var(--ws-font-mono);font-size:12px;text-align:right;white-space:nowrap;}
  table.tbl .ell{max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .row-actions{display:flex;gap:6px;}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px;}
  .stat{background:var(--ws-bg-surface);border:1px solid var(--ws-border);border-radius:var(--ws-radius-lg);padding:14px 16px;box-shadow:var(--ws-shadow-card);}
  .stat .lb{font-size:12px;color:var(--ws-text-tertiary);margin-bottom:6px;}
  .stat .v{font-size:24px;font-weight:600;color:var(--ws-text-strong);letter-spacing:var(--ws-tracking-tight);}
  .stat .v small{font-size:12px;font-weight:400;color:var(--ws-text-tertiary);margin-left:4px;}
  .stat .sub2{font-size:12px;color:var(--ws-text-tertiary);margin-top:4px;}

  .srcs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px;}
  .src{background:var(--ws-bg-surface);border:1px solid var(--ws-border);border-radius:var(--ws-radius-lg);padding:14px 16px;box-shadow:var(--ws-shadow-card);display:flex;flex-direction:column;gap:8px;}
  .src .nm{font-size:13px;font-weight:600;color:var(--ws-text-strong);display:flex;align-items:center;gap:6px;}
  .src .meta{font-size:12px;color:var(--ws-text-tertiary);line-height:var(--ws-leading-snug);}
  .src .act{margin-top:auto;}
  .src.cycle{border-color:var(--ws-border-warn-strong);background:linear-gradient(180deg,var(--ws-warn-soft),var(--ws-bg-surface));}

  .skel i{display:block;height:10px;border-radius:var(--ws-radius-sm);background:var(--ws-bg-active);margin-bottom:10px;}
  .skel i:nth-child(2){width:74%;} .skel i:nth-child(3){width:52%;}
  .exception{background:var(--ws-bg-surface);border:1px solid var(--ws-border);border-radius:var(--ws-radius-lg);
    padding:56px 24px;text-align:center;box-shadow:var(--ws-shadow-card);}
  .exception .ic{width:var(--ws-icon-feature);height:var(--ws-icon-feature);margin:0 auto 14px;color:var(--ws-text-disabled);}
  .exception .ic svg{width:100%;height:100%;}
  .exception .t{font-size:16px;font-weight:600;margin-bottom:8px;letter-spacing:var(--ws-tracking-tight);color:var(--ws-text-strong);}
  .exception .d{font-size:13px;color:var(--ws-text-secondary);line-height:var(--ws-leading-relaxed);margin-bottom:18px;}
  .empty-ic{width:var(--ws-icon-feature);height:var(--ws-icon-feature);color:var(--ws-text-disabled);margin:0 auto 10px;display:block;}
  .empty-txt{font-size:13px;color:var(--ws-text-secondary);margin-bottom:4px;}
  .empty-sub{font-size:12px;color:var(--ws-text-tertiary);margin-bottom:16px;}

  /* 抽屉 */
  .mask{position:absolute;inset:0;background:var(--ws-overlay);z-index:20;opacity:0;pointer-events:none;
    transition:opacity var(--ws-duration-base) var(--ws-ease-out);}
  .mask.show{opacity:1;pointer-events:auto;}
  .drawer{position:absolute;top:0;right:0;height:100%;width:560px;background:var(--ws-bg-surface);
    border-left:1px solid var(--ws-border);z-index:21;transform:translateX(100%);display:flex;flex-direction:column;
    transition:transform var(--ws-duration-base) var(--ws-ease-out);}
  .drawer.show{transform:translateX(0);}
  .drawer .dh{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;
    border-bottom:1px solid var(--ws-border);flex-shrink:0;}
  .drawer .dh .ttl{font-size:14px;font-weight:600;color:var(--ws-text-strong);}
  .drawer .db{flex:1;overflow:auto;padding:16px 18px;background:var(--ws-bg-page);}
  .icon-btn{width:28px;height:28px;border-radius:var(--ws-radius-md);border:1px solid var(--ws-border-subtle);
    background:var(--ws-bg-surface);color:var(--ws-text-tertiary);cursor:pointer;display:grid;place-items:center;}
  .icon-btn:hover{background:var(--ws-bg-hover);color:var(--ws-text-strong);}
  .icon-btn svg{width:14px;height:14px;}

  /* 弹窗 */
  .modal-mask{position:absolute;inset:0;background:var(--ws-overlay);z-index:30;display:none;
    align-items:flex-start;justify-content:center;padding-top:120px;}
  .modal-mask.show{display:flex;}
  .modal{width:460px;background:var(--ws-bg-surface);border-radius:var(--ws-radius-lg);box-shadow:0 18px 50px var(--ws-shadow-modal);overflow:hidden;}
  .modal .mh{padding:16px 20px 0;font-size:16px;font-weight:600;color:var(--ws-text-strong);}
  .modal .mb{padding:10px 20px 16px;font-size:13px;color:var(--ws-text-secondary);line-height:var(--ws-leading-relaxed);}
  .modal .mf{padding:0 20px 4px;}
  .modal .mfoot{padding:12px 20px 16px;display:flex;justify-content:flex-end;gap:10px;}
  /* 表单：label 左置栅格 */
  .frow{display:flex;flex-direction:column;gap:10px;margin-bottom:6px;}
  .fitem{display:flex;align-items:center;gap:10px;}
  .flb{width:84px;flex-shrink:0;font-size:12px;color:var(--ws-text-secondary);text-align:right;}
  .fld{flex:1;min-width:0;}
  .fld .input,.fld .select{width:100%;}
  .fhint{font-size:12px;color:var(--ws-text-tertiary);margin:-4px 0 6px 94px;}

  /* 详情三段式 */
  .sec{margin-bottom:14px;}
  .sec .st{font-size:12px;font-weight:600;color:var(--ws-text-tertiary);letter-spacing:var(--ws-tracking-wide);margin-bottom:8px;}
  .dl-grid{display:grid;grid-template-columns:120px 1fr;gap:8px 14px;font-size:13px;}
  .dl-grid dt{color:var(--ws-text-tertiary);font-size:12px;}
  .dl-grid dd{color:var(--ws-text-body);word-break:break-all;}
  pre.codeblk{margin:0;border-radius:var(--ws-radius-md);background:var(--ws-code-bg);overflow:hidden;}
  pre.codeblk .hd{display:flex;align-items:center;padding:8px 14px;background:var(--ws-code-hd);color:var(--ws-code-hd-text);font-size:12px;}
  pre.codeblk .bd{margin:0;padding:12px 16px;overflow-x:auto;font-family:var(--ws-font-mono);font-size:12px;line-height:var(--ws-leading-relaxed);color:var(--ws-code-text);white-space:pre-wrap;}

  .toast{position:fixed;left:50%;top:22px;transform:translate(-50%,-14px);opacity:0;pointer-events:none;
    background:var(--ws-text-primary);color:var(--ws-bg-surface);font-size:13px;padding:9px 16px;
    border-radius:var(--ws-radius-lg);transition:opacity var(--ws-duration-fast) var(--ws-ease-out),transform var(--ws-duration-fast) var(--ws-ease-out);z-index:60;}
  .toast.show{opacity:1;transform:translate(-50%,0);}

  /* 已整合进来的：Agents 对话调试 */
  .pg-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .pg-chat{border:1px solid var(--ws-border);border-radius:var(--ws-radius-lg);background:var(--ws-bg-surface);padding:20px;min-height:520px;}
  .turn{margin-bottom:22px;}
  .turn:last-child{margin-bottom:0;}
  .bubble-wrap{display:flex;gap:10px;margin-bottom:10px;}
  .bubble-wrap.me{justify-content:flex-end;}
  .avatar{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;}
  .avatar.user{background:var(--ws-accent);color:var(--ws-on-brand);}
  .avatar.ai{background:var(--ws-ok);color:var(--ws-on-brand);}
  .bubble{max-width:76%;border-radius:var(--ws-radius-lg);padding:10px 14px;}
  .bubble.user{background:var(--ws-accent);color:var(--ws-on-brand);font-size:14px;line-height:var(--ws-leading-relaxed);}
  .bubble.ai{background:var(--ws-bg-surface);border:1px solid var(--ws-border);box-shadow:0 1px 2px var(--ws-shadow-bubble);}
  .ans{font-size:14px;line-height:var(--ws-leading-relaxed);color:var(--ws-text-body);}
  .ans p{margin:0 0 16px;}
  .ans p.lead{font-size:14px;font-weight:500;color:var(--ws-text-strong);}

function toast(msg){
  var el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(function(){ el.classList.remove('show'); },2000);
}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s){ return esc(s).replace(/"/g,'&quot;'); }
function money(v){ return (v/100000000).toFixed(2)+' 亿'; }
function 万元(v){ return (v/10000).toFixed(0); }
function qsbadge(q){
  var map={ ok:['ok','完整'], partial:['warn','部分成功'], fail:['err','失败'], skip:['neutral','跳过'] };
  var m=map[q]||['neutral',q];
  return '<span class="badge '+m[0]+'">'+m[1]+'</span>';
}
function stageBadge(s){
  var map={ collect:['','采集'], dedup:['neutral','去重'], llm:['','LLM'], fallback:['warn','降级'], publish:['','发布'] };
  var m=map[s]||['neutral',s];
  return '<span class="badge '+(m[0]||'info')+'">'+m[1]+'</span>';
}
function tagBadge(t){
  if(t==='hotmoney') return '<span class="badge warn">游资</span>';
  if(t==='institution') return '<span class="badge info">机构</span>';

function confirmCollect(code){
  var src=null; SOURCES.forEach(function(s){ if(s.code===code) src=s; });
  if(!src) return;
  S.modal={ title:'确认立即采集', ok:'确认采集',
    body:'即将手动触发采集器 <span class="kv">'+code+'</span>（'+esc(src.name)+'）。<br><br>'
        +'该操作会真实请求上游数据源，<b>同一采集器运行期间会被服务端拒绝</b>（返回 '
        +'<span class="kv">status=rejected</span>）。建议仅在排查数据时使用。',
    onOk:function(){ doCollect(code); } };
  renderModal();
}
function doCollect(code){
  S.busy=code; S.modal=null; renderModal(); render();
  setTimeout(function(){
    S.busy=null;
    var now=new Date();
    var ts=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate())+' '+pad(now.getHours())+':'+pad(now.getMinutes())+':'+pad(now.getSeconds());
    RUNS.unshift({ id:RUNS[0].id+1, source_code:code, source_name:srcName(code), trigger_type:'manual',
      status:code==='eastmoney_news'?'failed':'ok', item_count:code==='eastmoney_news'?0:68,
      dedup_count:0, fail_count:0, duration_ms:2410,
      error_message:code==='eastmoney_news'?'connect ETIMEDOUT（源不可达，30s 超时）':null, started_at:ts });
    render();
    toast(code==='eastmoney_news'?'采集失败，已记入批次日志（source_code='+code+'）':'采集完成：新增 68 条');
  },1400);
}
function pad(n){ return n<10?'0'+n:''+n; }
function srcName(code){
  var n=code; SOURCES.forEach(function(s){ if(s.code===code) n=s.name; }); return n;
}

    body:'将对该条目重跑「去重 → LLM 摘要 → 发布」链路。<br><br>'
        +'重跑会<b>覆盖</b>现有的 <span class="kv">quality_status</span> / '
        +'<span class="kv">quality_stage</span> / <span class="kv">quality_issue</span>，'
        +'原有的失败归因记录将无法复原。',
    onOk:function(){ S.modal=null; renderModal(); toast('已提交重跑（content:manage）'); } };
  renderModal();
}

/* =========================================================
   屏 4：内容中心 · 龙虎榜
   接口：GET /api/content/lhb、GET /api/content/lhb/stats、GET /api/content/lhb/:id
   ========================================================= */
function screenLhb(){
  if(S.state==='noperm') return exceptionHtml('content:view','内容中心');
  if(S.state==='error')   return errorHtml('GET /api/content/lhb 返回 502');
  var head='<div class="pg-head"><div><h2>龙虎榜</h2>'
    +'<div class="sub">最近交易日的上榜明细与资金性质；席位判定走规则表（hotmoney_seats），不是 AI 推断</div></div></div>';
  if(S.state==='loading') return head+skeletonCards(4)+'<div class="card"><div class="skel"><i></i><i></i><i></i></div></div>';

  var h=head;
  h+='<div class="stats">'
    + healthCard(LHB_STATS.trade_date,'最近交易日','统计口径按该日，非历史累计')
    + healthCard(LHB_STATS.total,'当日上榜数','lhb_records 当日记录数')
    + healthCard(LHB_STATS.limit_up,'当日涨停数','limit_up = 1')
    + healthCard(LHB_STATS.hotmoney+' / '+LHB_STATS.institution,'游资 / 机构参与','命中 tags 的记录数（可同时命中）')
    + '</div>';

  h+='<div class="card"><div class="filters">'
    +'<label class="lb">交易日</label><input class="input" style="width:140px" value="'+escAttr(S.lhbDate)+'" readonly aria-label="交易日">'
    +'<select class="select" onchange="S.lhbTag=this.value;render()">'
    + selectOpts({hotmoney:'游资',institution:'机构',retail:'散户'},S.lhbTag,'资金性质：全部')+'</select>'
    +'<button class="btn primary" onclick="toast(\'[原型] 已按条件查询\')">查询</button>'
    +'<button class="btn" onclick="toast(\'[原型] 已导出 CSV（68 条）\')">导出</button>'
    +'</div>';

  if(S.state==='empty'){
    h+=emptyHtml('该交易日暂无龙虎榜数据','可能尚未到当日收盘同步时间（15:10 后），或该日为非交易日。',
      '<div class="btn-row" style="justify-content:center">'
      +'<button class="btn primary" onclick="S.lhbTag=\'\';setState(\'normal\');render()">查看全部交易日</button></div>');
    return h+'</div>';
  }
  var rows=S.lhbTag?LHB.filter(function(r){ return r.tags.indexOf(S.lhbTag)>=0; }):LHB;
  h+='<table class="tbl"><thead><tr><th>代码</th><th>名称</th><th>上榜原因</th>'
    +'<th style="text-align:right">买入额</th><th style="text-align:right">卖出额</th><th style="text-align:right">净额</th>'
    +'<th style="text-align:right">换手率</th><th>资金性质</th><th>标记</th><th>操作</th></tr></thead><tbody>';
  rows.forEach(function(r){
    h+='<tr><td class="mono">'+r.stock_code+'</td>'
      +'<td><b>'+esc(r.stock_name)+'</b></td>'
      +'<td style="max-width:200px;font-size:12px;color:var(--ws-text-secondary)">'+esc(r.reason)+'</td>'
      +'<td class="num">'+money(r.buy)+'</td>'
      +'<td class="num">'+money(r.sell)+'</td>'
      + netCell(r.net)
      +'<td class="num">'+r.turnover+'%</td>'
      +'<td>'+r.tags.map(tagBadge).join(' ')+'</td>'
      +'<td>'+(r.limit_up?'<span class="badge err">涨停</span> ':'')+(r.is_st?'<span class="badge warn">ST</span>':'')+'</td>'
      +'<td><div class="row-actions"><button class="btn sm" onclick="openSeats('+r.id+')">席位明细</button></div></td></tr>';
  });
  h+='</tbody></table>'
    +'<div style="font-size:12px;color:var(--ws-text-tertiary);margin-top:10px">'
    +'净额与买卖方向用<b>金融涨跌档</b>（--ws-fin-up / --ws-fin-down）：正为红、负为绿（A 股口径），'
    +'与「失败/成功」的 err / ok 语义色<b>刻意区分</b>，避免同屏红色两义。｜默认返回 50 条，按 trade_date DESC 排序</div></div>';
  /* 若有行已展开席位抽屉，列表不再重复渲染抽屉内容（抽屉在 .drawer 里） */
  return h;
}
function openSeats(id){
  S.lhbOpen=id; renderDrawer();
}
function renderDrawer(){
  var el=document.getElementById('drawer'), mask=document.getElementById('mask');
  if(S.lhbOpen===null){ el.classList.remove('show'); mask.classList.remove('show'); return; }
  var row=null; LHB.forEach(function(r){ if(r.id===S.lhbOpen) row=r; });
  if(!row){ el.classList.remove('show'); mask.classList.remove('show'); return; }
  var h='<div class="dh"><span class="ttl">席位明细 · '+row.stock_code+' '+esc(row.stock_name)+'</span>'
    +'<button class="icon-btn" type="button" aria-label="关闭抽屉" onclick="closeAll()">'+ICON.x+'</button></div><div class="db">';
  var seats=LHB_SEATS[row.id];
  if(!seats){
    h+='<div class="note warn"><span>该条<b>未取到席位明细</b>（<span class="kv">seats_available = false</span>）。<br>'
      +'原因多为上游分页接口当次未返回明细；金额与上榜结论仍然有效，'
      +'但<b>资金性质只能判为 retail</b> —— 没有席位就谈不上「命中游资席位」。</span></div>';
  } else {
    h+='<div class="note info"><span>判定方式：<b>规则匹配</b>（席位名归一化去空格后查 '
      +'<span class="kv">hotmoney_seats</span> 表），不是 AI 推断。<br>'
      +'为什么不用 AI：席位归属要<b>可复现</b>，同一份数据今天查明天查必须得到同一结论。</span></div>';
    h+='<table class="tbl" style="background:var(--ws-bg-surface)"><thead><tr><th>席位名称</th><th>性质</th>'
      +'<th style="text-align:right">买入</th><th style="text-align:right">卖出</th><th>方向</th></tr></thead><tbody>';
    seats.forEach(function(s){
      var dir=s.type==='buy'?'<span class="trade buy">买入</span>'
            :s.type==='sell'?'<span class="trade sell">卖出</span>':'<span class="trade both">双向</span>';
      h+='<tr><td>'+esc(s.name)+(s.alias?'<div style="font-size:12px;color:var(--ws-text-tertiary)">简称：'+esc(s.alias)+'</div>':'')+'</td>'
        +'<td>'+tagBadge(s.tag)+'</td>'
        +'<td class="num">'+(s.buy?万元(s.buy)+' 万':'—')+'</td>'
        +'<td class="num">'+(s.sell?万元(s.sell)+' 万':'—')+'</td>'
        +'<td>'+dir+'</td></tr>';
    });
    h+='</tbody></table>';
  }
  h+='</div>';
  el.innerHTML=h; el.classList.add('show'); mask.classList.add('show');
}
function closeAll(){
  S.lhbOpen=null; S.modal=null;
  document.getElementById('drawer').classList.remove('show');
  document.getElementById('mask').classList.remove('show');
  renderModal();
}

/* =========================================================
   屏 5：内容中心 · 席位库
   规则表：席位会迁址，所以要「启用 / 停用」而不是删除
   ========================================================= */
function screenSeats(){
  if(S.state==='noperm') return exceptionHtml('content:view','内容中心');
  if(S.state==='error')   return errorHtml('GET /api/content/seats 返回 500');
  var head='<div class="pg-head"><div><h2>席位库</h2>'
    +'<div class="sub">游资 / 机构营业部名单 —— 规则表，不硬编码在代码里</div></div>'
    +'<div class="spacer"></div><div class="btn-row">'
    +'<button class="btn primary" onclick="openSeatForm()">新增席位</button></div></div>';
  if(S.state==='loading') return head+'<div class="card"><div class="skel"><i></i><i></i><i></i></div></div>';
  if(S.state==='empty')   return head+emptyHtml('席位库为空','执行 p35 迁移会写入 18 条初始名单（15 游资 + 3 机构通道）。',
      '<div class="btn-row" style="justify-content:center"><button class="btn primary" '
      +'onclick="S.seatKw=\'\';S.seatTag=\'\';S.seatActive=\'\';setState(\'normal\');render()">清空筛选条件</button></div>');

  var h=head;
  h+='<div class="note info"><span>席位会<b>迁址</b>。迁址后请<b>停用</b>旧记录而不是删除 —— '
    +'删除会让历史龙虎榜的判定结论不可再现，而今天查同一份数据必须得到同一结论。</span></div>';
  h+='<div class="card"><div class="filters">'
    +'<input class="input" style="width:240px" placeholder="搜索营业部名称 / 简称" value="'+escAttr(S.seatKw)+'" oninput="S.seatKw=this.value;renderSeatTable()">'
    +'<select class="select" onchange="S.seatTag=this.value;renderSeatTable()">'
    + selectOpts({hotmoney:'游资',institution:'机构'},S.seatTag,'资金性质：全部')+'</select>'
    +'<select class="select" onchange="S.seatActive=this.value;renderSeatTable()">'
    +'<option value="">状态：全部</option><option value="1">启用</option><option value="0">停用</option></select>'
    +'</div><div id="seatTable"></div></div>';
  return h;
}
function seatRows(){
  return SEATS.filter(function(s){
    if(S.seatTag && s.tag!==S.seatTag) return false;
    if(S.seatActive!=='' && String(s.is_active)!==S.seatActive) return false;
    if(S.seatKw && s.seat_name.indexOf(S.seatKw)<0 && (s.alias||'').indexOf(S.seatKw)<0) return false;
    return true;
  });
}
function renderSeatTable(){
  var el=document.getElementById('seatTable'); if(!el) return;
  var rows=seatRows();
  if(rows.length===0){
    el.innerHTML=emptyHtml('没有匹配的席位','换个关键词，或清空筛选条件。',''); return;
  }
  var h='<table class="tbl"><thead><tr><th>ID</th><th>营业部全称</th><th>简称</th><th>资金性质</th>'
    +'<th>状态</th><th>创建时间</th><th>操作</th></tr></thead><tbody>';
  rows.forEach(function(s){
    h+='<tr><td class="mono">'+s.id+'</td>'
      +'<td>'+esc(s.seat_name)+'</td>'
      +'<td>'+(s.alias?esc(s.alias):'<span style="color:var(--ws-text-disabled)">—</span>')+'</td>'
      +'<td>'+tagBadge(s.tag)+'</td>'
      +'<td>'+(s.is_active?'<span class="badge ok">启用</span>':'<span class="badge neutral">停用</span>')+'</td>'
      +'<td class="mono">'+s.created_at+'</td>'
      +'<td><div class="row-actions">'
      +(s.is_active
        ?'<button class="btn sm danger" onclick="confirmDisable('+s.id+')">停用</button>'
        :'<button class="btn sm" onclick="SEATS.forEach(function(x){if(x.id==='+s.id+')x.is_active=1;});renderSeatTable();toast(\'已启用\')">启用</button>')
      +'</div></td></tr>';
  });
  el.innerHTML=h+'</tbody></table>'
    +'<div style="font-size:12px;color:var(--ws-text-tertiary);margin-top:10px">共 '+rows.length+' 条</div>';
}
function confirmDisable(id){
  var nm=''; SEATS.forEach(function(s){ if(s.id===id) nm=s.seat_name; });
  S.modal={ title:'确认停用该席位？', ok:'确认停用',
    body:'席位：<b>'+esc(nm)+'</b><br><br>'
        +'停用后<b>新采集</b>的龙虎榜不再用它判定资金性质，未命中规则的席位会落到 '
        +'<span class="kv">retail</span>。<br>'
        +'历史记录<b>不会</b>被改写 —— 这正是「停用而非删除」的意义。',
    onOk:function(){
      SEATS.forEach(function(x){ if(x.id===id) x.is_active=0; });
      S.modal=null; renderModal(); renderSeatTable(); toast('已停用（历史判定保持不变）');
    } };
  renderModal();
}
function openSeatForm(){
  S.modal={ title:'新增席位', ok:'保存',
    form:true,
    body:'新增后立即对新采集生效。席位全称需与龙虎榜返回<b>完全一致</b>（匹配前会做去空格归一化）。',
    onOk:function(){ S.modal=null; renderModal(); toast('已保存（content:manage）'); } };
  renderModal();
}


/* ===== 弹窗 ===== */
function renderModal(){
  var el=document.getElementById('modal'), mask=document.getElementById('modalMask');
  if(!S.modal){ mask.classList.remove('show'); el.innerHTML=''; return; }
  var m=S.modal, h='<div class="mh">'+esc(m.title)+'</div><div class="mb">'+m.body+'</div>';
  if(m.form){
    h+='<div class="mf"><div class="frow">'
      +'<div class="fitem"><span class="flb">营业部全称</span><span class="fld"><input class="input" placeholder="与龙虎榜返回完全一致"></span></div>'
      +'<div class="fitem"><span class="flb">常用简称</span><span class="fld"><input class="input" placeholder="如：章盟主系"></span></div>'
      +'<div class="fitem"><span class="flb">资金性质</span><span class="fld"><select class="select">'
      +'<option value="hotmoney">游资</option><option value="institution">机构</option></select></span></div>'
      +'</div><div class="fhint">简称可选；全称写错会导致规则永远匹配不上</div></div>';
  }
  h+='<div class="mfoot"><button class="btn" onclick="closeAll()">取消</button>'
    +'<button class="btn primary" onclick="modalOk()">'+esc(m.ok||'确定')+'</button></div>';
  el.innerHTML=h; mask.classList.add('show');
}
function modalOk(){ var m=S.modal; if(m&&m.onOk) m.onOk(); }



/* =========================================================
   导航：双模（独立稿 / 整合稿）
   · 独立打开本稿：切 .cc-host 显隐（本稿自带 5 个 host）
   · 被 build 抽进 admin-agents-hub.html：走 hash 路由（与 hub 菜单一致）
   判据 = 页面上是否存在 hub 的 .screen 容器 —— 不靠全局变量，抽出来也不会错。
   ========================================================= */
var IN_HUB = !!document.querySelector('.screen[data-screen="content-overview"]');
var ROUTE = {
  'content-overview':'#/content',
  'content-items':'#/content/items',
  'content-detail':'#/content/items/__ID__',
  'content-lhb':'#/content/lhb',
  'content-seats':'#/content/seats'
};
function go(k){
  S.lhbOpen=null;
  if(IN_HUB){ location.hash=(ROUTE[k]||'#/content').replace('__ID__', S.detailId); return; }
  S.screen=k; closeAll(false); apply();
}
/* 当前可见的 host（hub 下由 .screen 的 hidden 决定；独立稿由 host 自身 hidden 决定） */
function ccHost(){
  var ns=[].slice.call(document.querySelectorAll('.cc-host'));
  for(var i=0;i<ns.length;i++){
    var n=ns[i], sc=n.closest('.screen');
    if(!n.classList.contains('hidden') && (!sc || !sc.classList.contains('hidden'))) return n;
  }
  return ns[0]||null;
}
/* [原型] 状态矩阵控件：只出现在本模块 5 屏顶部，落地不保留 */
function protoBar(){
  return '<div class="cc-bar"><span class="tag">[原型] 状态</span>'
    + STATES.map(function(s){
        return '<button type="button" class="'+(S.state===s[0]?'on':'')+'" '
          +'onclick="setState(\''+s[0]+'\')">'+s[1]+'</button>';
      }).join('')
    + '<span class="sp">当前：<b>'+curStateLabel()+'</b> · 5 屏 × 5 态均需有回应</span></div>';
}
/* 主渲染：渲染到「当前可见的 host」，不碰壳（壳归 proto-shell.mjs 单源） */
function apply(){
  var host=ccHost(); if(!host) return;
  S.screen=host.getAttribute('data-cc')||S.screen;
  host.innerHTML=protoBar()+screenHtml();
  renderSeatTable(); renderDrawer(); renderModal();
}
function setState(st){ S.state=st; apply(); }
/* 屏分发：只本模块 5 屏（系统设置 / 对话调试 / 占位屏不属本模块，已随无关段切走） */
function screenHtml(){
  switch(S.screen){
    case 'content-overview': return screenOverview();
    case 'content-items':    return screenItems();
    case 'content-detail':   return screenDetail();
    case 'content-lhb':      return screenLhb();
    case 'content-seats':    return screenSeats();
  }
  return '<div class="note warn"><span>未知屏：'+esc(S.screen)+'</span></div>';
}
function curStateLabel(){
  var l='正常'; STATES.forEach(function(s){ if(s[0]===S.state) l=s[1]; }); return l;
}

/* 入口：独立打开渲染第一屏；在整合稿里由 hub 的 showHub 调 CC.apply() */
apply();
</script>
