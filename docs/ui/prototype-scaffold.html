<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>【产品名】· 交互原型 v1（复制此骨架改）</title>
<style>
  /* =========================================================
     1) 设计 Token —— 颜色/圆角/阴影全部变量化。
        - admin 系：--primary 用平台主橙 #F97316（DR-3）
        - 品牌/产品端：把 --primary / --primary-dark / --primary-soft
          换成产品品牌色（如合同翻译官 #1E6FFF）
        - 暗底/亮底随目标端切换（下面给亮底示例，暗底改 --bg/--card/--text）
       规则：业务样式只引变量，裸 hex 只允许出现在 :root 定义处。
     ========================================================= */
  :root{
    --primary:#F97316; --primary-dark:#EA6A0A; --primary-soft:#FFF1E7;
    --bg:#F5F7FA; --card:#FFFFFF; --text:#1A1F2E; --text-2:#5B6372; --text-3:#9AA1AD;
    --danger:#E5484D; --danger-soft:#FDEBEC;
    --warn:#E8833A;  --warn-soft:#FFF3E6;
    --ok:#2E9E5B;    --ok-soft:#E7F5EC;
    --border:#E8EBF0; --radius:14px; --radius-sm:10px;
    --shadow:0 2px 12px rgba(20,30,50,.06);
    --gap:8px;            /* 间距栅格基准（8px 体系） */
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
    background:#E9EDF3;display:flex;justify-content:center;align-items:flex-start;
    min-height:100vh;padding:20px;gap:24px;
  }

  /* =========================================================
     2) 形态 A：移动端手机框（品牌/产品/C 端，390px 逻辑宽）
     ========================================================= */
  .phone{
    width:390px;background:var(--bg);border-radius:40px;overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.18);border:8px solid #111;
    position:relative;min-height:844px;flex-shrink:0;
  }
  .status-bar{height:40px;background:var(--card);display:flex;align-items:flex-end;
    justify-content:space-between;padding:0 22px 6px;font-size:13px;font-weight:600;color:var(--text);}
  .nav-bar{height:48px;background:var(--card);display:flex;align-items:center;justify-content:center;
    position:sticky;top:0;z-index:20;border-bottom:1px solid var(--border);
    font-size:16px;font-weight:600;color:var(--text);}
  .nav-bar .back{position:absolute;left:14px;font-size:22px;color:var(--text-2);cursor:pointer;
    width:32px;height:32px;display:flex;align-items:center;justify-content:center;}
  .screen{display:none;}
  .screen.active{display:block;animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  .tabbar{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--border);
    display:flex;height:60px;padding-bottom:env(safe-area-inset-bottom);}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    color:var(--text-3);font-size:11px;cursor:pointer;transition:color .2s;}
  .tab.active{color:var(--primary);}
  .tab .ti{width:22px;height:22px;}
  .tab .ti svg{width:100%;height:100%;}

  /* =========================================================
     3) 形态 B：桌面端后台框（admin/deploy-console/内部工具）
        用 .desktop 替换 .phone；左侧边栏 + 顶栏 + 内容区
     ========================================================= */
  .desktop{width:1180px;height:760px;background:var(--bg);border-radius:16px;overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.18);border:1px solid var(--border);
    display:flex;flex-shrink:0;}
  .sidebar{width:220px;background:var(--card);border-right:1px solid var(--border);
    display:flex;flex-direction:column;padding:16px 12px;}
  .sidebar .logo{font-size:15px;font-weight:700;color:var(--text);padding:8px 10px 18px;}
  .side-item{padding:10px 12px;border-radius:var(--radius-sm);color:var(--text-2);font-size:14px;
    cursor:pointer;margin-bottom:4px;display:flex;align-items:center;gap:10px;}
  .side-item.active{background:var(--primary-soft);color:var(--primary);font-weight:600;}
  .main{flex:1;display:flex;flex-direction:column;min-width:0;}
  .topbar{height:56px;background:var(--card);border-bottom:1px solid var(--border);
    display:flex;align-items:center;padding:0 20px;font-size:16px;font-weight:600;color:var(--text);
    justify-content:space-between;}
  .content{flex:1;overflow:auto;padding:20px;}
  .content .screen{display:none;}
  .content .screen.active{display:block;}

  /* =========================================================
     4) 通用组件：卡片 / 按钮 / 标签 / 列表 / 弹层 / Toast
     ========================================================= */
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:16px;margin-bottom:16px;border:1px solid var(--border);}
  .card .t{font-size:13px;color:var(--text-3);margin-bottom:10px;font-weight:600;}
  .btn-primary{background:var(--primary);color:#fff;border:none;border-radius:12px;
    padding:14px;font-size:16px;font-weight:600;width:100%;cursor:pointer;transition:opacity .2s,transform .1s;}
  .btn-primary:active{opacity:.85;transform:scale(.99);}
  .btn-outline{background:#fff;color:var(--primary);border:1.5px solid var(--primary);
    border-radius:12px;padding:13px;font-size:15px;font-weight:600;width:100%;cursor:pointer;}
  .btn-primary[disabled]{opacity:.5;cursor:not-allowed;}
  .tag{font-size:12px;padding:4px 10px;border-radius:20px;font-weight:600;}
  .tag.primary{color:var(--primary);background:var(--primary-soft);}
  .tag.danger{color:var(--danger);background:var(--danger-soft);}
  .tag.warn{color:var(--warn);background:var(--warn-soft);}
  .tag.ok{color:var(--ok);background:var(--ok-soft);}
  .row{display:flex;align-items:center;gap:10px;}
  .muted{color:var(--text-3);font-size:12px;}
  /* 列表骨架/空态/错误态 */
  .skeleton{height:14px;border-radius:6px;background:linear-gradient(90deg,#eef0f3 25%,#e3e6ea 37%,#eef0f3 63%);background-size:400% 100%;animation:sk 1.2s ease infinite;}
  @keyframes sk{0%{background-position:100% 0}100%{background-position:-100% 0}}
  .empty,.error{text-align:center;padding:48px 20px;color:var(--text-3);}
  .empty .ic,.error .ic{width:48px;height:48px;margin:0 auto 12px;color:var(--text-3);opacity:.6;}
  /* 弹层 */
  .modal-mask{position:absolute;inset:0;background:rgba(0,0,0,.45);display:none;
    align-items:center;justify-content:center;z-index:50;padding:24px;}
  .modal-mask.show{display:flex;}
  .modal{background:var(--card);border-radius:var(--radius);padding:20px;width:100%;max-width:320px;
    animation:fadeIn .2s ease;}
  /* Toast */
  .toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    background:rgba(0,0,0,.8);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;
    z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;}
  .toast.show{opacity:1;}

  /* =========================================================
     5) 表单（桌面/移动通用）：输入态 + 校验态
     ========================================================= */
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;color:var(--text-2);margin-bottom:6px;font-weight:600;}
  .field input,.field textarea,.field select{width:100%;padding:11px 12px;border:1.5px solid var(--border);
    border-radius:var(--radius-sm);font-size:14px;color:var(--text);background:var(--card);outline:none;}
  .field input:focus,.field textarea:focus{border-color:var(--primary);}
  .field.err input{border-color:var(--danger);}
  .field .msg{font-size:12px;color:var(--danger);margin-top:5px;display:none;}
  .field.err .msg{display:block;}
</style>
</head>
<body>

<!-- ============ 形态 A：移动端（复制这一段，删掉 .desktop） ============ -->
<div class="phone">
  <div class="status-bar"><span>9:41</span><span>5G ▮▮▮ 100%</span></div>
  <div class="nav-bar"><span class="back" onclick="back()">‹</span><span id="navTitle">首页</span></div>

  <!-- 屏 1 -->
  <div class="screen active" id="screen-home">
    <div class="card">
      <div class="t">模块标题</div>
      <div style="font-size:15px;color:var(--text);line-height:1.7;">在此放置页面内容。<br>用真实文案，不要 lorem。</div>
    </div>
    <button class="btn-primary" onclick="go('screen-detail')">进入详情</button>
  </div>

  <!-- 屏 2 -->
  <div class="screen" id="screen-detail">
    <div class="card">
      <div class="t">详情</div>
      <div class="row"><span class="tag primary">状态</span><span class="muted">2026-09-04</span></div>
    </div>
    <button class="btn-outline" onclick="openModal('m1')">打开弹层</button>
  </div>

  <!-- 底部 Tab（按需） -->
  <div class="tabbar">
    <div class="tab active" onclick="switchTab('home')"><div class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div><span>首页</span></div>
    <div class="tab" onclick="switchTab('mine')"><div class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div><span>我的</span></div>
  </div>

  <!-- 弹层 / Toast 容器（移动端绝对定位于 .phone 内） -->
  <div class="modal-mask" id="m1" onclick="if(event.target===this)closeModal('m1')">
    <div class="modal"><div class="t" style="margin-bottom:12px;font-size:15px;color:var(--text);">弹层标题</div>
      <div class="muted" style="margin-bottom:16px;">弹层内容说明。</div>
      <button class="btn-primary" onclick="closeModal('m1');toast('已确认')">确认</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>
</div>

<!-- ============ 形态 B：桌面端后台（不用移动端就删掉 .phone） ============ -->
<div class="desktop">
  <div class="sidebar">
    <div class="logo">控制台</div>
    <div class="side-item active" onclick="desk('dash')">📊 仪表盘</div>
    <div class="side-item" onclick="desk('list')">📋 列表</div>
  </div>
  <div class="main">
    <div class="topbar"><span id="deskTitle">仪表盘</span><span class="muted">管理员</span></div>
    <div class="content">
      <div class="screen active" id="desk-dash"><div class="card"><div class="t">概览</div><div>桌面端内容区。</div></div></div>
      <div class="screen" id="desk-list"><div class="card"><div class="t">列表</div><div>列表内容。</div></div></div>
    </div>
  </div>
</div>

<script>
  /* ===== 移动端：屏切换（栈式，支持返回） ===== */
  var stack = ['screen-home'];
  function go(id, title){
    document.querySelectorAll('.phone .screen').forEach(s=>s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    if(title) document.getElementById('navTitle').textContent = title;
    stack.push(id);
    window.scrollTo({top:0});
  }
  function back(){
    if(stack.length>1){ stack.pop(); var prev=stack[stack.length-1];
      document.querySelectorAll('.phone .screen').forEach(s=>s.classList.remove('active'));
      document.getElementById(prev).classList.add('active');
      document.getElementById('navTitle').textContent = prev==='screen-home'?'首页':'详情';
    }
  }
  function switchTab(name){
    var map={home:'screen-home',mine:'screen-mine'};
    document.querySelectorAll('.phone .tab').forEach(t=>t.classList.remove('active'));
    event.currentTarget.classList.add('active');
    go(map[name]);
  }
  /* ===== 弹层 / Toast ===== */
  function openModal(id){document.getElementById(id).classList.add('show');}
  function closeModal(id){document.getElementById(id).classList.remove('show');}
  var toastTimer;
  function toast(msg){
    var el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show');
    clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),1500);
  }
  /* ===== 手风琴（信号卡/FAQ） ===== */
  function toggle(el){ el.closest('.card').classList.toggle('open'); }
  /* ===== 桌面端后台切换 ===== */
  function desk(name){
    document.querySelectorAll('.side-item').forEach(i=>i.classList.remove('active'));
    event.currentTarget.classList.add('active');
    document.querySelectorAll('.content .screen').forEach(s=>s.classList.remove('active'));
    document.getElementById('desk-'+name).classList.add('active');
    document.getElementById('deskTitle').textContent = name==='dash'?'仪表盘':'列表';
  }
  /* ===== 模拟异步加载（进度环/分步，按需复制） ===== */
  function simulate(elId, ms){ var el=document.getElementById(elId); if(el){el.textContent='加载中…';
    setTimeout(()=>el.textContent='完成', ms||800);} }
</script>
</body>
</html>
