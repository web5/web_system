<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>科豆财经资讯 — 波心态 Core Wave</title>
  <desc>白色科豆内嵌一条波形芯线，种子是容器、波形是它盛放的信息</desc>

  <!-- 背景：暖橙圆角矩形 -->
  <rect x="0" y="0" width="128" height="128" rx="28" fill="#F97316"/>

  <!-- 白色种子（豆），重心略低于画布中心 -->
  <g transform="translate(64, 80)">
    <path d="M 0 -36
             C 18.9 -36, 29.2 -22.4, 29.2 0
             C 29.2 25.8, 13.7 36, 0 36
             C -15.5 36, -29.2 24.1, -29.2 0
             C -29.2 -24.1, -15.5 -36, 0 -36 Z" fill="white"/>
    <circle cx="0" cy="-1.6" r="3" fill="#FDE68A"/>
  </g>

  <!-- 波形芯：一条在豆身内横向流动的资讯波 -->
  <path d="M 40 80
           C 46.5 72, 53.5 72, 60 80
           C 66.5 88, 73.5 88, 80 80
           C 84.5 74.5, 87 74.5, 89.5 78"
        fill="none" stroke="#F97316" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 波形末端光点：信息落点 -->
  <circle cx="91.5" cy="78.5" r="3.4" fill="#F97316"/>
</svg>
