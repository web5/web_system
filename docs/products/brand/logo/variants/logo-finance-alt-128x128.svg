<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>科豆财经资讯 — 128x128 图标（方案B）</title>
  <desc>圆角矩形橙色背景，白色科豆图标 + 底部资讯标签</desc>

  <!-- 圆角矩形背景 -->
  <rect x="0" y="0" width="128" height="128" rx="28" fill="#F97316"/>

  <!-- 豆子图标（居中偏上） -->
  <g transform="translate(64, 48)">
    <path d="M0 -22 C 11 -22, 19 -14, 19 0 C 19 16, 11 22, 0 22 C -11 22, -19 14, -19 0 C -19 -14, -11 -22, 0 -22 Z" fill="white"/>
    <circle cx="0" cy="0" r="6.5" fill="#F97316"/>
    <circle cx="0" cy="-1" r="2.5" fill="#FDE68A"/>
  </g>

  <!-- 底部资讯标签条 -->
  <g transform="translate(64, 100)">
    <rect x="-30" y="-7" width="60" height="14" rx="7" fill="white" opacity="0.15"/>
    <rect x="-30" y="-7" width="32" height="14" rx="7" fill="white" opacity="0.85"/>
    <text x="0" y="3.5" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="6.5" font-weight="500" fill="white" letter-spacing="0.5">资讯</text>
  </g>
</svg>
