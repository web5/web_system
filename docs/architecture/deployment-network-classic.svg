<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="nArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2E5C8A"/>
    </marker>
    <marker id="nArrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B03A3A"/>
    </marker>
    <marker id="nArrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B6673"/>
    </marker>

    <g id="srv">
      <rect x="0" y="0" width="56" height="48" rx="4" fill="#FFFFFF" stroke="#5B7DA6" stroke-width="1.5"/>
      <line x1="6" y1="14" x2="50" y2="14" stroke="#A9BDD1" stroke-width="1"/>
      <line x1="6" y1="26" x2="50" y2="26" stroke="#A9BDD1" stroke-width="1"/>
      <line x1="6" y1="38" x2="50" y2="38" stroke="#A9BDD1" stroke-width="1"/>
      <circle cx="48" cy="7" r="2.6" fill="#52C41A"/>
    </g>
    <g id="srvSm">
      <rect x="0" y="0" width="40" height="36" rx="3" fill="#FFFFFF" stroke="#5B7DA6" stroke-width="1.3"/>
      <line x1="5" y1="11" x2="35" y2="11" stroke="#A9BDD1" stroke-width="1"/>
      <line x1="5" y1="20" x2="35" y2="20" stroke="#A9BDD1" stroke-width="1"/>
      <line x1="5" y1="29" x2="35" y2="29" stroke="#A9BDD1" stroke-width="1"/>
    </g>
    <g id="db">
      <path d="M0,10 L0,44 A24,8 0 0,0 48,44 L48,10 Z" fill="#FFFFFF" stroke="#B07BA0" stroke-width="1.5"/>
      <ellipse cx="24" cy="10" rx="24" ry="8" fill="#FDF2FA" stroke="#B07BA0" stroke-width="1.5"/>
      <path d="M0,27 A24,7 0 0,0 48,27" fill="none" stroke="#D9B6CC" stroke-width="1"/>
    </g>
    <g id="cloud">
      <path d="M6,40 A10,10 0 0,1 8,22 A14,14 0 0,1 32,12 A12,12 0 0,1 54,22 A9,9 0 0,1 58,40 Z" fill="#FFFFFF" stroke="#5B7DA6" stroke-width="1.5"/>
    </g>
    <g id="fw">
      <rect x="0" y="0" width="68" height="44" rx="3" fill="#FFFFFF" stroke="#C0504D" stroke-width="1.5"/>
      <line x1="0" y1="15" x2="68" y2="15" stroke="#E0A0A0" stroke-width="1"/>
      <line x1="0" y1="29" x2="68" y2="29" stroke="#E0A0A0" stroke-width="1"/>
      <line x1="17" y1="0" x2="17" y2="15" stroke="#E0A0A0" stroke-width="1"/>
      <line x1="51" y1="0" x2="51" y2="15" stroke="#E0A0A0" stroke-width="1"/>
      <line x1="34" y1="15" x2="34" y2="29" stroke="#E0A0A0" stroke-width="1"/>
      <line x1="17" y1="29" x2="17" y2="44" stroke="#E0A0A0" stroke-width="1"/>
      <line x1="51" y1="29" x2="51" y2="44" stroke="#E0A0A0" stroke-width="1"/>
    </g>
  </defs>

  <rect width="1440" height="980" fill="#FAFBFC"/>

  <!-- Header -->
  <rect x="0" y="0" width="1440" height="56" fill="#1F3864"/>
  <text x="40" y="30" font-size="21" font-weight="600" fill="#FFFFFF">科豆 AI（web_system）· 网络部署架构图</text>
  <text x="40" y="47" font-size="12" fill="#B9CBE3">Classic Network Deployment Topology · 三环境 + 跨 VPC 边界 + 发布链路 · 2026-10-09</text>

  <!-- Internet -->
  <use href="#cloud" x="688" y="76"/>
  <text x="720" y="142" font-size="12.5" font-weight="600" fill="#1F2937" text-anchor="middle">Internet（公网用户 · 小程序 · AI 客户端）</text>
  <path d="M720,120 L720,164" stroke="#2E5C8A" stroke-width="1.6" marker-end="url(#nArr)"/>

  <!-- 防火墙 -->
  <use href="#fw" x="690" y="168"/>
  <text x="776" y="186" font-size="12.5" font-weight="600" fill="#1F2937">防火墙 / 安全组</text>
  <text x="776" y="204" font-size="11" fill="#5B6673">GATEWAY 机仅开放 22 / 80 / 443；其余端口不对外</text>
  <path d="M724,212 L724,266" stroke="#2E5C8A" stroke-width="1.6" marker-end="url(#nArr)"/>

  <!-- GitHub（管理/发布侧） -->
  <use href="#cloud" x="100" y="246"/>
  <text x="132" y="308" font-size="11.5" font-weight="600" fill="#1F2937" text-anchor="middle">GitHub</text>
  <text x="132" y="324" font-size="10.5" fill="#5B6673" text-anchor="middle">仓库 + Actions</text>
  <path d="M132,290 L132,404" stroke="#5B6673" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#nArrG)"/>
  <text x="140" y="350" font-size="10.5" fill="#5B6673">① push 触发</text>
  <text x="140" y="366" font-size="10.5" fill="#5B6673">HMAC 签名投递</text>
  <text x="140" y="382" font-size="10.5" fill="#5B6673">/api/hooks/release</text>

  <!-- DMZ -->
  <rect x="300" y="246" width="1040" height="140" rx="4" fill="#F2F7FC" stroke="#7EA6DB" stroke-width="1.2" stroke-dasharray="7 4"/>
  <rect x="300" y="246" width="200" height="26" fill="#7EA6DB"/>
  <text x="312" y="264" font-size="11.5" font-weight="600" fill="#FFFFFF">DMZ / 边缘接入区</text>

  <use href="#srv" x="330" y="290"/>
  <text x="330" y="356" font-size="10.5" fill="#5B6673" text-anchor="middle">GATEWAY 机</text>

  <rect x="400" y="272" width="580" height="80" rx="3" fill="#FFFFFF" stroke="#B4C6E7"/>
  <text x="416" y="294" font-size="12.5" font-weight="600" fill="#1F2937">Nginx 反向代理（SSL 终止）</text>
  <text x="416" y="313" font-size="11" fill="#5B6673">域名路由：kedouai.com（prod）· dev.kedouai.com（dev）· local.kedouai.com（本机）</text>
  <text x="416" y="331" font-size="11" fill="#5B6673">反向代理后端：→ dev / prod 的 :6000（Gateway）与 :6006（MCP）</text>
  <text x="416" y="347" font-size="11" fill="#B03A3A">portal.kedouai.com 已下线：DNS 保留、证书不含、无 server 块 → 能解析但访问必失败</text>

  <rect x="996" y="272" width="328" height="80" rx="3" fill="#FFFFFF" stroke="#B4C6E7"/>
  <text x="1012" y="294" font-size="12.5" font-weight="600" fill="#1F2937">公网入口清单</text>
  <text x="1012" y="313" font-size="11" fill="#5B6673">:443 HTTPS（业务 / 微前端基座）</text>
  <text x="1012" y="331" font-size="11" fill="#5B6673">:22 SSH（运维，仅密钥登录）</text>
  <text x="1012" y="347" font-size="11" fill="#5B6673">:6006 /mcp（AI 客户端，经网关反代）</text>

  <!-- DEV -->
  <rect x="100" y="410" width="600" height="290" rx="4" fill="#EAF4E7" stroke="#7FB069" stroke-width="1.2"/>
  <rect x="100" y="410" width="600" height="32" fill="#3F6B2E"/>
  <text x="116" y="431" font-size="13" font-weight="600" fill="#FFFFFF">DEV 环境 · ap-nanjing-3</text>
  <text x="684" y="431" font-size="11" fill="#D8EAD0" text-anchor="end">VPC-A 10.206.16.0/20 · dev.kedouai.com</text>

  <g>
    <rect x="112" y="452" width="576" height="52" rx="3" fill="#FFFFFF" stroke="#A9C99A"/>
    <use href="#srvSm" x="124" y="460"/>
    <text x="176" y="478" font-size="12.5" font-weight="600" fill="#1F2937">应用服务器 · pm2 ×12</text>
    <text x="176" y="495" font-size="11" fill="#5B6673">gateway 6000 · auth/user/ai/system/todo/mcp-gw/content-hub/upload/ai-agent/knowledge（6000 系，端口写死）</text>
  </g>
  <g>
    <rect x="112" y="512" width="576" height="52" rx="3" fill="#FFF8E6" stroke="#E0B050"/>
    <use href="#srvSm" x="124" y="520"/>
    <text x="176" y="538" font-size="12.5" font-weight="600" fill="#8A6100">deploy-console :6200 ★ 发布平台主运行环境（决策：不在 prod 部署）</text>
    <text x="176" y="555" font-size="11" fill="#5B6673">流水线四步（可定制）· 版本指针 · 审批灰度 · 配置中心 → 下发 .env.generated / 注入流水线变量（GitHub Token）</text>
  </g>
  <g>
    <rect x="112" y="572" width="576" height="52" rx="3" fill="#FFFFFF" stroke="#A9C99A"/>
    <use href="#srvSm" x="124" y="580"/>
    <text x="176" y="598" font-size="12.5" font-weight="600" fill="#1F2937">CI runner · GitHub Actions self-hosted</text>
    <text x="176" y="615" font-size="11" fill="#5B6673">构建在 dev 机执行；产物投递到目标机版本目录（禁止手动 ssh 构建）</text>
  </g>
  <g>
    <rect x="112" y="632" width="576" height="52" rx="3" fill="#FFFFFF" stroke="#A9C99A"/>
    <use href="#db" x="120" y="636"/>
    <text x="176" y="658" font-size="12.5" font-weight="600" fill="#1F2937">MySQL（dev 机本地）+ Redis</text>
    <text x="176" y="675" font-size="11" fill="#5B6673">web_system + web_system_deploy（不镜像 prod）；控制台公网可达，收敛中</text>
  </g>

  <!-- 跨 VPC -->
  <path d="M708,560 L732,560" stroke="#B03A3A" stroke-width="1.5" stroke-dasharray="5 4" marker-start="url(#nArrR)" marker-end="url(#nArrR)"/>
  <text x="720" y="546" font-size="10.5" fill="#B03A3A" text-anchor="middle">跨 VPC</text>
  <text x="720" y="580" font-size="10.5" fill="#B03A3A" text-anchor="middle">仅公网</text>

  <!-- PROD -->
  <rect x="740" y="410" width="600" height="290" rx="4" fill="#E8F0FE" stroke="#7EA6DB" stroke-width="1.2"/>
  <rect x="740" y="410" width="600" height="32" fill="#2E5C8A"/>
  <text x="756" y="431" font-size="13" font-weight="600" fill="#FFFFFF">PROD 环境 · ap-guangzhou-4</text>
  <text x="1324" y="431" font-size="11" fill="#CFE0F5" text-anchor="end">VPC-B 172.16.16.0/20 · kedouai.com</text>

  <g>
    <rect x="752" y="452" width="576" height="52" rx="3" fill="#FFFFFF" stroke="#B4C6E7"/>
    <use href="#srvSm" x="764" y="460"/>
    <text x="816" y="478" font-size="12.5" font-weight="600" fill="#1F2937">应用服务器 · pm2 ×11</text>
    <text x="816" y="495" font-size="11" fill="#5B6673">6000 系与 DEV 一致（11 个微服务）· deploy-console ✗ 不在 prod 部署</text>
  </g>
  <g>
    <rect x="752" y="512" width="576" height="52" rx="3" fill="#FFFFFF" stroke="#B4C6E7"/>
    <use href="#srvSm" x="764" y="520"/>
    <text x="816" y="538" font-size="12.5" font-weight="600" fill="#1F2937">静态资源外置</text>
    <text x="816" y="555" font-size="11" fill="#5B6673">/data/web_system_static/public（STATIC_PUBLIC_ROOT 须写在根 .env.production，写服务 .env 无效）</text>
  </g>
  <g>
    <rect x="752" y="572" width="576" height="52" rx="3" fill="#FFFFFF" stroke="#B4C6E7"/>
    <use href="#srvSm" x="764" y="580"/>
    <text x="816" y="598" font-size="12.5" font-weight="600" fill="#1F2937">运行目录 / 版本目录</text>
    <text x="816" y="615" font-size="11" fill="#5B6673">/data/web_system_git · servers/&lt;svc&gt;/&lt;key&gt;/&lt;commit&gt;（切换 = 换版本目录 + pm2 restart）</text>
  </g>
  <g>
    <rect x="752" y="632" width="576" height="52" rx="3" fill="#FFF8E6" stroke="#E0B050"/>
    <use href="#fw" x="758" y="638"/>
    <text x="836" y="658" font-size="12.5" font-weight="600" fill="#8A6100">iptables 双链白名单</text>
    <text x="836" y="675" font-size="11" fill="#5B6673">INPUT + DOCKER-USER（容器映射端口不走 INPUT 链）· 仅放行 lo / 云内网 / dev / gateway</text>
  </g>

  <!-- gateway → dev/prod -->
  <path d="M724,388 C724,398 500,400 400,406" stroke="#2E5C8A" stroke-width="1.6" fill="none" marker-end="url(#nArr)"/>
  <path d="M900,388 C900,398 1100,400 1040,406" stroke="#2E5C8A" stroke-width="1.6" fill="none" marker-end="url(#nArr)"/>
  <text x="560" y="402" font-size="10.5" fill="#2E5C8A">HTTPS → :6000 / :6006</text>
  <text x="1060" y="402" font-size="10.5" fill="#2E5C8A">HTTPS → :6000 / :6006</text>

  <!-- 数据区 -->
  <rect x="100" y="730" width="1240" height="120" rx="4" fill="#F0EAF8" stroke="#9B7FC4" stroke-width="1.2"/>
  <rect x="100" y="730" width="220" height="26" fill="#5B3F8A"/>
  <text x="112" y="748" font-size="11.5" font-weight="600" fill="#FFFFFF">数据区 / 云资源（与 PROD 同 VPC）</text>

  <g>
    <rect x="120" y="766" width="386" height="66" rx="3" fill="#FFFFFF" stroke="#C4B0DF"/>
    <use href="#db" x="132" y="774"/>
    <text x="192" y="792" font-size="12.5" font-weight="600" fill="#1F2937">云数据库 MySQL</text>
    <text x="192" y="810" font-size="11" fill="#5B6673">web_system（业务）· web_system_knowledge（RAG）</text>
    <text x="192" y="826" font-size="11" fill="#5B6673">web_system_deploy（发布平台）· _shadow（影子演练）</text>
  </g>
  <g>
    <rect x="526" y="766" width="386" height="66" rx="3" fill="#FFFFFF" stroke="#C4B0DF"/>
    <use href="#db" x="538" y="774"/>
    <text x="598" y="792" font-size="12.5" font-weight="600" fill="#1F2937">云 Redis</text>
    <text x="598" y="810" font-size="11" fill="#5B6673">缓存 / 会话 / 令牌</text>
    <text x="598" y="826" font-size="11" fill="#B03A3A">曾公网无口令可达（已止血：白名单 + 备份规则）</text>
  </g>
  <g>
    <rect x="932" y="766" width="386" height="66" rx="3" fill="#FFFFFF" stroke="#C4B0DF"/>
    <use href="#srvSm" x="944" y="780"/>
    <text x="996" y="792" font-size="12.5" font-weight="600" fill="#1F2937">发布制品 / 静态产物</text>
    <text x="996" y="810" font-size="11" fill="#5B6673">版本目录 servers/&lt;svc&gt;/&lt;key&gt;/&lt;commit&gt;</text>
    <text x="996" y="826" font-size="11" fill="#5B6673">modules/&lt;key&gt;/&lt;env&gt;/&lt;commit&gt; · CDN 按需子集</text>
  </g>

  <path d="M400,700 L400,726" stroke="#B03A3A" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#nArrR)"/>
  <text x="330" y="722" font-size="10.5" fill="#B03A3A">公网 SSL</text>
  <path d="M1040,700 L1040,726" stroke="#2E5C8A" stroke-width="1.6" marker-end="url(#nArr)"/>
  <text x="1050" y="722" font-size="10.5" fill="#2E5C8A">云内网</text>

  <!-- 图例 -->
  <rect x="100" y="880" width="1240" height="70" rx="4" fill="#FFFFFF" stroke="#D5DCE4"/>
  <text x="116" y="900" font-size="11.5" font-weight="600" fill="#1F2937">图例</text>
  <line x1="170" y1="912" x2="220" y2="912" stroke="#2E5C8A" stroke-width="1.6"/>
  <text x="228" y="916" font-size="11" fill="#5B6673">内网 / 直连</text>
  <line x1="320" y1="912" x2="370" y2="912" stroke="#2E5C8A" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="378" y="916" font-size="11" fill="#5B6673">公网加密（HTTPS / SSL）</text>
  <line x1="540" y1="912" x2="590" y2="912" stroke="#B03A3A" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="598" y="916" font-size="11" fill="#5B6673">跨 VPC：仅公网可达（dev ↔ prod / dev → 云库）</text>
  <use href="#srvSm" x="900" y="894"/>
  <text x="948" y="916" font-size="11" fill="#5B6673">服务器 / 应用实例</text>
  <use href="#db" x="1090" y="890"/>
  <text x="1148" y="916" font-size="11" fill="#5B6673">数据库</text>
  <text x="116" y="936" font-size="10.5" fill="#8A8A99">事实源：docs/architecture/system-overview.md · 端口为 dev/prod 口径（本机 auth 为 6101）· 图中不含服务器公网地址（仓库 PUBLIC）</text>
</svg>
