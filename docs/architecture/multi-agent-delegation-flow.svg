<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 888" width="100%" role="img" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
<title>Agent-as-Tool 委派调用链</title><desc>父 Agent ReAct 循环输出子 Agent 工具调用后，经四道护栏检查，按需拉起子 Agent 独立循环，返回结构化摘要回写父上下文</desc>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M1,1 L9,5 L1,9" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<rect x="0" y="0" width="1200" height="888" fill="#ffffff"/><text x="40" y="48" font-size="19" font-weight="700" fill="#0f172a">一次委派调用：父循环不动，子 Agent 只是一个「特殊工具」</text>
<text x="40" y="72" font-size="12.8" fill="#64748b">本图 = 主链路图 <tspan font-family="ui-monospace,Menlo,monospace" fill="#c2410c">ai-agent-run-flow.svg</tspan> 中「递归层」（第 12–15 段，青色虚线框）的放大；单 Agent 运行不经过这里。</text>
<rect x="40" y="94" width="1120" height="98" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
<rect x="40" y="94" width="5" height="98" rx="2.5" fill="#1d4ed8"/>
<text x="60" y="117" font-size="14.6" font-weight="700" fill="#1d4ed8">父 Agent ReAct 循环</text>
<text x="60" y="148" font-size="13" fill="#475569">模型采样决定下一步：调普通工具，还是委派子 Agent —— 出口唯一，引擎无需感知差异</text>
<text x="60" y="170" font-size="11.8" fill="#94a3b8">代码落点：packages/agent-core/src/core/agent-engine.ts</text>
<line x1="600" y1="194" x2="600" y2="214" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="40" y="218" width="1120" height="98" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
<rect x="40" y="218" width="5" height="98" rx="2.5" fill="#1d4ed8"/>
<text x="60" y="241" font-size="14.6" font-weight="700" fill="#1d4ed8">tool_call: agent:&lt;子 Agent id&gt;</text>
<text x="60" y="272" font-size="13" fill="#475569">走与普通工具同一条 execute 路径；工具名由 capabilities 解析出（与 mcp 取短名同款规则）</text>
<text x="60" y="294" font-size="11.8" fill="#94a3b8">代码落点：capability-resolver.ts 新增 type=agent 分支</text>
<line x1="600" y1="318" x2="600" y2="338" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="40" y="342" width="1120" height="150" rx="10" fill="#ffffff" stroke="#fdba74" stroke-width="1.2"/>
<rect x="40" y="342" width="5" height="150" rx="2.5" fill="#c2410c"/>
<text x="60" y="365" font-size="14.6" font-weight="700" fill="#c2410c">四道护栏（缺一不可，任一失败即短路返回错误，不阻塞父循环）</text>
<text x="74" y="396" font-size="12.6" fill="#475569">深度上限 depth ≤ 3，超限直接返回错误，不再展开子调用</text>
<text x="74" y="417" font-size="12.6" fill="#475569">调用栈去重：A→B→A 立即熔断，杜绝循环烧钱</text>
<text x="74" y="438" font-size="12.6" fill="#475569">全局步数预算跨层递减，避免父子 maxSteps 相乘放大成本</text>
<text x="74" y="459" font-size="12.6" fill="#475569">权限取「父 ∩ 子声明」的交集，不是并集，防权限放大</text>
<line x1="600" y1="494" x2="600" y2="514" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="40" y="518" width="1120" height="98" rx="10" fill="#ffffff" stroke="#67e8f9" stroke-width="1.2"/>
<rect x="40" y="518" width="5" height="98" rx="2.5" fill="#0e7490"/>
<text x="60" y="541" font-size="14.6" font-weight="700" fill="#0e7490">子 Agent 独立循环（registerLazy 按需拉起）</text>
<text x="60" y="572" font-size="13" fill="#475569">只接收「子任务描述」，不继承父的完整上下文 —— 上下文隔离正是委派的收益所在</text>
<text x="60" y="594" font-size="11.8" fill="#94a3b8">代码落点：ToolRegistry.registerLazy(name, factory)</text>
<line x1="600" y1="618" x2="600" y2="638" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="40" y="642" width="1120" height="98" rx="10" fill="#ffffff" stroke="#67e8f9" stroke-width="1.2"/>
<rect x="40" y="642" width="5" height="98" rx="2.5" fill="#0e7490"/>
<text x="60" y="665" font-size="14.6" font-weight="700" fill="#0e7490">返回结构化摘要</text>
<text x="60" y="696" font-size="13" fill="#475569">只回结论 + 关键证据，不回过程全量；否则父上下文被撑爆，第二轮就超限</text>
<text x="60" y="718" font-size="11.8" fill="#94a3b8">代码落点：子 run 末步强制生成 summary</text>
<line x1="600" y1="742" x2="600" y2="762" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="40" y="766" width="1120" height="98" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
<rect x="40" y="766" width="5" height="98" rx="2.5" fill="#1d4ed8"/>
<text x="60" y="789" font-size="14.6" font-weight="700" fill="#1d4ed8">摘要作为 tool_result 回写父上下文</text>
<text x="60" y="820" font-size="13" fill="#475569">父循环继续推理；子 run 落 agent_runs 并挂 parentRunId + depth，保证可归因</text>
<text x="60" y="842" font-size="11.8" fill="#94a3b8">代码落点：agent_runs 新增 parentRunId / depth</text></svg>