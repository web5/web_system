<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1060" viewBox="0 0 1440 1060" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0A0D"/>
      <stop offset="1" stop-color="#13131C"/>
    </linearGradient>
    <marker id="arrOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F97316"/>
    </marker>
    <marker id="arrTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4ECDC4"/>
    </marker>
    <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B6B7B"/>
    </marker>
  </defs>

  <rect width="1440" height="1060" fill="url(#bgGrad)"/>

  <!-- Header -->
  <text x="40" y="42" font-size="26" font-weight="600" fill="#FFF8F0">科豆 AI · 业务分层架构</text>
  <text x="40" y="64" font-size="13" fill="#8A8A99">web_system monorepo · 六层结构 + 平台旁路 + 横切共享包 · 现状视图 2026-10-09</text>
  <text x="1400" y="64" font-size="12" fill="#5C5C6B" text-anchor="end">source: docs/architecture/system-overview.md</text>
  <line x1="40" y1="74" x2="1400" y2="74" stroke="#24242F" stroke-width="1"/>

  <!-- ===== L1 接入层 ===== -->
  <rect x="40" y="84" width="1360" height="96" rx="14" fill="#14141C" stroke="#24242F"/>
  <rect x="40" y="84" width="4" height="96" rx="2" fill="#4ECDC4"/>
  <text x="60" y="106" font-size="13" font-weight="600" fill="#4ECDC4">L1 · 接入层 / 端侧</text>

  <g>
    <rect x="60" y="116" width="330" height="48" rx="10" fill="#1B1B24" stroke="#2C2C3A"/>
    <text x="225" y="136" font-size="13.5" font-weight="500" fill="#FFF8F0">浏览器 Web</text>
    <text x="225" y="153" font-size="11" fill="#9090A2">shell 基座 + portal / admin 微前端模块</text>
  </g>
  <g>
    <rect x="394" y="116" width="330" height="48" rx="10" fill="#1B1B24" stroke="#2C2C3A"/>
    <text x="559" y="136" font-size="13.5" font-weight="500" fill="#FFF8F0">微信小程序 · 科豆 AI</text>
    <text x="559" y="153" font-size="11" fill="#9090A2">kedou-ai-minigram（原生 + TS）</text>
  </g>
  <g>
    <rect x="728" y="116" width="330" height="48" rx="10" fill="#1B1B24" stroke="#2C2C3A"/>
    <text x="893" y="136" font-size="13.5" font-weight="500" fill="#FFF8F0">运维控制台 SPA</text>
    <text x="893" y="153" font-size="11" fill="#9090A2">/console/，由 deploy-console 6200 serve</text>
  </g>
  <g>
    <rect x="1062" y="116" width="318" height="48" rx="10" fill="#1B1B24" stroke="#2C2C3A"/>
    <text x="1221" y="136" font-size="13.5" font-weight="500" fill="#FFF8F0">AI 客户端（MCP）</text>
    <text x="1221" y="153" font-size="11" fill="#9090A2">WorkBuddy / Claude · /mcp、/mcp/:module</text>
  </g>

  <path d="M720,180 L720,200" stroke="#F97316" stroke-width="1.6" marker-end="url(#arrOrange)"/>

  <!-- ===== L2 网关层 ===== -->
  <rect x="40" y="204" width="1360" height="132" rx="14" fill="#14141C" stroke="#24242F"/>
  <rect x="40" y="204" width="4" height="132" rx="2" fill="#F97316"/>
  <text x="60" y="226" font-size="13" font-weight="600" fill="#F97316">L2 · 边缘与网关层（统一入口）</text>

  <g>
    <rect x="60" y="236" width="252" height="80" rx="10" fill="#1B1B24" stroke="#3A3A4A"/>
    <text x="186" y="264" font-size="13.5" font-weight="500" fill="#FFF8F0">Nginx（GATEWAY 机）</text>
    <text x="186" y="284" font-size="11" fill="#9090A2">SSL 终止 · 域名路由</text>
    <text x="186" y="300" font-size="11" fill="#9090A2">反代 dev / prod 的 6000、6006</text>
  </g>

  <g>
    <rect x="330" y="236" width="1050" height="80" rx="10" fill="#1F1A16" stroke="#5A3A22"/>
    <text x="346" y="258" font-size="13.5" font-weight="500" fill="#FDBA74">Gateway :6000</text>
    <text x="346" y="276" font-size="11" fill="#9090A2">全部 API 唯一入口，前端不直连后端</text>
    <g font-size="11" fill="#C9C9D6">
      <rect x="346" y="288" width="248" height="24" rx="6" fill="#232323" stroke="#33333F"/>
      <text x="470" y="304" text-anchor="middle">/api/* 反代微服务</text>
      <rect x="602" y="288" width="248" height="24" rx="6" fill="#232323" stroke="#33333F"/>
      <text x="726" y="304" text-anchor="middle">微前端基座 + manifest 分发</text>
      <rect x="858" y="288" width="248" height="24" rx="6" fill="#232323" stroke="#33333F"/>
      <text x="982" y="304" text-anchor="middle">灰度命中（header/percent/list）</text>
      <rect x="1114" y="288" width="248" height="24" rx="6" fill="#232323" stroke="#33333F"/>
      <text x="1238" y="304" text-anchor="middle">静态托管 /api/uploads、/static/cdn</text>
    </g>
  </g>

  <path d="M520,336 L520,360" stroke="#F97316" stroke-width="1.6" marker-end="url(#arrOrange)"/>
  <path d="M1240,336 C1240,350 1248,352 1248,360" stroke="#F97316" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrOrange)"/>

  <!-- ===== L3 业务服务层 ===== -->
  <rect x="40" y="364" width="1040" height="196" rx="14" fill="#14141C" stroke="#24242F"/>
  <rect x="40" y="364" width="4" height="196" rx="2" fill="#FDBA74"/>
  <text x="60" y="386" font-size="13" font-weight="600" fill="#FDBA74">L3 · 业务应用服务层（NestJS 微服务 · pm2 托管 · 每服务独立库）</text>

  <g font-size="11" fill="#9090A2">
    <g>
      <rect x="56" y="400" width="326" height="42" rx="9" fill="#1B1B24" stroke="#2C2C3A"/>
      <text x="72" y="418" font-size="13" font-weight="500" fill="#FFF8F0">auth-service <tspan fill="#F97316">:6001</tspan></text>
      <text x="72" y="434" font-size="11" fill="#9090A2">认证 · JWT · 微信 OAuth / 小程序登录</text>
    </g>
    <g>
      <rect x="396" y="400" width="326" height="42" rx="9" fill="#1B1B24" stroke="#2C2C3A"/>
      <text x="412" y="418" font-size="13" font-weight="500" fill="#FFF8F0">user-service <tspan fill="#F97316">:6002</tspan></text>
      <text x="412" y="434" font-size="11" fill="#9090A2">用户 · API Key · 权限 · 记忆</text>
    </g>
    <g>
      <rect x="736" y="400" width="326" height="42" rx="9" fill="#1B1B24" stroke="#2C2C3A"/>
      <text x="752" y="418" font-size="13" font-weight="500" fill="#FFF8F0">ai-service <tspan fill="#F97316">:6003</tspan></text>
      <text x="752" y="434" font-size="11" fill="#9090A2">对话 · 生图 · TTS · 变变 · 作品</text>
    </g>
    <g>
      <rect x="56" y="452" width="326" height="42" rx="9" fill="#1B1B24" stroke="#2C2C3A"/>
      <text x="72" y="470" font-size="13" font-weight="500" fill="#FFF8F0">ai-agent <tspan fill="#F97316">:6010</tspan></text>
      <text x="72" y="486" font-size="11" fill="#9090A2">Agent 运行时 / 编排（ReAct）· OCR</text>
    </g>
    <g>
      <rect x="396" y="452" width="326" height="42" rx="9" fill="#1B1B24" stroke="#2C2C3A"/>
      <text x="412" y="470" font-size="13" font-weight="500" fill="#FFF8F0">knowledge-service <tspan fill="#F97316">:6011</tspan></text>
      <text x="412" y="486" font-size="11" fill="#9090A2">RAG：分块 · embedding · 余弦检索</text>
    </g>
    <g>
      <rect x="736" y="452" width="326" height="42" rx="9" fill="#1B1B24" stroke="#2C2C3A"/>
      <text x="752" y="470" font-size="13" font-weight="500" fill="#FFF8F0">content-hub <tspan fill="#F97316">:6007</tspan></text>
      <text x="752" y="486" font-size="11" fill="#9090A2">财经 / 论文 / 资讯采集 + 公众号发布</text>
    </g>
    <g>
      <rect x="56" y="504" width="326" height="42" rx="9" fill="#1B1B24" stroke="#2C2C3A"/>
      <text x="72" y="522" font-size="13" font-weight="500" fill="#FFF8F0">todo-service <tspan fill="#F97316">:6005</tspan></text>
      <text x="72" y="538" font-size="11" fill="#9090A2">待办任务</text>
    </g>
    <g>
      <rect x="396" y="504" width="326" height="42" rx="9" fill="#1B1B24" stroke="#2C2C3A"/>
      <text x="412" y="522" font-size="13" font-weight="500" fill="#FFF8F0">system-service <tspan fill="#F97316">:6004</tspan></text>
      <text x="412" y="538" font-size="11" fill="#9090A2">系统配置 · 字典 · 操作日志 · 存储</text>
    </g>
    <g>
      <rect x="736" y="504" width="326" height="42" rx="9" fill="#1B1B24" stroke="#2C2C3A"/>
      <text x="752" y="522" font-size="13" font-weight="500" fill="#FFF8F0">upload-service <tspan fill="#F97316">:6008</tspan></text>
      <text x="752" y="538" font-size="11" fill="#9090A2">统一文件上传（落盘 /api/uploads/*）</text>
    </g>
  </g>

  <!-- ===== L3b 平台能力（旁路） ===== -->
  <rect x="1096" y="364" width="304" height="196" rx="14" fill="#14141C" stroke="#24242F"/>
  <rect x="1096" y="364" width="4" height="196" rx="2" fill="#4ECDC4"/>
  <text x="1112" y="386" font-size="13" font-weight="600" fill="#4ECDC4">L3b · 平台能力（旁路）</text>
  <g>
    <rect x="1112" y="400" width="268" height="76" rx="9" fill="#141C1C" stroke="#2C4A46"/>
    <text x="1128" y="422" font-size="13" font-weight="500" fill="#FFF8F0">mcp-gateway <tspan fill="#4ECDC4">:6006</tspan></text>
    <text x="1128" y="440" font-size="11" fill="#9090A2">streamable-http /mcp</text>
    <text x="1128" y="456" font-size="11" fill="#9090A2">声明式 HTTP → MCP 工具</text>
    <text x="1128" y="470" font-size="11" fill="#9090A2">模块管理 /api/modules</text>
  </g>
  <g>
    <rect x="1112" y="480" width="268" height="76" rx="9" fill="#1F1A16" stroke="#5A3A22"/>
    <text x="1128" y="500" font-size="13" font-weight="500" fill="#FFF8F0">deploy-console <tspan fill="#F97316">:6200</tspan></text>
    <text x="1128" y="518" font-size="11" fill="#9090A2">流水线（4 步可定制）+ 环境/版本指针/审批</text>
    <text x="1128" y="534" font-size="11" fill="#4ECDC4">配置中心：config_items 加密 · 审计 · 分层</text>
    <text x="1128" y="550" font-size="11" fill="#4ECDC4">→ 下发服务 .env.generated · 注入流水线变量</text>
  </g>
  <path d="M1112,500 C1078,500 1076,522 1064,528" stroke="#4ECDC4" stroke-width="1.3" stroke-dasharray="4 3" fill="none" marker-end="url(#arrTeal)"/>
  <text x="1090" y="474" font-size="10" fill="#4ECDC4" text-anchor="middle">配置下发</text>

  <path d="M320,560 L320,584" stroke="#F97316" stroke-width="1.6" marker-end="url(#arrOrange)"/>

  <!-- ===== L4 数据层 ===== -->
  <rect x="40" y="588" width="1360" height="140" rx="14" fill="#14141C" stroke="#24242F"/>
  <rect x="40" y="588" width="4" height="140" rx="2" fill="#8B7CF6"/>
  <text x="60" y="610" font-size="13" font-weight="600" fill="#8B7CF6">L4 · 数据与基础设施（运行时全部 MySQL）</text>

  <g>
    <rect x="60" y="622" width="540" height="86" rx="10" fill="#1B1B24" stroke="#2C2C3A"/>
    <text x="76" y="644" font-size="13" font-weight="500" fill="#FFF8F0">MySQL（运行时唯一数据库）</text>
    <g font-size="11" fill="#C9C9D6">
      <rect x="76" y="654" width="121" height="26" rx="6" fill="#232323" stroke="#33333F"/>
      <text x="136" y="671" text-anchor="middle">web_system 业务主库</text>
      <rect x="205" y="654" width="121" height="26" rx="6" fill="#232323" stroke="#33333F"/>
      <text x="265" y="671" text-anchor="middle">_knowledge RAG</text>
      <rect x="334" y="654" width="121" height="26" rx="6" fill="#232323" stroke="#33333F"/>
      <text x="394" y="671" text-anchor="middle">_deploy 发布平台</text>
      <rect x="463" y="654" width="121" height="26" rx="6" fill="#232323" stroke="#33333F"/>
      <text x="523" y="671" text-anchor="middle">_shadow 影子库</text>
    </g>
    <text x="76" y="696" font-size="11" fill="#6F6F80">prod 指针严格写云库（DEPLOY_CLOUD_DB_STRICT），dev/local 写本机，不镜像</text>
  </g>

  <g>
    <rect x="616" y="622" width="200" height="86" rx="10" fill="#1B1B24" stroke="#2C2C3A"/>
    <text x="716" y="650" font-size="13" font-weight="500" fill="#FFF8F0" text-anchor="middle">Redis</text>
    <text x="716" y="670" font-size="11" fill="#9090A2" text-anchor="middle">缓存 · 会话 · 令牌</text>
    <text x="716" y="690" font-size="11" fill="#6F6F80" text-anchor="middle">prod 曾公网可达，已加白名单</text>
  </g>

  <g>
    <rect x="832" y="622" width="540" height="86" rx="10" fill="#1B1B24" stroke="#2C2C3A"/>
    <text x="848" y="644" font-size="13" font-weight="500" fill="#FFF8F0">静态与文件存储</text>
    <g font-size="11" fill="#C9C9D6">
      <rect x="848" y="654" width="160" height="26" rx="6" fill="#232323" stroke="#33333F"/>
      <text x="928" y="671" text-anchor="middle">/api/uploads/*</text>
      <rect x="1020" y="654" width="160" height="26" rx="6" fill="#232323" stroke="#33333F"/>
      <text x="1100" y="671" text-anchor="middle">/static/cdn/pub/**</text>
      <rect x="1192" y="654" width="160" height="26" rx="6" fill="#232323" stroke="#33333F"/>
      <text x="1272" y="671" text-anchor="middle">prod 外置 static 根</text>
    </g>
    <text x="848" y="696" font-size="11" fill="#6F6F80">微前端产物 static/modules/&lt;key&gt;/&lt;env&gt;/&lt;commit&gt;/ · 三段式缓存</text>
  </g>

  <path d="M320,728 L320,752" stroke="#F97316" stroke-width="1.6" marker-end="url(#arrOrange)"/>

  <!-- ===== L5 外部依赖 ===== -->
  <rect x="40" y="756" width="1360" height="96" rx="14" fill="#14141C" stroke="#24242F"/>
  <rect x="40" y="756" width="4" height="96" rx="2" fill="#6B6B7B"/>
  <text x="60" y="778" font-size="13" font-weight="600" fill="#A8A8B8">L5 · 外部依赖（全部经服务端出网，前端不直连）</text>
  <g font-size="12.5" fill="#C9C9D6">
    <rect x="60" y="788" width="321" height="40" rx="8" fill="#1B1B24" stroke="#2C2C3A"/>
    <text x="220" y="813" text-anchor="middle">腾讯混元 / TokenHub（LLM 主通道）</text>
    <rect x="393" y="788" width="321" height="40" rx="8" fill="#1B1B24" stroke="#2C2C3A"/>
    <text x="553" y="813" text-anchor="middle">微信 OpenAPI（登录 / 公众号）</text>
    <rect x="726" y="788" width="321" height="40" rx="8" fill="#1B1B24" stroke="#2C2C3A"/>
    <text x="886" y="813" text-anchor="middle">腾讯云 TTS / OCR</text>
    <rect x="1059" y="788" width="321" height="40" rx="8" fill="#1B1B24" stroke="#2C2C3A"/>
    <text x="1219" y="813" text-anchor="middle">财经 / 论文 / 资讯数据源</text>
  </g>

  <!-- ===== L6 共享包（横切） ===== -->
  <rect x="40" y="872" width="1360" height="104" rx="14" fill="#14141C" stroke="#24242F" stroke-dasharray="6 4"/>
  <rect x="40" y="872" width="4" height="104" rx="2" fill="#4ECDC4"/>
  <text x="60" y="894" font-size="13" font-weight="600" fill="#4ECDC4">横切 · 共享包层 packages/（编译期被 L2 / L3 / L3b 共同依赖）</text>
  <g font-size="11" fill="#C9C9D6">
    <rect x="60" y="904" width="156" height="40" rx="8" fill="#1B1B24" stroke="#2C2C3A"/>
    <text x="138" y="920" text-anchor="middle" font-size="12.5" fill="#FFF8F0">shared</text>
    <text x="138" y="935" text-anchor="middle">跨端配置收口 · 命名策略</text>
    <rect x="226" y="904" width="156" height="40" rx="8" fill="#1B1B24" stroke="#2C2C3A"/>
    <text x="304" y="920" text-anchor="middle" font-size="12.5" fill="#FFF8F0">types</text>
    <text x="304" y="935" text-anchor="middle">权限码 · 共享常量</text>
    <rect x="392" y="904" width="156" height="40" rx="8" fill="#1B1B24" stroke="#2C2C3A"/>
    <text x="470" y="920" text-anchor="middle" font-size="12.5" fill="#FFF8F0">ui</text>
    <text x="470" y="935" text-anchor="middle">设计 token · AntD 主题</text>
    <rect x="558" y="904" width="156" height="40" rx="8" fill="#1B1B24" stroke="#2C2C3A"/>
    <text x="636" y="920" text-anchor="middle" font-size="12.5" fill="#FFF8F0">shell-loader</text>
    <text x="636" y="935" text-anchor="middle">自研微前端加载器</text>
    <rect x="724" y="904" width="156" height="40" rx="8" fill="#1B1B24" stroke="#2C2C3A"/>
    <text x="802" y="920" text-anchor="middle" font-size="12.5" fill="#FFF8F0">agent-core</text>
    <text x="802" y="935" text-anchor="middle">ReAct 引擎 · 记忆压缩</text>
    <rect x="890" y="904" width="156" height="40" rx="8" fill="#1B1B24" stroke="#2C2C3A"/>
    <text x="968" y="920" text-anchor="middle" font-size="12.5" fill="#FFF8F0">kedou-agent</text>
    <text x="968" y="935" text-anchor="middle">Agent CLI</text>
    <rect x="1056" y="904" width="156" height="40" rx="8" fill="#1B1B24" stroke="#2C2C3A"/>
    <text x="1134" y="920" text-anchor="middle" font-size="12.5" fill="#FFF8F0">mcp-core</text>
    <text x="1134" y="935" text-anchor="middle">MCP 注册 · HTTP 适配器</text>
    <rect x="1222" y="904" width="156" height="40" rx="8" fill="#1B1B24" stroke="#2C2C3A"/>
    <text x="1300" y="920" text-anchor="middle" font-size="12.5" fill="#FFF8F0">agent-message</text>
    <text x="1300" y="935" text-anchor="middle">消息 blocks 解析</text>
  </g>

  <!-- 横切虚线回指 -->
  <path d="M24,940 L24,240" stroke="#4ECDC4" stroke-width="1.2" stroke-dasharray="5 4" fill="none" opacity="0.55"/>
  <path d="M24,240 L36,240" stroke="#4ECDC4" stroke-width="1.2" opacity="0.55" marker-end="url(#arrTeal)"/>
  <path d="M24,420 L36,420" stroke="#4ECDC4" stroke-width="1.2" opacity="0.55" marker-end="url(#arrTeal)"/>
  <path d="M24,480 L36,480" stroke="#4ECDC4" stroke-width="1.2" opacity="0.55" marker-end="url(#arrTeal)"/>

  <text x="40" y="1008" font-size="11.5" fill="#6F6F80">调用约定：所有业务请求经 Gateway（:6000）统一入口 → /api/* 反代；服务间调用走 JWT + 服务密钥（如 MCP_GATEWAY_SERVICE_KEY）；</text>
  <text x="40" y="1026" font-size="11.5" fill="#6F6F80">发布与配置面由 deploy-console 旁路承载，不参与业务请求链路；AI 客户端经 mcp-gateway 反向调用业务接口（声明式 HTTP → MCP）。</text>
  <text x="40" y="1044" font-size="11.5" fill="#4ECDC4">配置中心是「服务进程配置」的权威源：密钥/凭据加密落库 → 部署重启前下发为 &lt;svc&gt;/.env.generated（dotenv 优先级高于 .env）→ 服务进程；GitHub Token 等流水线凭据注入脚本 env，不落服务进程。</text>
</svg>
