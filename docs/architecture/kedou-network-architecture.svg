  <text x="700" y="878" text-anchor="middle" font-size="12" fill="#b45309">⚠ deploy-console 持有 dev / prod / gateway 三台机器的 SSH 权限，目前经 dev.kedouai.com/console/ 公网可达，建议 gateway 层加 IP 白名单</text>
