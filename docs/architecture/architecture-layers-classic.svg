    <rect x="536" y="312" width="326" height="40" rx="3" fill="#FFFFFF" stroke="#A9C99A"/>
    <text x="552" y="330" font-size="12.5" font-weight="600" fill="#1F2937">user-service <tspan fill="#3F6B2E">:6002</tspan></text>
