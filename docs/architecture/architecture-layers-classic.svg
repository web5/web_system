    <rect x="706" y="592" width="243" height="44" rx="3" fill="#FFFFFF" stroke="#C4B0DF"/>
    <text x="722" y="611" font-size="12.5" font-weight="600" fill="#1F2937">迁移脚本 apply-migrations.sh</text>
    <text x="722" y="627" fill="#5B6673">按 -- @database &lt;db&gt; 注解路由目标库</text>
    <rect x="961" y="592" width="243" height="44" rx="3" fill="#FFFFFF" stroke="#C4B0DF"/>
    <text x="977" y="611" font-size="12.5" font-weight="600" fill="#1F2937">Repository / 事务</text>
    <text x="977" y="627" fill="#5B6673">取号用事务内悲观锁（非 LAST_INSERT_ID）</text>
  </g>
