  <text x="196" y="912" font-size="12.5" font-weight="600" fill="#1F2937">deploy-console :6200 · 流水线四步（可自由定制）：拉取代码 → 构建 → 发布确认（审批挂起）→ 发布（按环境动作序列：write-version → sync → restart → verify）</text>
  <text x="196" y="930" font-size="11" fill="#5B6673">配置中心 config_items（AES-256-GCM 加密 · 掩码回显 · 审计 · 按环境/模块分层）→ 部署前下发 &lt;svc&gt;/.env.generated（覆盖 .env）；GitHub Token 等流水线凭据仅注入脚本 env</text>
