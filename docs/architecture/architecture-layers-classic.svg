  <rect x="40" y="188" width="140" height="88" fill="#1F6B80"/>
  <text x="110" y="224" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">L2</text>
  <text x="110" y="246" font-size="13" fill="#CFE9F0" text-anchor="middle">网关接入层</text>
