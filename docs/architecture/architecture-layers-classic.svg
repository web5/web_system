    <text x="212" y="224" font-size="12.5" font-weight="600" fill="#1F2937">Nginx（GATEWAY 机）</text>
    <text x="212" y="242" fill="#5B6673">SSL 终止 · 域名路由 · 反向代理</text>
    <rect x="472" y="204" width="716" height="52" rx="3" fill="#FFFFFF" stroke="#9CC5D4"/>
    <text x="488" y="224" font-size="12.5" font-weight="600" fill="#1F2937">Gateway :6000（统一入口）</text>
