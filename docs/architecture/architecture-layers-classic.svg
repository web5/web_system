    <text x="552" y="391" fill="#5B6673">RAG：分块 · 向量 · 检索</text>
    <rect x="876" y="358" width="326" height="40" rx="3" fill="#FFFFFF" stroke="#A9C99A"/>
    <text x="892" y="376" font-size="12.5" font-weight="600" fill="#1F2937">content-hub <tspan fill="#3F6B2E">:6007</tspan></text>
