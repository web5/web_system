    <text x="212" y="437" fill="#5B6673">配置 · 字典 · 操作日志</text>
    <rect x="536" y="404" width="326" height="40" rx="3" fill="#FFFFFF" stroke="#A9C99A"/>
    <text x="552" y="422" font-size="12.5" font-weight="600" fill="#1F2937">todo-service <tspan fill="#3F6B2E">:6005</tspan></text>
    <text x="552" y="437" fill="#5B6673">待办任务</text>
    <rect x="876" y="404" width="326" height="40" rx="3" fill="#FFFFFF" stroke="#A9C99A"/>
    <text x="892" y="422" font-size="12.5" font-weight="600" fill="#1F2937">upload-service <tspan fill="#3F6B2E">:6008</tspan></text>
    <text x="892" y="437" fill="#5B6673">统一文件上传</text>
  </g>
