  <line x1="40" y1="958" x2="1400" y2="958" stroke="#D5DCE4"/>
  <text x="40" y="978" font-size="11.5" fill="#5B6673">调用方向：表现层 → 网关接入层 → 应用服务层 → 领域能力层 → 数据访问层 → 数据存储层；AI 客户端经 mcp-gateway（:6006）旁路进入，最终仍回灌 Gateway 反代业务接口。</text>
  <text x="40" y="994" font-size="11.5" fill="#5B6673">运维平台（deploy-console :6200）是旁路：不参与业务请求链路，但通过配置中心向服务进程下发配置（.env.generated），并向流水线注入脚本变量；端口为 dev/prod 口径（本机 auth 为 6101）。</text>
