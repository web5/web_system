    <text x="977" y="134" fill="#5B6673">WorkBuddy / Claude · /mcp</text>
  </g>
  <path d="M650,170 L650,186" stroke="#5B6673" stroke-width="1.4" marker-end="url(#cArr)"/>

  <!-- ===== L2 网关接入层 ===== -->
