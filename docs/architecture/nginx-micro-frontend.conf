# 微前端平台 nginx 配置片段
# 部署到 dev 服务器 /etc/nginx/conf.d/web_system.conf（或 include 进主配置）
#
# 职责分工：
# - /static/externals/  → 公共依赖（vue/vue-router/pinia/antd/axios/dayjs），nginx 直出
# - /static/modules/    → 微前端模块 js/css（按 module/version 目录），nginx 直出，不经过 gateway
# - /                   → 基座 index.html + /api/* + /console/*，转发 gateway:6000

# ===== 公共依赖 externals（强缓存，文件名带版本） =====
location /static/externals/ {
  alias /data/web_system/servers/gateway/public/static/externals/;
  add_header Cache-Control "public, max-age=31536000, immutable";
  add_header Access-Control-Allow-Origin "*";
}

# ===== 微前端模块 js/css（nginx 直出，不经过 gateway） =====
location /static/modules/ {
  alias /data/web_system/static/modules/;

  # index.js 走 etag（版本切换后要能拿到新的），不强缓存
  location ~* \.js$ {
    add_header Cache-Control "no-cache, must-revalidate";
    etag on;
    add_header Access-Control-Allow-Origin "*";
  }

  # css / 图片 / 字体 强缓存 1 年（带 hash 的文件名不变即永久有效）
  location ~* \.(css|png|jpg|jpeg|gif|svg|woff2?|ttf|eot)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Access-Control-Allow-Origin "*";
  }
}

# ===== 基座 index.html + API + deploy-console → gateway:6000 =====
location / {
  proxy_pass http://127.0.0.1:6000;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # SSE 流式响应支持（deploy-console 部署进度推送）
  proxy_buffering off;
  proxy_cache off;
  proxy_read_timeout 300s;

  # WebSocket 升级（未来用）
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
}

# ===== gzip 压缩（js/css/json） =====
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 6;
gzip_types text/plain text/css application/javascript application/json text/xml application/xml image/svg+xml;
gzip_proxied any;
