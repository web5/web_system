<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/console/favicon.svg" />
    <title>Beehive · 智能研发平台</title>
    <!-- 圆角偏好：首屏渲染前写入根属性，避免「先柔和后跳变」（AC6）
         口径：specs/radius-style-dual/page-spec.md §4.4；与 composables/useAppearance 共用 theme-store -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('theme-store');
          var s = raw ? (JSON.parse(raw) || {}) : {};
          if (s.radiusStyle === 'crisp' || s.radiusStyle === 'sharp') {
            document.documentElement.setAttribute('data-radius', s.radiusStyle);
          }
        } catch (e) {
          /* 忽略：默认柔和 */
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
