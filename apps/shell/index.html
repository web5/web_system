<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>科豆AI</title>
  <!-- 外部依赖从公开 CDN 加载（挂全局），shell 不再打包这些库（减小包体积）。
       顺序：vue → vue-router → pinia → axios → dayjs → antd（antd 依赖 vue）。
       版本与本地 pnpm-lock 对齐（vite.config 的 viteExternalsPlugin 映射同名全局）。 -->
  <script src="https://cdn.staticfile.org/vue/3.5.31/vue.global.prod.js"></script>
  <script src="https://cdn.staticfile.org/vue-router/4.6.4/vue-router.global.prod.js"></script>
  <script src="https://cdn.staticfile.org/pinia/2.3.1/pinia.iife.prod.js"></script>
  <script src="https://cdn.staticfile.org/axios/1.13.6/axios.min.js"></script>
  <script src="https://cdn.staticfile.org/dayjs/1.11.21/dayjs.min.js"></script>
  <script src="https://cdn.staticfile.org/ant-design-vue/4.2.6/antd.min.js"></script>
  <script>
    window.__SHARED__ = window.__SHARED__ || {};
    window.__MODULES__ = window.__MODULES__ || {};
    // gateway 注入：window.__MODULES_MANIFEST__ = { env, modules: [...], canary }
    // 若 gateway 未注入（本地 dev 直跑），用空清单占位
    window.__MODULES_MANIFEST__ = window.__MODULES_MANIFEST__ || { env: 'dev', modules: [], canary: null };
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
