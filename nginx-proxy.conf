# Nginx 配置 - 42.194.200.69 (网关服务器)
# 转发 dev.kedouai.com / portal.kedouai.com 到后端 175.27.189.123:3000
# 优化：启用 HTTP/2 + gzip + 静态资源强缓存

# ========== Gzip 全局配置 ==========
gzip on;
gzip_comp_level 6;
gzip_min_length 256;
gzip_proxied any;
gzip_vary on;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    image/svg+xml
    font/woff
    font/woff2
    application/vnd.ms-fontobject;

# 优先使用 Vite 预压缩的 .gz 文件（避免实时压缩）
gzip_static on;

# ========== HTTP 重定向到 HTTPS ==========
server {
    listen 80;
    server_name dev.kedouai.com portal.kedouai.com;
    return 301 https://$host$request_uri;
}

# ========== HTTPS 主配置 - Portal (dev.kedouai.com) ==========
server {
    listen 443 ssl http2;
    server_name dev.kedouai.com;

    # SSL 证书（Let's Encrypt）
    ssl_certificate /etc/nginx/ssl/dev.kedouai.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/dev.kedouai.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # 访问日志
    access_log /var/log/nginx/dev.kedouai.com.access.log;
    error_log /var/log/nginx/dev.kedouai.com.error.log;

    location / {
        proxy_pass http://175.27.189.123:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 缓冲优化
        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_buffer_size 32k;
    }

    # 静态资源代理（由 Gateway 托管）— 强缓存
    location /assets/ {
        proxy_pass http://175.27.189.123:3000;
        proxy_set_header Host $host;
        # Vite 打包的 /assets/* 都带 hash，强缓存 1 年
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        expires 365d;
    }

    # favicon
    location = /favicon.svg {
        proxy_pass http://175.27.189.123:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=2592000" always;
        expires 30d;
    }
}

# ========== Portal (旧域名 portal.kedouai.com) ==========
server {
    listen 443 ssl http2;
    server_name portal.kedouai.com;

    ssl_certificate /etc/nginx/ssl/portal.kedouai.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/portal.kedouai.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        proxy_pass http://175.27.189.123:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
