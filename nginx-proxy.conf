# ============================================================================
# Nginx 配置 - SSL 终止层（入口网关服务器 42.194.200.69）
# ============================================================================
# 角色：HTTPS 证书终止 + 反向代理。所有域名流量先到这里，再转发到后端。
#
# ── 部署位置 ────────────────────────────────────────────────────────────────
#   服务器：42.194.200.69（腾讯云，SSL 层）
#   配置文件路径：/etc/nginx/conf.d/dev.kedouai.com.conf
#   （本文件是仓库模板，部署时按域名拆分到 conf.d/ 下；实际线上还有
#    admin.conf / api.conf / portal.conf / default.conf，其中 default.conf
#    是历史大杂烩，已清理掉重复的 dev.kedouai.com 块）
#
# ── SSL 证书 ────────────────────────────────────────────────────────────────
#   dev.kedouai.com 证书（已配置，无需再申请）：
#     证书文件：/etc/nginx/ssl/dev.kedouai.com/fullchain.pem   （含完整链）
#     私钥文件：/etc/nginx/ssl/dev.kedouai.com/privkey.pem
#     颁发机构：DNSPod, Inc.（腾讯云免费 DV 证书，DigiCert Global Root G2 根链）
#     有效期：  2026-06-13 ~ 2026-12-28（到期前需在 DNSPod 控制台续期并替换）
#   portal.kedouai.com 证书：/etc/nginx/ssl/portal.kedouai.com/
#   验证命令：
#     openssl x509 -in /etc/nginx/ssl/dev.kedouai.com/fullchain.pem \
#       -noout -subject -dates -ext subjectAltName
#
# ── 端口映射（2026-08 起后端统一 600x）────────────────────────────────────
#   /mcp        → 175.27.189.123:6006  （mcp-gateway，MCP 协议端点，工具网关）
#   其余 /      → 175.27.189.123:6000  （gateway，页面托管 + /api 业务入口）
#   /api/mcp/*  → 走 6000 gateway 代理 → mcp-gateway 6006（管理接口）
#
# ── 路由分工（重要）────────────────────────────────────────────────────────
#   /mcp       直连 mcp-gateway（6006），不走 gateway 的 /api 代理
#   /mcp-admin/ 静态页面由 gateway（6000）ServeStaticModule 托管
#   /api/mcp/*  管理接口走 gateway（6000）统一代理转发到 mcp-gateway（6006）
#
# ── 其他 ───────────────────────────────────────────────────────────────────
#   优化：HTTP/2 + gzip + 静态资源强缓存；/mcp 需 SSE（关闭缓冲）

# ========== Gzip 全局配置 ==========
gzip on;
gzip_comp_level 6;
gzip_min_length 256;
gzip_proxied any;
gzip_vary on;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    image/svg+xml
    font/woff
    font/woff2
    application/vnd.ms-fontobject;

# 优先使用 Vite 预压缩的 .gz 文件（避免实时压缩）
gzip_static on;

# ========== HTTP 重定向到 HTTPS ==========
server {
    listen 80;
    server_name dev.kedouai.com portal.kedouai.com;
    return 301 https://$host$request_uri;
}

# ========== HTTPS 主配置 - Portal (dev.kedouai.com) ==========
server {
    listen 443 ssl http2;
    server_name dev.kedouai.com;

    # SSL 证书（Let's Encrypt）
    ssl_certificate /etc/nginx/ssl/dev.kedouai.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/dev.kedouai.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # 访问日志
    access_log /var/log/nginx/dev.kedouai.com.access.log;
    error_log /var/log/nginx/dev.kedouai.com.error.log;

    # MCP 协议端点（streamable-http，需 SSE）→ 直连 mcp-gateway
    # mcp-gateway 本身是 MCP 工具网关，不走 gateway 的 /api 代理
    # 必须用正则：精确匹配 /mcp 和子路径 /mcp/:module，但不误伤 /mcp-admin/（页面应走 6000）
    location ~ ^/mcp(/.*)?$ {
        proxy_pass http://175.27.189.123:6006;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
    }

    location / {
        proxy_pass http://175.27.189.123:6000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 缓冲优化
        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_buffer_size 32k;
    }

    # 静态资源代理（由 Gateway 托管）— 强缓存
    location /assets/ {
        proxy_pass http://175.27.189.123:6000;
        proxy_set_header Host $host;
        # Vite 打包的 /assets/* 都带 hash，强缓存 1 年
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        expires 365d;
    }

    # favicon
    location = /favicon.svg {
        proxy_pass http://175.27.189.123:6000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=2592000" always;
        expires 30d;
    }
}

# ========== Portal (旧域名 portal.kedouai.com) ==========
server {
    listen 443 ssl http2;
    server_name portal.kedouai.com;

    ssl_certificate /etc/nginx/ssl/portal.kedouai.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/portal.kedouai.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        proxy_pass http://175.27.189.123:6000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
