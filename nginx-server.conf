# Nginx 配置 - 106.52.176.246 服务器
# Web System 生产环境配置
# 注意：此服务器位于 SSL 代理（42.194.200.69）之后，headers 作为纵深防御

# Gzip 压缩 — 大幅减小 JS/CSS 体积
gzip on;
gzip_comp_level 6;
gzip_min_length 256;
gzip_proxied any;
gzip_vary on;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    image/svg+xml
    font/woff
    font/woff2
    application/vnd.ms-fontobject;

# 浏览器缓存 — 静态资源强缓存
map $sent_http_content_type $expires {
    default                    off;
    application/javascript     365d;
    text/css                   365d;
    image/png                  365d;
    image/jpeg                 365d;
    image/gif                  365d;
    image/svg+xml              365d;
    font/woff                  365d;
    font/woff2                 365d;
}

# 少儿教育门户
server {
    listen 80;
    server_name portal.kedouai.com;

    root /home/ubuntu/web_system/portal/dist;
    index index.html;
    expires $expires;

    # 安全响应头（纵深防御，上游 SSL 代理层也设置了）
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 代理
    location /api {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE（流式对话）支持
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
    }

    # SSE 专用配置（/api/ai/chat/stream 路径）
    location ~ ^/api/ai/chat/stream$ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
        chunked_transfer_encoding on;
    }

    access_log /var/log/nginx/portal.access.log;
    error_log /var/log/nginx/portal.error.log;
}

