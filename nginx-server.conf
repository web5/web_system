# ============================================================================
# Nginx 配置 - 应用层服务器（位于 SSL 层 42.194.200.69 之后）
# ============================================================================
# 角色：接收 SSL 层转发来的 HTTP 请求，托管前端静态文件 + /api 代理到 gateway。
#
# ── 部署位置 ────────────────────────────────────────────────────────────────
#   目标：106.52.176.246（PROD 生产环境）
#   配置文件路径：/etc/nginx/sites-enabled/web-system（或 conf.d/ 下）
#
#   ⚠️ 注意 DEV 环境差异：
#     DEV 应用层 175.27.189.123 上 nginx 实际【未运行】，80 端口由 caddy
#     监听（Caddyfile: `:80 { redir :3000 }`）。DEV 的域名流量走
#     SSL 层 → gateway(6000) 直连，不经过本应用层 nginx。
#     本文件主要作为 PROD 的应用层配置模板。
#
# ── 证书说明 ────────────────────────────────────────────────────────────────
#   应用层（本文件）不配置 SSL 证书，证书在 SSL 层 42.194.200.69 终止。
#   SSL 层证书位置与来源见 nginx-proxy.conf 头部说明。
#   本层的 add_header 安全头属于「纵深防御」（上游 SSL 层也设置了）。
#
# ── 端口映射（2026-08 起后端统一 600x）────────────────────────────────────
#   /api          → localhost:6000  （gateway，业务 API 统一入口）
#   /mcp          → localhost:6006  （mcp-gateway，MCP 协议端点）
#   /mcp-admin/   → localhost:6000  （gateway ServeStaticModule 托管）
#   其余静态路径  → 本地 dist 目录（try_files SPA 回退）
#
# ── 前端托管（本层 nginx 直接托管 dist，与 gateway serve-static 二选一）────
#   历史方案：nginx 直接 root 到各 app 的 dist 目录（portal/admin-web）
#   新方案：mcp-admin 走 gateway ServeStaticModule（public/mcp-admin/），
#           本文件 /mcp-admin/ 也 proxy 到 gateway 6000，与 admin-web 对齐

# Gzip 压缩 — 大幅减小 JS/CSS 体积
gzip on;
gzip_comp_level 6;
gzip_min_length 256;
gzip_proxied any;
gzip_vary on;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    image/svg+xml
    font/woff
    font/woff2
    application/vnd.ms-fontobject;

# 浏览器缓存 — 静态资源强缓存
map $sent_http_content_type $expires {
    default                    off;
    application/javascript     365d;
    text/css                   365d;
    image/png                  365d;
    image/jpeg                 365d;
    image/gif                  365d;
    image/svg+xml              365d;
    font/woff                  365d;
    font/woff2                 365d;
}

# 少儿教育门户
server {
    listen 80;
    server_name portal.kedouai.com;

    root /home/ubuntu/web_system/portal/dist;
    index index.html;
    expires $expires;

    # 安全响应头（纵深防御，上游 SSL 代理层也设置了）
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 代理
    location /api {
        proxy_pass http://localhost:6000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE（流式对话）支持
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
    }

    # SSE 专用配置（/api/ai/chat/stream 路径）
    location ~ ^/api/ai/chat/stream$ {
        proxy_pass http://localhost:6000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
        chunked_transfer_encoding on;
    }

    access_log /var/log/nginx/portal.access.log;
    error_log /var/log/nginx/portal.error.log;
}

# 管理后台
server {
    listen 80;
    server_name admin.kedouai.com dev.kedouai.com;

    root /home/ubuntu/web_system/admin-web/dist;
    index index.html;
    expires $expires;

    # 安全响应头（纵深防御，上游 SSL 代理层也设置了）
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 代理
    location /api {
        proxy_pass http://localhost:6000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE（流式对话）支持
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
    }

    # SSE 专用配置（/api/ai/chat/stream 路径）
    location ~ ^/api/ai/chat/stream$ {
        proxy_pass http://localhost:6000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
        chunked_transfer_encoding on;
    }

    # MCP 管理界面（静态 SPA，走 gateway serve-static 托管，和 admin-web 一致）
    location /mcp-admin/ {
        proxy_pass http://localhost:6000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # MCP 协议端点（streamable-http，需 SSE 支持）→ mcp-gateway
    # 必须用正则：精确匹配 /mcp 和子路径 /mcp/:module，但不误伤 /mcp-admin/（页面应走 6000）
    location ~ ^/mcp(/.*)?$ {
        proxy_pass http://localhost:6006;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
    }

    access_log /var/log/nginx/admin.access.log;
    error_log /var/log/nginx/admin.error.log;
}

