# ============================================================
# gates.yaml — 红线门禁的单一真相源（S1 语义抽取产物）
#
# 设计：~/AiWorkspace/30-任务产物/2026-10-30-门禁脚本架构重估/门禁脚本重构方案.md
# 台账：#8251（S0 黄金用例集已完成，本文件是 S1）
#
# 为什么要有这个文件
#   同一道门的定义此前散在 6 处手抄：bash 函数体 / 豁免白名单 / 采集口径 /
#   gates 文档表格 / PR 模板 / 变异测试 case。6 份手抄 = 6 个漂移面。
#   加一道门要同步 13 个文件（R17 反查实证）。本文件把「门的语义」收成一份。
#
# 🔴 现状：status=enforcing —— 执行权威是 gate.ts，本文件是**唯一判据来源**
#   2026-11-11 切主（S3）：legacy bash 退场，不再演进。
#   2026-11-11 同日 S5：legacy bash 已**删除**（scan-rules.sh / gate-shared.sh /
#   check-commit-msg.sh / mutation-test.sh / cases/shadow.sh）。现在只有一份实现。
#
# 切主前的路径：S1 声明化（declared，bash 为权威）→ S2 引擎 + 影子比对（12 天 / ~100 次 CI）
#   → S3 本文件转 enforcing，三个执行入口（pre-commit / CI / 采集）换成 gate.ts。
#
# 改判据的正确顺序（切主后）
#   1) 改本文件
#   2) 改/加黄金用例（scripts/redline/cases/），bash scripts/redline/cases/run.sh 全绿
#   3) node scripts/redline/gates-lint.ts 必须绿（含「防假切主」接线检查）
#   ⚠️ 不需要再同步 bash —— 它已删除（S5）。也没有影子比对可看了。
# ============================================================

version: 1
schema: gate-spec/v1
status: enforcing
updated: 2026-11-11
owner: 研发部

meta:
  authority: gate.ts
  authority_files: ["scripts/redline/gates.yaml", "scripts/redline/gate.ts"]
  invariant: 本文件是唯一判据来源，gate.ts 是唯一执行者（S5 起 legacy bash 已删除，不存在第二实现）
  legacy: []
  legacy_note: S5（2026-11-11）已删除 scan-rules.sh / gate-shared.sh / check-commit-msg.sh / mutation-test.sh / cases/shadow.sh；历史实现见 git 历史与 docs/development/gates/00-单一真相源.md
  history_note: 编号是长出来的，不是设计的 —— 无 R7，R6 的实现不在本仓库（scripts/ci/changed-packages.sh），R3/R4 曾一号两义；本文件用 sub 把一号两义拆开

# ---------------- 约定 ----------------
conventions:
  levels:
    error: 阻断，进程退出码 1
    warning: 提示；--strict 下计入退出码
    notice: 只做计数提示，从不阻断
  stages: [line, file, range, commit, repo, delegated, external]
  # git name-status 状态字母
  status_letters: [A, M, D, R]
  # 凭证 trailer 的通用解析口径（与 bash 的 `grep -E '^Name:[[:space:]]*[^[:space:]]+'` 一致）
  trailer:
    anchor: line_start
    case_sensitive: true
    take: first_match
    separator: ":"
  # merge commit 一律不进 commit 级判定（合并语义不等于改动）
  skip_merges: true
  # 🔴 路径匹配的两个字段，语义不同，不要混用：
  #   match_path   = glob（`*` **跨 `/`**，与 bash `case` 同义，不是 gitignore/minimatch 语义）
  #   match_re     = 正则（POSIX ERE → JS，不认识的字符类直接报错，不静默不匹配）
  # 2026-11-11 切主后发现：R2.secret-file 的两条路径判据在 bash 里是 `[[ =~ ]]` 正则，
  #   但 YAML 写成 match_path 后引擎按 glob 处理 → `(^|/)` 变成字面量 → **.env 与证书文件
  #   完全不报**。R2.secret-file 恰好零用例，影子比对因此一直是绿的（两个引擎一样地错）。
  path_match:
    glob: match_path
    regex: match_re

# ---------------- 豁免机制（横跨 8 道门） ----------------
# 语义原先来自 gate-shared.sh §1（S5 已删除）；R9b 在 bash 里自己内联过一份同口径循环，那也是历史包袱
exemption:
  trailer: Micro-exempt
  formats:
    scoped: "<门号>[,<门号>…]: <理由>"
    legacy: "<理由>"
  # 门号后必须紧跟冒号才是分类豁免。理由正文以门号开头（实证 db526889 的 "R9b "）
  # 若按「首个 token 是门号」判，会把存量一票否决误判成分类豁免 —— 行为突变
  gate_prefix_rule: 门号列表后必须紧跟冒号，否则按旧格式解析
  legacy_semantics: 一票否决，豁免所有 eligible 门（向后兼容，不得取消）
  eligible_gates: [R9b, R10, R11, R13, R14, R15, R17, R18, R23]
  # R19 不接受豁免：空提交没有任何改动面，豁免只对有改动面的门有意义
  ineligible_gates: [R19, R20, R21]
  not_applicable_note: 行级/文件级门（R1~R8）根本没有豁免机制 —— 它们的例外是路径白名单（exclude_paths）与作用域本身，写 Micro-exempt 对它们完全无效。R9 的例外是同行 passport，也不是 Micro-exempt。判断「这道门能不能豁免」只看 eligible_gates，不看它是不是 warning 级
  quality:
    min_reason_chars: 10
    empty_values: ["yes", "no", "true", "false", "ok", "n/a", "none", "tbd", "wip", "skip", "是", "否", "无", "不需要", "不用"]
    batch:
      min_ui_files: 5
      require_file_count: true
      require_rootcause_keyword: true
      rootcause_keywords: ["同一", "统一", "批量", "共性", "同样", "同一个", "同批", "共同", "根因"]
    # 生效日：2026-11-01 00:00:00 +0800。此前的 commit 不追溯翻红，只报 R20 提醒
    # 实证：6796d16b（2026-10-23，11 个 UI 文件）若追溯会从 warning 直接变 error
    strict_from: 1793462400
  env_overrides:
    EXEMPT_MIN_REASON_LEN: min_reason_chars
    EXEMPT_BATCH_MIN_FILES: batch.min_ui_files
    EXEMPT_QUALITY_STRICT_FROM: strict_from

# ---------------- commit-msg 阶段（commit 还没生成） ----------------
# 这一阶段只有 message 与 staged 文件可用，没有 commit 树。所以只有「判据只读这两样」的门
# 能在这里跑：R10（Proto 凭证：sha 存在 + 是 HEAD 祖先 + 该 commit 改过原型/规格）
# 与 R11 的 UI 分支（只要 Design: pass）。
# 其余 commit 门天然需要 commit 才成立 —— R13/R14/R15/R17/R18/R23 的
# path_exists_in_commit_tree、R19 的空提交检测 —— 由 pre-commit 的 cached 模式与 CI 兜底。
#
# 🔴 为什么清单在 YAML 而不是写死在 gate.ts：
#   「哪些门能在 commit 前判」本身就是一条判据。写死它，等于又把它藏回代码里。
#   放这里之后，加门的人必须先回答这个问题；gate.ts 对清单里未接线/不存在的门
#   **报错退出（exit 2）**，不静默跳过 —— 声明了却没接线是最不该安静的那类事。
#
# 🔴 R10 在这里是 warning，本地不阻断 —— 这是 2026-11-11 拍板结论，不要「修回去」：
#   旧 check-commit-msg.sh 对缺 Proto 硬编码 exit 1，比 gates.yaml 声明的 warning 更严，
#   属实现比自己的声明严，S5 删 bash 后统一按声明走（R11 仍 error 级拦截，
#   实测缺 Proto 的 UI commit 通常同时缺 Design，被 R11 兜住）。
#   若将来判定要升回阻断：改 R10 的 level 为 error，并同步改
#   test-gate-hardening.sh 的 L2 断言（现断言「点名 [R10]」，非「exit 非 0」）。
local_commit_msg:
  gates: [R10, R11]

# ---------------- 可复用触发面 ----------------
# 这些 glob 此前在 scan-rules.sh 与 gate-shared.sh 各写一份（is_ui_file / exempt_is_ui_file）；
# S5 删掉两份 bash 后，这里是唯一定义
# lint 会逐个比对，防止两份漂移
scopes:
  code_file:
    desc: 可执行源码（行级规则的作用域）
    include: ["*.ts", "*.tsx", "*.vue", "*.js", "*.jsx", "*.mjs", "*.cjs"]
  ts_file:
    desc: TypeScript 源码（R4.any 只卡这些）
    include: ["*.ts", "*.tsx", "*.vue"]
  ui_file:
    desc: UI 源码。不能写成 packages/ui/* —— 会把 package.json / tsconfig 也算成 UI，改个 lint 脚本就要求设计评审（2026-10-22 实测误报）
    include: ["*.wxml", "*.wxss", "*.vue", "apps/*/pages/*", "apps/*/components/*", "apps/*/src/*.vue", "packages/ui/src/*", "app.json", "apps/*/app.json"]
  contract_file:
    desc: 契约与数据变更面。收窄原则宁窄勿宽 —— 把整个 packages/agent-core 纳入会让内部实现改动也判契约变更，摩擦过大必被关掉
    include: ["archive/migrations/*", "packages/types/*", "packages/agent-core/src/interfaces/*", "servers/mcp-gateway/src/*/tools/*", "servers/*/src/*/*.controller.ts", "servers/*/src/*/*.controller.js"]
  release_file:
    desc: 发布与环境面。测试通过不等于能上线
    include: ["ecosystem.config.cjs", "ecosystem.config.js", "servers/*/.env", "servers/*/.env.*", "scripts/.env.deploy", "scripts/.env.deploy.*", "scripts/pipeline/*", "scripts/publish-*.sh", "scripts/deploy-*.sh", "scripts/bootstrap.sh", "servers/deploy-console/src/pipeline/*", ".github/workflows/*"]
  test_path:
    desc: 测试/夹具路径（多条规则在此豁免）
    include: ["*/test/*", "*/tests/*", "*/__tests__/*", "*/spec/*", "*.spec.*", "*.test.*", "*/fixtures/*", "*/mocks/*", "*/mock/*"]
  test_surface:
    desc: 测试范围面（R23）。命中即「一处改动可能波及全体功能」——须交代跑全量还是抽样。与 contract_file 的区别：contract_file 管「要不要契约评审」，本面管「测试要铺多大」，面更宽（含共享 UI / 服务入口 / 测试与构建基建 / CI）；两门可同时命中，互不替代
    include: ["packages/types/*", "packages/shared/*", "packages/ui/src/*", "packages/agent-core/src/interfaces/*", "servers/*/src/main.ts", "apps/*/src/main.ts", "apps/*/src/layouts/*", "archive/migrations/*", "jest.config.*", "*/jest.config.*", "*/*/jest.config.*", "tsconfig*.json", "*/tsconfig*.json", "*/*/tsconfig*.json", "scripts/ci/*", ".github/workflows/*"]
  passport:
    desc: 通行证（原型/规格书）。除下列 glob 外还认 is_spec_doc —— specs/ 或 docs/ui/page-specs/ 下、文件名或目录名含 page-spec / prototype / 原型
    include: ["*/prototype/*", "docs/ui/prototypes/*", "*/page-spec*.md"]
    binding: partial

# ============================================================
# 门清单
# ============================================================
gates:

  # ---------------- 行级（batch 3，可能移交 ESLint） ----------------
  - id: R1
    sub: null
    title: 调试残留
    level: error
    stage: line
    batch: 3
    trigger:
      scope: code_file
      skip_comment_line: true
      exclude_paths: ["scripts/*.mjs", "scripts/*.cjs", "apps/*/scripts/*.js", "apps/*/scripts/*.mjs", "apps/*/scripts/*.cjs", "archive/migrations/*.mjs", "archive/migrations/*.cjs", ".codebuddy/skills/*/scripts/*.js", ".codebuddy/skills/*/scripts/*.mjs", ".codebuddy/skills/*/scripts/*.cjs", ".codebuddy/agent-kit/skills/*/scripts/*.js", ".codebuddy/agent-kit/skills/*/scripts/*.mjs", ".codebuddy/agent-kit/skills/*/scripts/*.cjs"]
      exclude_reason: CLI 脚本的 stdout 是产品行为（进度/结论日志），不是调试残留。2026-09-29 / 2026-10-10 / 2026-10-21 / 2026-10-22 四次 CI 实测误报累积而成
      match: '(^|[^0-9A-Za-z_])(console\.(log|debug)\(|debugger([^0-9A-Za-z_]|$))'
    credential: null
    exempt: false
    message: 调试残留(console.log/debug/debugger)
    spec_ref: docs/development/质量门禁总纲.md
    owner: 研发部
    validity:
      status: unmeasured
    evidence: ["line-r1-console-log", "line-r1-script-whitelist", "line-r1-console-log-js"]

  - id: R2
    sub: R2.secret-file
    title: 敏感文件入库
    level: error
    stage: file
    batch: 3
    trigger:
      # 正则而非 glob：bash 原文是 `[[ "$file" =~ (^|/)[^/]*\.(pem|key|crt|cert)$ ]]`
      match_re: '(^|/)[^/]*\.(pem|key|crt|cert)$'
      alt:
        match_re: '(^|/)\.env($|\.)'
        exclude_paths: ["*.example*"]
    credential: null
    exempt: false
    message: 敏感文件入库
    hint: 证书/私钥文件不应提交；.env* 不应提交（.gitignore 已兜底）
    spec_ref: docs/development/质量门禁总纲.md
    owner: 研发部
    validity:
      status: unmeasured
    evidence: ["line-r2-secret-env", "line-r2-secret-pem", "line-r2-secret-example"]
    evidence_note: 2026-11-11 切主后补。此前零用例，而 gate.ts 把 match_path 当 glob 处理导致 .env/证书文件完全不报，影子比对因无用例覆盖而一直绿

  - id: R2
    sub: R2.cred
    title: 疑似硬编码凭据
    level: error
    stage: line
    batch: 3
    trigger:
      scope: code_file
      exclude_scopes: [test_path]
      exclude_paths: ["*.example.*", "*.md"]
      skip_comment_line: true
      case_insensitive: true
      match: '(password|passwd|secret|api[_-]?key|private[_-]?key|access[_-]?token)[^=;]*=[[:space:]]*["''][^"'']{8,}'
    credential: null
    exempt: false
    message: 疑似硬编码凭据
    spec_ref: docs/development/质量门禁总纲.md
    owner: 研发部
    validity:
      status: unmeasured
    evidence: ["line-r2-cred", "line-r2-cred-js"]

  - id: R3
    sub: R3.placeholder
    title: 占位残留（TODO/FIXME）
    level: error
    stage: line
    batch: 3
    trigger:
      scope: code_file
      skip_comment_line: false
      match: '(^|[^0-9A-Za-z_])(TODO|FIXME)([^0-9A-Za-z_]|$)'
    credential: null
    exempt: false
    message: 占位残留(TODO/FIXME)
    spec_ref: docs/development/质量门禁总纲.md
    owner: 研发部
    validity:
      status: unmeasured
    evidence: ["line-r3-todo", "line-r3-todo-js"]

  - id: R3
    sub: R3.weak
    title: 弱占位（TEMP/TBD/HACK/XXX）
    level: warning
    stage: line
    batch: 3
    trigger:
      scope: code_file
      skip_comment_line: false
      match: '(^|[^0-9A-Za-z_])(TEMP|TBD|HACK|XXX)([^0-9A-Za-z_]|$)'
    credential: null
    exempt: false
    message: 弱占位(TEMP/TBD/HACK/XXX)
    spec_ref: docs/development/质量门禁总纲.md
    owner: 研发部
    validity:
      status: unmeasured
    evidence: ["line-r3-weak", "line-r3-weak-js"]

  - id: R4
    sub: R4.ts-ignore
    title: TS 铁律违反（@ts-ignore / @ts-nocheck）
    level: error
    stage: line
    batch: 3
    trigger:
      scope: code_file
      skip_comment_line: false
      match: '@ts-(ignore|nocheck)'
    credential: null
    exempt: false
    message: TS 铁律违反(@ts-ignore/nocheck)
    spec_ref: docs/development/质量门禁总纲.md
    owner: 研发部
    validity:
      status: unmeasured
    evidence: ["line-r4-tsignore", "line-r4-tsignore-js"]

  - id: R4
    sub: R4.any
    title: 'TS 铁律违反（裸 : any）'
    level: error
    stage: line
    batch: 3
    trigger:
      scope: ts_file
      exclude_scopes: [test_path]
      exclude_paths: ["*.d.ts"]
      skip_comment_line: true
      match: ':[[:space:]]*any([^0-9A-Za-z_]|$)'
      history_note: '原写法 `[[:space:],);\]}]` 中 `\]` 在 POSIX 字符类里不是转义，整个类解析错，`const a: any = 1` / `any[]` / `x: any;` 全部漏报（存量 bug，已修）'
    credential: null
    exempt: false
    message: 'TS 铁律违反(: any)'
    spec_ref: docs/development/质量门禁总纲.md
    owner: 研发部
    validity:
      status: unmeasured
    evidence: ["line-r4-any", "line-r4-any-spec", "line-r4-any-js"]

  - id: R5
    sub: R5.main-cors
    title: main.ts 无参启用 CORS
    level: warning
    stage: file
    batch: 3
    trigger:
      match_path: 'servers/*/src/main.ts'
      file_contains: 'enableCors\(\s*\)'
    credential: null
    exempt: false
    message: CORS 无参启用
    hint: 应读取 config CORS_ORIGINS
    spec_ref: docs/development/质量门禁总纲.md
    owner: 研发部
    validity:
      status: unmeasured
    evidence: ["line-r5-cors-main"]

  - id: R5
    sub: R5.enable-cors
    title: CORS 无参启用（行级）
    level: warning
    stage: line
    batch: 3
    trigger:
      match_path: 'servers/*/src/*'
      skip_comment_line: true
      match: 'enableCors\([[:space:]]*\)'
    credential: null
    exempt: false
    message: CORS 疑似硬编码
    spec_ref: docs/development/质量门禁总纲.md
    owner: 研发部
    validity:
      status: unmeasured
    evidence: ["line-r5-cors-main"]

  - id: R5
    sub: R5.wildcard-origin
    title: 通配符 origin（行级）
    level: warning
    stage: line
    batch: 3
    trigger:
      match_path: 'servers/*/src/*'
      skip_comment_line: true
      match: 'origin[[:space:]]*:[[:space:]]*["'']\*["'']'
    credential: null
    exempt: false
    message: CORS 疑似硬编码
    spec_ref: docs/development/质量门禁总纲.md
    owner: 研发部
    validity:
      status: unmeasured
    evidence: ["line-r5-wildcard", "line-r5-wildcard-comment"]

  - id: R8
    sub: null
    title: main.ts 缺全局异常过滤器
    level: warning
    stage: file
    batch: 3
    trigger:
      match_path: 'servers/*/src/main.ts'
      file_contains: 'enableCors'
      file_not_contains: 'useGlobalFilters'
    credential: null
    exempt: false
    message: main.ts 缺全局异常过滤器
    hint: enableCors 存在但未注册 useGlobalFilters
    spec_ref: docs/development/质量门禁总纲.md
    owner: 研发部
    validity:
      status: unmeasured
    evidence: ["line-r5-cors-main"]

  # ---------------- 范围级（delegated：判定在 python 辅助脚本） ----------------
  - id: R9
    sub: null
    title: UI 结构变更须同行原型/规格
    level: warning
    stage: range
    batch: 2
    trigger:
      conditions:
        any_of:
          - status: [A]
            match_path: 'apps/*/pages/*'
          - match_path: 'apps/*/app.json'
            diff_contains: '"(pages|tabBar)"'
      pass_when:
        range_contains_scope: passport
    credential: null
    exempt: false
    exempt_note: R9 的例外是「同 diff 含 passport」，不是 Micro-exempt —— 写豁免对 R9 无效
    message: UI 结构变更未经原型/规格
    hint: 须同 diff 含 apps/*/prototype/** 或 specs/**/page-spec*.md（见 specs/kit-sop-enforcement/design.md）
    spec_ref: specs/kit-sop-enforcement/design.md
    owner: 研发部
    validity:
      status: unmeasured
    evidence: ["commit-r9-page", "commit-r9-passport"]

  - id: R9b
    sub: null
    title: 既有 UI 改动须同行原型/豁免
    level: warning
    stage: range
    batch: 1
    trigger:
      status: [M, D, R]
      scope: ui_file
      threshold:
        lines: 5
        or_diff_contains: '<(view|template|block)'
      note: 新增（A）由 R9 管，此处只判修改；passport 判定必须先于新增文件 continue，否则「先提原型再提 UI」的正规走法反被判无同行原型（2026-10-11 实测误报）
      pass_when:
        range_contains_scope: passport
    credential: null
    exempt: true
    exempt_note: R9b 在 bash 里是内联循环（不走 exempt_for_gate），口径必须与其它门一致
    message: 既有 UI 改动无同行原型/豁免
    loc_template: '{ui_file_count} 个文件 / {lines} 行'
