# 为什么放这里：这些门号的清单以前硬编码在采集脚本里，加一道凭证门要改脚本；
#   日志表头的列序又写在 markdown 里，两者对不上就静默错位（数据看起来正常，实际列错了）。
#   现在清单在 YAML 一处，采集脚本读它、gates-lint 校验日志表头与它一致。
#
# upgrade_candidates = 升 error 前必须有真实数据的门（观察对象）
# reference          = 不参与升级判断、只看趋势的参考指标
# 列序即 YAML 顺序 —— 日志表头的列必须按这个次序排。
