# quality-gate — PR 代码质量门禁（改动包 build/test）
#
#   changed-packages : 改动波及子包跑 build(=类型检查)+test（jest --runInBand）
#
# 2026-09-18：原 redline-scan job（scripts/redline/scan-rules.sh 红线扫描）随红线机制整体下线；
#   本 workflow 只保留「改动包 build/test」。
# 职责分离：auto-pr.yml 只负责建 PR，本 workflow 负责检查。
# 启用要求：master 分支保护开启，要求本 workflow 通过才可 merge。
name: quality-gate

on:
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changed-packages:
    name: 改动包 build/test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        name: pnpm setup
        with:
          version: 9   # 与本地 pnpm -v 对齐；若 lockfile 由其它 pnpm 生成需调整

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: 提取改动包并逐个 build/test
        run: |
          BASE="${{ github.event.pull_request.base.sha || 'origin/master' }}"
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            git fetch origin "${{ github.event.pull_request.base.sha }}" --depth=1 >/dev/null 2>&1 || true
          fi
          # 两点 diff（clean checkout 下 git diff <sha> 即 <sha>..HEAD）
          # lint 档（--lint）：只读检查，用 lint:ci（无 --fix），子包未配 lint 脚本则跳过。
          # 若某子包配了 lint 但缺 ESLint flat config 会在此失败——属存量问题，
          # 修复方式：补 eslint.config.*；临时绕过可去掉 --lint 参数。
          bash scripts/ci/changed-packages.sh "$BASE" --lint
