# quality-gate — PR 代码质量门禁（红线扫描 + 改动包 build/test）
#
#   redline-scan     : scripts/redline/scan-rules.sh 全量规则（R9–R14）扫 PR 范围
#   changed-packages : 改动波及子包跑 build(=类型检查)+test（jest --runInBand）
#
# 2026-09-18：redline-scan 曾随红线机制整体下线，本 workflow 只留「改动包 build/test」。
# 2026-09-24：红线机制已回归（scripts/redline/ + PreToolUse hook + commit-msg），但该 job
#   未跟着恢复 → R9–R14 全部失去 CI 兜底（本地 hook 可被 --no-verify 绕过）。本次恢复。
# 职责分离：auto-pr.yml 只负责建 PR，本 workflow 负责检查。
# 启用要求：master 分支保护开启，要求本 workflow 通过才可 merge。
#
# 2026-09-22：**lint 档暂时关闭**（下面步骤不再传 --lint）。原因：11 个子包配了 `lint:ci`
#   但全仓没有任何 ESLint 配置（无 eslint.config.* / .eslintrc*），ESLint 9 直接报
#   「couldn't find an eslint.config.(js|mjs|cjs) file」→ 任何改动这些包的 PR 必红（存量问题，
#   与改动内容无关；实例：PR #113 只改了 gateway 的 app.module.ts，gateway 的 build/test 全过、仅 lint 挂）。
#   恢复条件：给相关子包补 flat config（可用已装的 @typescript-eslint/*），先从 warn / 最小规则集起步，
#   再逐步收紧；恢复时把步骤里的 `--lint` 加回来即可。
name: quality-gate

on:
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  redline-scan:
    name: 红线扫描（R9–R14）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 扫描 PR 范围
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -n "$BASE" ]; then
            git fetch --no-tags origin "$BASE" --depth=1 >/dev/null 2>&1 || true
          else
            BASE="origin/master"
          fi
          echo "扫描范围: ${BASE}..HEAD"
          bash scripts/redline/scan-rules.sh diff "${BASE}..HEAD"

  changed-packages:
    name: 改动包 build/test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        name: pnpm setup
        with:
          version: 9   # 与本地 pnpm -v 对齐；若 lockfile 由其它 pnpm 生成需调整

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: 提取改动包并逐个 build/test
        run: |
          BASE="${{ github.event.pull_request.base.sha || 'origin/master' }}"
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            git fetch origin "${{ github.event.pull_request.base.sha }}" --depth=1 >/dev/null 2>&1 || true
          fi
          # 两点 diff（clean checkout 下 git diff <sha> 即 <sha>..HEAD）
          #
          # ⚠️ 这里刻意**不传 --lint**（2026-09-22 起暂时关闭，原因见文件头）：子包都配了 lint:ci
          # 但全仓没有 ESLint 配置，ESLint 9 一律报找不到 eslint.config.* → 任何后端 PR 必红。
          # 补上 flat config 后把 `--lint` 加回来即可恢复 lint 门。
          bash scripts/ci/changed-packages.sh "$BASE"
