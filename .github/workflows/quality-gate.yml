# quality-gate — PR 代码质量门禁（红线扫描 + 改动包 build/test）
#
#   redline-scan     : scripts/redline/scan-rules.sh 全量规则（R9–R14）扫 PR 范围
#   pipeline-lint    : scripts/pipeline-lint.mjs --scripts scripts（仓库内 .sh 静态体检）
#   changed-packages : 改动波及子包跑 build(=类型检查)+test（jest --runInBand）
#
# 2026-09-18：redline-scan 曾随红线机制整体下线，本 workflow 只留「改动包 build/test」。
# 2026-09-24：红线机制已回归（scripts/redline/ + PreToolUse hook + commit-msg），但该 job
#   未跟着恢复 → R9–R14 全部失去 CI 兜底（本地 hook 可被 --no-verify 绕过）。本次恢复。
# 职责分离：auto-pr.yml 只负责建 PR，本 workflow 负责检查。
# 启用要求：master 分支保护开启，要求本 workflow 通过才可 merge。
#
# 2026-10-13：新增 pipeline-lint job。**只体检仓库内的 .sh**（scripts/ 递归），
#   不碰 DB —— 动作脚本存在 deploy_pipeline_actions 里、含主机与路径信息，
#   而本仓库是 PUBLIC，导出即泄露；DB 侧仍靠运维定期 `--from-db` 体检。
#   拦的是两类最贵的事故：bash 语法错（L1）与 ssh 行尾缺续行符（L5，
#   2026-09-29 那次「脚本在 dev 机上删 prod 目录」就是它，bash -n 完全抓不到）。
#   上线前已全仓试跑：47 个 .sh，error 0（8 条 L6 warning 是已知的远端块误报，不阻断）。
#
# 2026-09-22：**lint 档暂时关闭**（下面步骤不再传 --lint）。原因：11 个子包配了 `lint:ci`
#   但全仓没有任何 ESLint 配置（无 eslint.config.* / .eslintrc*），ESLint 9 直接报
#   「couldn't find an eslint.config.(js|mjs|cjs) file」→ 任何改动这些包的 PR 必红（存量问题，
#   与改动内容无关；实例：PR #113 只改了 gateway 的 app.module.ts，gateway 的 build/test 全过、仅 lint 挂）。
#   恢复条件：给相关子包补 flat config（可用已装的 @typescript-eslint/*），先从 warn / 最小规则集起步，
#   再逐步收紧；恢复时把步骤里的 `--lint` 加回来即可。
#
# 2026-10-22：**lint 档已恢复**（配置 10-10 就位，开关滞后了 30 天——见《gates/03-治理与索引》缺口 P1-1）。
#   恢复前实测：全仓 error 已从基线 5 → 0，warning 325 → 328（存量演进，非新增破窗）。
#   恢复时补了两件事，否则这道门是半残的：
#     ① apps/shell、apps/deploy-console、packages/ui 原本**连 lint 脚本都没有** → CI 的
#        changed-packages --lint 会静默跳过这三个包（只覆盖 2/5 工程）；
#     ② 子包 lint:ci 都不带 --max-warnings → 只拦 error，存量 warning 涨了没人管。
#   因此拆成两道：改动包 lint（拦 error，快）+ 根级全量水位（拦 warning 总量），见下方两个步骤。
name: quality-gate

on:
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  redline-scan:
    name: 红线扫描（R9–R14）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 扫描 PR 范围
        run: |
          # 用 merge-base 取分叉点：pull_request.base.sha 是 base 分支的**当前** HEAD，
          # 未必是 head 的祖先；直接 `A..B` 会退化成「HEAD 的全部历史」（实测扫出 600+ 条
          # 历史 commit，把 R10/R11/R13/R14 全部误报）。merge-base 才是 PR 的真实差异范围。
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -n "$BASE" ] && git rev-parse --verify --quiet "${BASE}^{commit}" >/dev/null 2>&1; then
            BASE="$(git merge-base "$BASE" HEAD)"
          else
            BASE="$(git merge-base origin/master HEAD)"
          fi
          echo "扫描范围: ${BASE}..HEAD（$(git rev-list --count "${BASE}..HEAD") 个 commit）"
          bash scripts/redline/scan-rules.sh diff "${BASE}..HEAD"

  pipeline-lint:
    name: 流水线脚本体检（L1/L5/L6/L9）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 只用 Node 内置模块（child_process / fs），无需 pnpm install —— 这一档要跑得快，
      # 它是「改一行 shell 也要立刻知道有没有踩坑」的第一道反馈。
      - name: 体检仓库内 .sh（scripts/ 递归）
        run: node scripts/pipeline-lint.mjs --scripts scripts

  changed-packages:
    # ⚠️ 这个 name 不只是一句描述——**分支保护的 required status check 是按它匹配的**。
    # 2026-10-22 实测：把它改成「改动包 build/test/lint」后，CI 全绿但 PR 永久 BLOCKED
    # （GitHub 在等那个旧名字的 check，它永远不会再出现，界面上也不会提示缺了哪个）。
    # 要改名必须同时改 Settings → Branches → required checks，否则就是悄悄把门禁变成摆设。
    name: 改动包 build/test   # 含 lint（步骤见下），名字保持与分支保护一致
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        name: pnpm setup
        with:
          version: 9   # 与本地 pnpm -v 对齐；若 lockfile 由其它 pnpm 生成需调整

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: 提取改动包并逐个 build/test/lint
        run: |
          BASE="${{ github.event.pull_request.base.sha || 'origin/master' }}"
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            git fetch origin "${{ github.event.pull_request.base.sha }}" --depth=1 >/dev/null 2>&1 || true
          fi
          # 两点 diff（clean checkout 下 git diff <sha> 即 <sha>..HEAD）
          #
          # --lint 于 2026-10-22 恢复（配置 10-10 就位、开关滞后 30 天）。
          # 注意：这一档只拦 **error**——子包 lint:ci 均不带 --max-warnings，
          # 存量 warning 不在这里管（见下一步的根级全量水位）。
          bash scripts/ci/changed-packages.sh "$BASE" --lint

      # 全量水位：error 必须 0（子包 lint 已管），warning 不得超过基线。
      # 为什么用「总量」而不是「改动文件」：ESLint 不提供「只报新增行」，
      #   按文件判会误伤（apps/shell/src/main.ts 存量 25 条，改一行就必挂）。
      #   总量法的效果等价于「新增必须零告警」，且改存量文件不会误伤。
      # 纪律：水位**只降不升**——修掉存量后必须在同一 PR 下调 package.json 里的数字。
      - name: 全量 ESLint 水位（warning 不超基线）
        run: pnpm lint:ci

  # 交付物完整性检查（卡 2.4 · 2026-10-29）
  #
  # 判据源：~/AiWorkspace/20-私域资产/研发方案与发布规范-v2.md §2.10「交付物清单」四件套
  #   （方案 / 需求单 / 测试用例 / 交互清单）
  #
  # ⚠️ 为什么「拿不到任务目录就跳过」而不是报错：
  #   交付物大多落在**仓库外**的 ~/AiWorkspace/30-任务产物/…，CI runner 上默认不存在。
  #   若强制要求，CI 会 100% 红，且红灯原因与代码质量无关 —— 那是「永远红的门」，
  #   团队只会学会无视它。故默认跳过，只在显式提供 DELIVERABLES_DIR 时才真跑。
  #
  # 如何启用：仓库变量/环境变量 DELIVERABLES_DIR 指向任务目录（如
  #   /home/runner/work/AiWorkspace/30-任务产物/2026-10-29-xxx）
  #   —— 需要该目录在 runner 上真实存在（自托管 runner 或 checkout 同一 AiWorkspace 仓库时可用）。
  deliverables-check:
    name: 交付物完整性（四件套）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 交付物完整性检查
        env:
          DELIVERABLES_DIR: ${{ vars.DELIVERABLES_DIR }}
        run: |
          if [ -z "${DELIVERABLES_DIR:-}" ]; then
            echo "跳过：未提供 DELIVERABLES_DIR（交付物在仓库外，CI 上默认不可得）"
            echo "如需启用：设置仓库变量 DELIVERABLES_DIR 指向任务目录绝对路径"
            exit 0
          fi
          if [ ! -d "$DELIVERABLES_DIR" ]; then
            echo "跳过：DELIVERABLES_DIR 指向的目录不存在：$DELIVERABLES_DIR"
            exit 0
          fi
          bash scripts/verify-deliverables.sh "$DELIVERABLES_DIR" "${GITHUB_SHA:-}"

      - name: 校验脚本自身可用（语法 + 自检）
        run: |
          bash -n scripts/verify-deliverables.sh
          bash scripts/verify-deliverables.sh --self-check

  # 原型体系静态门禁（2026-10-22 立）：拦「零散原型稿」与「登记与源稿脱节」
  #
  # 为什么不只靠本地脚本：散落的根因不是「不会跑」，是「没人提醒要跑」。
  # 本地脚本可以被忽略，PR 门禁不能。
  #
  # 只跑**静态**三步（build / audit / adopt），三个脚本都只用 Node 内置模块，无需 install。
  # 四条浏览器机检（verify-agents-hub 等）依赖 puppeteer + Chrome，留在本地/发布前跑：
  # 装 Chrome 会让这个 job 从 20 秒变成几分钟，反馈一慢就没人看它。
  proto-static-check:
    name: 原型体系静态门禁（散落稿 / 登记自洽 / 可并入性）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 构建整合稿并校验「生成物 = 注册表」
        run: |
          node scripts/build-agents-hub.mjs
          # build 会重写 docs/ui/prototypes/admin-agents-hub.html。
          # 若与提交版本不同 → 要么改了源稿/注册表却没重跑 build，要么有人手改了生成物。
          # 两种情况都会让「以整合稿为准」的评审看到过期内容。
          if ! git diff --quiet -- docs/ui/prototypes/admin-agents-hub.html; then
            echo "::error::整合稿与注册表不一致。请在本地重跑 node scripts/build-agents-hub.mjs 并提交生成物。"
            git diff --stat -- docs/ui/prototypes/admin-agents-hub.html
            exit 1
          fi

      - name: 审计（散落稿 / 版本族 / 登记自洽）
        run: node scripts/audit-proto-registry.mjs

      - name: 已并入稿的可并入性回归
        run: node scripts/check-proto-adopt.mjs --registered
