# 给每个 PR 挂「自动合入」（兜底，覆盖 auto-pr 建不到的 PR）
#
# 为什么还需要它：`auto-pr.yml` 只在 **push 到 feature/* 或 fix/* 分支**时建 PR 并顺带启用
# 自动合入 —— 其余分支（chore/、docs/、perf/ …）或**手工在网页建的 PR** 不会走那条路，
# 于是出现「PR 开着、CI 全绿、但没人合」的静默挂起（2026-09-30 复盘：#239 挂 auto 后
# 仍等了 7 分钟，因为分支落后 master 触发 BLOCKED，需要 update-branch 再跑一轮 CI）。
# 本 workflow 与 auto-pr.yml 的挂载逻辑 **幂等重复调用**，谁先跑都一样；
# 两处都用 GraphQL `enablePullRequestAutoMerge`，并**回查 autoMergeRequest** 确认真挂上了。
#
# 合入方式：与仓库惯例一致用 **merge**（保留分支历史）；auto-pr.yml 也同步改为 merge。
#
# 安全边界：
#   - 只处理**同仓库**分支的 PR（fork PR 直接跳过），因为要读 Secret；
#     事件用 `pull_request`（不是 pull_request_target），不 checkout 任何被改代码，只调 API。
#   - draft PR 不挂自动合入（避免草稿被自动合）。
#   - 合并仍需分支保护放行（checks 全绿 + 与 master 同步），本 workflow **不绕过任何门禁**：
#     它只是把「等绿了自动合」这件事挂上，绿灯之前不会合。
#
# 凭据：与 auto-pr.yml 同源的 Secret `AUTO_PR_TOKEN`（PAT，需 pull_requests:write +
#       contents:write）。**缺失即失败**，不回退 GITHUB_TOKEN —— 静默回退是 2026-09-24
#       事故的根因（表现为「CI 红了但一个 job 都没有」，排查极易误判）。
name: auto-merge

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  # master 前进后扫一遍开放 PR（修 #407 的残留缺口）——
  # 「master 前进导致 PR 落后」**不产生 pull_request 事件**，只靠上面的触发点，
  # 落后的 PR 会一直等到有人往它上面推代码为止。
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    runs-on: ubuntu-latest
    # 同仓库分支 + 非草稿：fork PR 拿不到 Secret，跳过即可（不失败、不误合）
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.draft == false
      && !startsWith(github.event.pull_request.head.ref, 'feature/manual-review/')
    steps:
      - name: 校验 AUTO_PR_TOKEN
        env:
          AUTO_PR_TOKEN: ${{ secrets.AUTO_PR_TOKEN }}
        run: |
          if [ -z "$AUTO_PR_TOKEN" ]; then
            echo "::error::仓库 Secret AUTO_PR_TOKEN 未配置或为空（与 auto-pr.yml 同源）。请在 Settings → Secrets and variables → Actions 新建/更新 AUTO_PR_TOKEN（fine-grained PAT，权限 pull_requests:write + contents:write）。缺失时本 workflow 不回退 GITHUB_TOKEN，以便凭证问题当场暴露。"
            exit 1
          fi
          echo "AUTO_PR_TOKEN 已配置（长度 ${#AUTO_PR_TOKEN}）"

      - name: 启用自动合入（merge）
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.AUTO_PR_TOKEN }}
          script: |
            // 为什么用 GraphQL 而不是 REST（2026-10-23 修 #396）：
            // 此前写的是 `github.rest.pulls.enableAutoMerge(...)`，**octokit 里没有这个方法**，
            // 每次调用都抛 TypeError 被 catch 成 warning → job 恒绿、CI 面板看不出来，
            // 「PR 全绿自动合入」这条承诺实际上从未生效过（PR #394 实测：全绿后静默挂起）。
            // REST 侧只有读接口 GET /pulls/{n}（读 auto_merge），**没有 enable 动作**；
            // 真正能挂上的是 GraphQL mutation `enablePullRequestAutoMerge`。
            const { repo, owner } = context.repo;
            const pull_number = context.payload.pull_request.number;

            const QUERY = `query($owner:String!,$repo:String!,$num:Int!){
              repository(owner:$owner,name:$repo){ pullRequest(number:$num){
                id state isDraft
                autoMergeRequest { enabledAt mergeMethod }
              } } }`;

            try {
              const got = await github.graphql(QUERY, { owner, repo, num: pull_number });
              const pr = got.repository.pullRequest;
              if (!pr) throw new Error(`读不到 PR #${pull_number}`);
              if (pr.state !== 'OPEN') {
                console.log(`PR #${pull_number} 当前是 ${pr.state}，无需挂自动合入`);
              } else if (pr.autoMergeRequest) {
                console.log(`PR #${pull_number} 自动合入已启用（mergeMethod=${pr.autoMergeRequest.mergeMethod}），幂等跳过`);
              } else {
                await github.graphql(
                  `mutation($id:ID!,$m:PullRequestMergeMethod!){
                     enablePullRequestAutoMerge(input:{pullRequestId:$id, mergeMethod:$m}){
                       pullRequest { number autoMergeRequest { enabledAt mergeMethod } } } }`,
                  { id: pr.id, m: 'MERGE' },
                );
                // 回查实际状态，不看调用是否抛错 —— 这正是 #396 的回归判据：
                // 「日志没 warning」不等于「真的挂上了」（warning 消失也可能只是把 catch 删了）。
                const after = await github.graphql(QUERY, { owner, repo, num: pull_number });
                const enabled = after.repository.pullRequest.autoMergeRequest;
                if (!enabled) {
                  throw new Error('enablePullRequestAutoMerge 未报错，但 autoMergeRequest 仍为 null');
                }
                console.log(`PR #${pull_number} 已启用自动合入（mergeMethod=${enabled.mergeMethod}）：CI 全绿且与 master 同步后自动合并`);
              }
            } catch (e) {
              // 本 job 的唯一职责就是挂自动合入，挂不上就**必须红**。
              // 原实现降级为 warning 的代价是：一条承诺过的能力悄悄不存在，半年没人发现。
              core.setFailed(
                `PR #${pull_number} 启用自动合入失败：${e.message}｜` +
                `检查：Settings→General 勾选 Allow auto-merge；master 分支保护允许 merge commit；` +
                `AUTO_PR_TOKEN 需 pull_requests:write（GraphQL 同样走此权限）`,
              );
            }

      # 落后 master 时自动同步（修 #407）
      #
      # 为什么需要这一步：GitHub 的 auto-merge 语义是「条件满足了就合」，**不是**把条件补齐。
      # 分支落后 master 时 mergeStateStatus=BEHIND，自动合入会一直等 —— PR #404 实测：
      # 6 项 checks 全绿、autoMergeRequest 已挂，等了 2.5 分钟纹丝不动，
      # 手动 `gh pr update-branch` 后立刻推进。同一现象 auto-merge.yml 头部注释里
      # 早记过（#239 等了 7 分钟），第二次踩，所以挪进代码。
      #
      # 权限：`updatePullRequestBranch` 需要 **contents: write**（仅挂合入只需 pull_requests:write）。
      # token 没给 contents 写时这里**只 warning 不判红** —— 因为「PR 该不该合」没被破坏，
      # 只是没自动补齐条件；判红会让每次落后都红一片，反而盖住真正的问题。
      - name: 落后 master 时自动同步分支
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.AUTO_PR_TOKEN }}
          script: |
            const { repo, owner } = context.repo;
            const n = context.payload.pull_request.number;

            const getPr = async () =>
              (await github.rest.pulls.get({ owner, repo, pull_number: n })).data;

            let pr = await getPr();
            // mergeable_state 由 GitHub 异步计算，刚 push 完常为 unknown —— 等一轮再读，
            // 否则会把「还没算完」误当成「不需要同步」。
            if (pr.mergeable_state === 'unknown') {
              await new Promise((r) => setTimeout(r, 3000));
              pr = await getPr();
            }
            if (pr.mergeable_state !== 'behind') {
              console.log(`PR #${n} mergeable_state=${pr.mergeable_state}，无需同步分支`);
              return;
            }

            // 安全阀：head 已是「把 base 合进来」的 merge commit 时跳过。
            // 防的是 synchronize 触发后 mergeable_state 短暂仍报 behind 导致的重复同步。
            //
            // ⚠️ 基准不能用 `pr.base.sha`（=该 PR 记录里的 base，master 前进后不更新）：
            // 用它比对会把「落后」误判成「已同步」（#417 实测，详见 sync-behind-on-master 里同段注释）。
            // 这里没有 push 事件的 `payload.after`，直接问 API 要当前 base 分支 tip。
            const baseBranch = (await github.rest.repos.getBranch({ owner, repo, branch: pr.base.ref })).data.commit.sha;
            const headCommit = (await github.rest.repos.getCommit({ owner, repo, ref: pr.head.sha })).data;
            if ((headCommit.parents || []).some((p) => p.sha === baseBranch)) {
              console.log(`PR #${n} head 已包含 base ${baseBranch.slice(0, 7)}，跳过（防重复同步）`);
              return;
            }

            try {
              // ⚠️ `$oid` 必须声明成 **GitObjectID!**，不是 String! ——
              // 写 String! 会被 schema 拒：`Type mismatch on variable $oid and argument
              // expectedHeadOid (String! / GitObjectID)`（PR #409 实测，mock 测不出来，
              // 因为假 graphql 不校验 schema）。
              await github.graphql(
                `mutation($id:ID!,$oid:GitObjectID!){
                   updatePullRequestBranch(input:{pullRequestId:$id, expectedHeadOid:$oid, updateMethod:MERGE}){
                     pullRequest { number } } }`,
                { id: pr.node_id, oid: pr.head.sha },
              );
              // 同步会推一个新提交 → 触发新一轮 CI（synchronize），自动合入保持有效
              core.notice(`PR #${n} 落后 master，已触发自动同步；CI 会重跑一轮，自动合入仍有效`);
            } catch (e) {
              core.warning(
                `PR #${n} 落后 master，自动同步失败：${e.message}｜` +
                `常见原因：① AUTO_PR_TOKEN 缺 contents:write；② GraphQL 变量类型不对` +
                `（expectedHeadOid 要 GitObjectID!）｜临时修法：gh pr update-branch ${n}`,
              );
            }

  # master 前进后，把所有「落后」的开放 PR 同步一次（2026-10-23，修 #407 的残留缺口）
  #
  # 为什么必须单独一个 job：
  #   `pull_request` 事件只在 PR 自己身上有动作时触发（opened / synchronize / ready_for_review …）。
  #   「master 前进 → PR 变 BEHIND」这条因果链里，**PR 侧一个事件都没有**。
  #   所以上面那个「落后 master 时自动同步」的 step 写得再对也叫不醒 ——
  #   它只在「PR 刚好有动静、且此刻恰好落后」时才跑得到。
  #   实测（2026-10-23）：PR #417 12:30 变 BEHIND，之后 #418、#419 接连合入 master，
  #   它一直是 BEHIND、autoMergeRequest 明明挂着却一动不动，只能人工 `gh pr update-branch`。
  #   → 触发点要挂在「master 前进」这个**原因**上，而不是「PR 有动静」这个无关现象上。
  #
  # 边界：只处理前 100 个开放 PR（本仓库常年个位数）；只同步、不合入；失败只 warning。
  #   失败为什么不判红：同步是「补齐条件」，没补上 ≠ 合错了。
  #   判红会让每次 master 前进都可能红一片，把真问题盖掉（与上面 step 的判断一致）。
  sync-behind-on-master:
    runs-on: ubuntu-latest
    steps:
      - name: 校验 AUTO_PR_TOKEN
        env:
          AUTO_PR_TOKEN: ${{ secrets.AUTO_PR_TOKEN }}
        run: |
          if [ -z "$AUTO_PR_TOKEN" ]; then
            echo "::error::仓库 Secret AUTO_PR_TOKEN 未配置或为空（与 auto-pr.yml 同源）。见本文件头部说明。"
            exit 1
          fi
          echo "AUTO_PR_TOKEN 已配置（长度 ${#AUTO_PR_TOKEN}）"

      - name: 同步所有落后 master 的开放 PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.AUTO_PR_TOKEN }}
          script: |
            const { repo, owner } = context.repo;
            console.log('扫描 master 前进后落后的开放 PR');

            // 只取第一页 100 个：本仓库常年个位数开放 PR，翻页只会白多一次 API 调用。
            const open = (await github.rest.pulls.list({ owner, repo, state: 'open', per_page: 100 })).data;
            if (!open.length) {
              console.log('没有开放 PR，结束');
              return;
            }

            let synced = 0;
            for (const it of open) {
              if (it.draft) {
                console.log(`PR #${it.number} 是草稿，跳过`);
                continue;
              }
              // 同仓库分支才处理：fork PR 拿不到 Secret，也不该去动别人仓库的分支
              if (!it.head || !it.head.repo || it.head.repo.full_name !== `${owner}/${repo}`) {
                console.log(`PR #${it.number} 来自 fork，跳过`);
                continue;
              }

              const read = async () =>
                (await github.rest.pulls.get({ owner, repo, pull_number: it.number })).data;
              let pr = await read();
              // mergeable_state 由 GitHub 异步计算：master 刚推上来时几乎必然是 unknown，
              // 等一轮再读 —— 否则会把「还没算完」当成「不需要同步」（上面 step 踩过同一个坑）。
              if (pr.mergeable_state === 'unknown') {
                await new Promise((r) => setTimeout(r, 3000));
                pr = await read();
              }
              if (pr.mergeable_state !== 'behind') {
                console.log(`PR #${it.number} mergeable_state=${pr.mergeable_state}，无需同步`);
                continue;
              }
              // 安全阀：head 已经是「把 base 合进来」的 merge commit 就跳过。
              // 防的是 master 连推两次时对同一个 PR 重复同步 —— 每次同步都会触发一轮 CI。
              //
              // ⚠️ 比对基准**不能用 `pr.base.sha`**：那是该 PR 记录里的 base（分支上次
              // 合并/分叉时的 master 提交），**master 前进后它不会跟着变**。
              // 实测 2026-10-23：#417 的 head 467c06a1 是 merge commit，父提交含
              // `pr.base.sha = 3a0d83b9`（旧 master），而当时 master tip 已是 21725b60 ——
              // 用它比对会把「落后 2 个提交」误判成「已同步」，落后 PR 被永远跳过。
              // 正确基准 = 当前 master tip：push 事件直接取 `context.payload.after`（零 API
              // 且绝对准确），其他事件退回 `repos.getBranch(base.ref)`。
              const baseTip = async () => {
                if (context.payload && context.payload.after) return context.payload.after;
                const b = await github.rest.repos.getBranch({ owner, repo, branch: pr.base.ref });
                return b.data.commit.sha;
              };
              const baseTipSha = await baseTip();
              const headCommit = (await github.rest.repos.getCommit({ owner, repo, ref: pr.head.sha })).data;
              if ((headCommit.parents || []).some((p) => p.sha === baseTipSha)) {
                console.log(`PR #${it.number} head 已含 base ${baseTipSha.slice(0, 7)}，跳过（防重复同步）`);
                continue;
              }

              try {
                // ⚠️ $oid 必须 GitObjectID!（写 String! 线上报 Type mismatch，#409）
                await github.graphql(
                  `mutation($id:ID!,$oid:GitObjectID!){
                     updatePullRequestBranch(input:{pullRequestId:$id, expectedHeadOid:$oid, updateMethod:MERGE}){
                       pullRequest { number } } }`,
                  { id: pr.node_id, oid: pr.head.sha },
                );
                synced += 1;
                core.notice(`PR #${it.number} 落后 master，已触发同步；CI 会重跑一轮，自动合入仍有效`);
              } catch (e) {
                core.warning(
                  `PR #${it.number} 同步失败：${e.message}｜` +
                  `临时修法：gh pr update-branch ${it.number}`,
                );
              }
            }
            console.log(`本轮共同步 ${synced} 个 PR`);
