# 自动提 PR 到 master
#
# 触发：push 到任意非 master/main 分支时，自动创建 PR 到 master。
# 幂等：若该分支已存在 PR，则跳过（不重复创建）。
# 凭据：优先用仓库 Secret `AUTO_PR_TOKEN`（PAT），未配置时回退内置 GITHUB_TOKEN。
#   为什么必须用 PAT：**由 GITHUB_TOKEN 创建的事件不会触发后续 workflow**（GitHub 防递归机制），
#   所以用 GITHUB_TOKEN 建的 PR，其 CI（quality-gate）会卡在 `action_required`，每次都要人工批准。
#   改用 PAT 建 PR 后，PR 上的 workflow 会正常自动运行。
#   配置：Settings → Secrets and variables → Actions → New repository secret
#         名称 `AUTO_PR_TOKEN`，值 = 具备 pull_requests:write + contents:read 的 fine-grained PAT
#         （与本地根 .env 的 GITHUB_PR_TOKEN 同一个即可）。
# 权限：本 workflow 声明 pull-requests: write；PAT 自身权限以该 token 的配置为准。
# 回退路径（未配 AUTO_PR_TOKEN）仍需在 Settings → Actions → General 开启
# "Workflow permissions: Read and write permissions"。
name: auto-pr

on:
  push:
    branches-ignore:
      - master
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    # 只在 feature/* 或 fix/* 开发分支自动建 PR，避免 docs/、release/ 等误建。
    # 例外：长期 / 集成分支不自动建 PR —— 它们生命周期长、持续与 master 双向分叉，
    # 每次 push 都会产出「提交数上百、文件数上百、必然冲突」的巨型残影 PR
    # （feature/test → #40、feature/kedou-ai-minigram → #130 即此）。
    # #130 还叠了一层成因：幂等检查只看 state=open 的 PR，同名 PR（#129）合并后再 push 又会新建。
    # 这类分支的改动应按主题拆成短命分支各自走 auto-pr，才是可评审、可回滚的粒度。
    if: >-
      (startsWith(github.ref_name, 'feature/') || startsWith(github.ref_name, 'fix/'))
      && !contains(fromJSON('["feature/test", "feature/kedou-ai-minigram"]'), github.ref_name)
    steps:
      - uses: actions/checkout@v4

      - name: 自动创建 PR 到 master
        id: pr
        uses: actions/github-script@v7
        with:
          # 优先 PAT（见文件头说明）；未配置该 secret 时回退 GITHUB_TOKEN（其 PR 的 CI 需人工批准）
          github-token: ${{ secrets.AUTO_PR_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const { repo, owner } = context.repo;
            const head = context.ref.replace(/^refs\/heads\//, '');
            const base = 'master';

            // 1) 幂等检查：该分支是否已有 PR
            const { data: existing } = await github.rest.pulls.list({
              owner, repo, state: 'open', head: `${owner}:${head}`, base,
            });
            if (existing.length > 0) {
              console.log(`已存在 PR #${existing[0].number}，跳过创建`);
              return { skipped: true, number: existing[0].number, url: existing[0].html_url };
            }

            // 2) 生成标题 / body：比较 base↔head 取出全部提交（注意：
            //    pulls.listCommits 只能列已存在 PR 的提交且必须传 pull_number，
            //    新分支还没有 PR，应用 repos.compareCommits 取两分支间提交）
            const { data: compare } = await github.rest.repos.compareCommits({
              owner, repo, base, head,
            });
            const commits = compare.commits || [];
            const titles = commits.slice(0, 5).map((c) => c.commit.message.split('\n')[0]);
            const title = titles[0] ? titles[0].slice(0, 100) : `feat(${head}): 变更`;
            const body = [
              `## 自动生成的 PR（由 GitHub Actions 创建）`,
              ``,
              `- **分支**: \`${head}\` → \`${base}\``,
              `- **提交数**: ${commits.length}`,
              ``,
              `### 提交列表`,
              ...commits.map((c) => `- ${c.commit.message.split('\n')[0]}`),
              ``,
              `> 请 review 后合并。若描述需完善，可手动编辑。`,
            ].join('\n');

            // 3) 创建 PR
            const { data: pr } = await github.rest.pulls.create({
              owner, repo, title, head, base, body,
            });
            console.log(`PR 已创建: #${pr.number} ${pr.html_url}`);
            return { created: true, number: pr.number, url: pr.html_url };
