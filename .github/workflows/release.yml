# release — 合并到集成分支后自动发布到本机（GitHub Actions → 发布目录）
#
# 设计：specs/ci-cd/gh-actions-release.md
#   模块分两路，同一个 job 内分流：
#     ① deploy-console（发布平台自己）→ **本 job 直连执行**
#        它不能走平台流水线：restart 阶段 `pm2 restart web-deploy-console` 会把执行流水线的
#        进程自己杀掉，且其后还有 version/pointer/verify 同在进程内 → 永久卡 running 并占锁。
#     ② 其余模块 → 投递发布平台 `POST /api/hooks/release`，由平台流水线执行
#        （锁/审批/审计/回滚/版本指针全部保留，CI 不绕过治理）
#
# 触发（决策 2026-09-11）：**仅 feature/test**（集成分支 → local）；
#   master 不自动发布，需要时用 workflow_dispatch 手动指定。
#
# 前置条件：
#   1) 本机注册 self-hosted runner，label `local-release`
#      （deploy-console 与发布目录都在本机；runner 的 PATH 需含 node/pm2，否则找不到 nest/pm2）
#   2) 仓库 Variables：`RELEASE_DIR`（可选，默认 /Users/geekwen/web_system_release）
#   3) 仓库 Secrets：
#        RELEASE_HOOK_URL      发布平台地址（如 http://127.0.0.1:6200）
#        RELEASE_HOOK_SECRET   与平台 .env 的 RELEASE_HOOK_SECRET 一致
#        DEPLOY_CONSOLE_TOKEN  控制台 JWT（仅用于轮询流水线状态，建议 CI 专用账号并定期轮换）
#
# 安全：HMAC-SHA256 签名（X-Hub-Signature-256）+ 时间戳防重放 + deliveryId 幂等；
#       验签对象是原始请求体，签名用 node 计算，避免 jq/openssl 环境差异。
name: release

on:
  push:
    branches: [feature/test]
  workflow_dispatch:
    inputs:
      env:
        description: 目标环境（本地日常为 local）
        required: true
        default: local
      modules:
        description: 模块 key（逗号分隔，留空 = 自动解析本次改动）
        required: false

permissions:
  contents: read

# 同一分支的多次合并串行发布，避免两个发布互相重启服务
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: 发布（${{ github.event.inputs.env || 'local' }}）
    runs-on: [self-hosted, local-release]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 解析本次改动模块
        id: plan
        env:
          INPUT_ENV: ${{ github.event.inputs.env }}
          INPUT_MODULES: ${{ github.event.inputs.modules }}
          # 本地无法发布的模块：mini-contract 的 build 命令是上传微信小程序（需微信密钥）
          SKIP_MODULES: mini-contract
        run: |
          set -euo pipefail
          ENV="${INPUT_ENV:-local}"
          BRANCH="${GITHUB_REF_NAME}"
          COMMIT="$(git rev-parse --short HEAD)"

          if [ -n "${INPUT_MODULES:-}" ]; then
            MODULES="$(echo "$INPUT_MODULES" | tr ',' ' ')"
          else
            # 取本次 push 触达的 servers/<svc> 与 apps/<app>，目录名即 moduleKey
            BASE="$(git rev-parse HEAD~1 2>/dev/null || echo HEAD)"
            MODULES="$(git diff --name-only "$BASE" HEAD \
              | grep -E '^(servers|apps)/' || true \
              | cut -d/ -f2 | sort -u | tr '\n' ' ')"
          fi

          HAS_CONSOLE=false
          REST=""
          for M in $MODULES; do
            case " $SKIP_MODULES " in
              *" $M "*) echo "跳过（本地不可发布）: $M"; continue ;;
            esac
            if [ "$M" = "deploy-console" ]; then HAS_CONSOLE=true; else REST="$REST $M"; fi
          done
          REST="$(echo "$REST" | xargs || true)"

          echo "env=$ENV" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "has_console=$HAS_CONSOLE" >> "$GITHUB_OUTPUT"
          echo "modules=$REST" >> "$GITHUB_OUTPUT"

          if [ "$HAS_CONSOLE" = "false" ] && [ -z "$REST" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "本次无需要发布的模块（仅文档/配置改动）"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "plan: env=$ENV branch=$BRANCH commit=$COMMIT deploy-console=$HAS_CONSOLE modules=[$REST]"
          fi

      # ── ① deploy-console：直连执行（不能走平台流水线，见文件头说明） ──
      - name: 发布 deploy-console（直连执行）
        if: steps.plan.outputs.has_console == 'true'
        env:
          RELEASE_DIR: ${{ vars.RELEASE_DIR || '/Users/geekwen/web_system_release' }}
          PLAN_BRANCH: ${{ steps.plan.outputs.branch }}
        run: |
          set -euo pipefail
          echo "发布目录: $RELEASE_DIR（分支 $PLAN_BRANCH）"
          bash "$GITHUB_WORKSPACE/scripts/release-deploy-console.sh" --branch "$PLAN_BRANCH"

      # ── ② 其余模块：投递平台流水线（保留平台全部治理） ──
      - name: 投递其余模块并轮询至终态
        if: steps.plan.outputs.skip == 'false' && steps.plan.outputs.modules != ''
        env:
          RELEASE_HOOK_URL: ${{ secrets.RELEASE_HOOK_URL }}
          RELEASE_HOOK_SECRET: ${{ secrets.RELEASE_HOOK_SECRET }}
          DEPLOY_CONSOLE_TOKEN: ${{ secrets.DEPLOY_CONSOLE_TOKEN }}
          PLAN_ENV: ${{ steps.plan.outputs.env }}
          PLAN_BRANCH: ${{ steps.plan.outputs.branch }}
          PLAN_COMMIT: ${{ steps.plan.outputs.commit }}
          PLAN_MODULES: ${{ steps.plan.outputs.modules }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          : "${RELEASE_HOOK_URL:?缺 secrets.RELEASE_HOOK_URL}"
          : "${RELEASE_HOOK_SECRET:?缺 secrets.RELEASE_HOOK_SECRET}"

          sign() { # $1=timestamp $2=body → 输出 sha256=<hex>
            node -e '
              const c = require("crypto");
              const [ts, body] = process.argv.slice(1);
              process.stdout.write(
                "sha256=" + c.createHmac("sha256", process.env.RELEASE_HOOK_SECRET)
                  .update(ts + "." + body).digest("hex")
              );
            ' "$1" "$2"
          }
          jget() { # $1=json $2=key
            printf '%s' "$1" | node -e '
              let s = "";
              process.stdin.on("data", (d) => (s += d)).on("end", () => {
                try { const j = JSON.parse(s); process.stdout.write(String(j[process.argv[1]] ?? "")); }
                catch { process.stdout.write(""); }
              });
            ' "$2"
          }

          failed=0
          for MOD in $PLAN_MODULES; do
            DELIVERY="${RUN_ID}-${GITHUB_RUN_ATTEMPT:-1}-${MOD}"
            BODY="$(node -e '
              const [d, env, m, b, c] = process.argv.slice(1);
              process.stdout.write(JSON.stringify({
                deliveryId: d, env, moduleKey: m, branch: b, commitId: c,
                mode: "direct", source: "release.yml", event: "push",
              }));
            ' "$DELIVERY" "$PLAN_ENV" "$MOD" "$PLAN_BRANCH" "$PLAN_COMMIT")"

            TS="$(date +%s)"
            SIG="$(sign "$TS" "$BODY")"
            RESP="$(curl -sS -m 20 -X POST "$RELEASE_HOOK_URL/api/hooks/release" \
              -H 'Content-Type: application/json' \
              -H "X-Hub-Signature-256: $SIG" \
              -H "X-Ws-Timestamp: $TS" \
              --data "$BODY")" || { echo "::error::投递失败: $MOD"; failed=1; continue; }

            JOB="$(jget "$RESP" jobId)"
            if [ -z "$JOB" ]; then
              echo "::error::未拿到 jobId: $MOD → $RESP"
              failed=1
              continue
            fi
            echo "已受理: $MOD → jobId=$JOB"

            # 轮询至终态（最长 20 分钟）
            for i in $(seq 1 120); do
              sleep 10
              ST_JSON="$(curl -sS -m 15 "$RELEASE_HOOK_URL/api/pipelines/$JOB" \
                -H "Authorization: Bearer $DEPLOY_CONSOLE_TOKEN")" || continue
              ST="$(jget "$ST_JSON" status)"
              case "$ST" in
                succeeded) echo "✓ $MOD 发布成功"; break ;;
                failed|cancelled) echo "::error::$MOD 发布失败（$ST）"; failed=1; break ;;
                rejected) echo "::error::$MOD 被拒绝（并发锁未获取）"; failed=1; break ;;
              esac
              if [ "$i" -eq 120 ]; then
                echo "::error::$MOD 轮询超时（20min）"; failed=1
              fi
            done
          done

          exit $failed
