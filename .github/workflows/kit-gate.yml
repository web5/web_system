# kit-gate — 数字人 kit 结构守护（L1'）
#
# 设计：docs/development/ai-native-sdlc-ci-deployment.md §3.4
#   数字人能力**唯一来源** = .codebuddy/agent-kit/（由 ai-agent-kit 仓库 CI 同步而来）
#   运行源 .codebuddy/skills/ = 能力源 skills 全量镜像 + 项目专属 be-developer/fe-developer
#                               + rd-digital-agent/references/project-context.md
#
#   检查项（scripts/redline/check-kit-structure.sh，本地与 CI 同一份脚本）：
#     S1 必需文件齐全 / S2 无孤儿 skill / S3 frontmatter 与目录名一致 / S4 占位残留
#     S5 Hub 决策树路由目标存在 / S6 红线有判定手段 / S7 运行源与能力源零漂移
#
#   完整评测（L2~L4）在上游 ai-agent-kit 源仓库运行；本项目只做结构守护，不再自建评测报告门禁。
name: kit-gate

on:
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structure:
    name: L1 结构检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: kit 结构完备检查 (S1~S7)
        run: bash scripts/redline/check-kit-structure.sh
